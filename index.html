                              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,color:plan.color,fontWeight:700,marginTop:8}}>
                                Target: {ex.sets} sets · {ex.reps} reps · rest {ex.rest}
                              </div>
                            </div>
                          </div>
                        }
                        front={<>

                      {/* Column headers */}
                      <div style={{display:"grid",gridTemplateColumns:"32px 1fr 1fr 40px",gap:6,padding:"0 14px 6px",alignItems:"center"}}>
                        {["SET","WEIGHT (lbs)","REPS DONE",""].map((h,hi)=>(
                          <div key={hi} style={{fontFamily:"'DM Sans',sans-serif",fontSize:9,fontWeight:600,color:"#444466",textTransform:"uppercase",letterSpacing:0.5,textAlign: hi===3?"center":"left"}}>{h}</div>
                        ))}
                      </div>

                      {/* Per-set rows */}
                      <div style={{display:"flex",flexDirection:"column",gap:5,padding:"0 14px 12px"}}>
                        {setsData.map((s, si) => {
                          const isTiming = isActive && activeTimer?.setNum === si+1;
                          return (
                            <div key={si} style={{
                              display:"grid", gridTemplateColumns:"32px 1fr 1fr 40px", gap:6, alignItems:"center",
                              padding:"6px 8px", borderRadius:10,
                              background: isTiming ? `${plan.color}22` : s.done ? `${plan.color}14` : "rgba(255,255,255,0.03)",
                              border: isTiming ? `1px solid ${plan.color}66` : s.done ? `1px solid ${plan.color}22` : "1px solid transparent",
                              transition:"all 0.2s",

                              {/* Set badge */}
                              <div style={{
                                fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:900,

                              {/* Weight input */}

                                  padding:"5px 8px", borderRadius:8,
                                  background: s.done ? "rgba(255,255,255,0.04)" : "rgba(255,255,255,0.07)",
                                  border:`1px solid ${s.lbs ? plan.color+"55" : "rgba(255,255,255,0.08)"}`,
                                  color: s.lbs ? "#fff" : "#444466",
                                  fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:700,
                                  width:"100%", outline:"none", textAlign:"center",
                                }}
                              />

                              {/* Reps input */}
                              <input
                                type="number" step="1" min="0" max="99"
                                value={s.reps}
                                placeholder={ex.reps.split("–")[0]}
                                onChange={e => updateSet(ex, si, "reps", e.target.value)}
                                style={{
                                  padding:"5px 8px", borderRadius:8,
                                  background: s.done ? "rgba(255,255,255,0.04)" : "rgba(255,255,255,0.07)",
                                  border:`1px solid ${s.reps ? "#39d98a55" : "rgba(255,255,255,0.08)"}`,
                                  color: s.reps ? "#fff" : "#444466",
                                  fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:700,
                                  width:"100%", outline:"none", textAlign:"center",
                                }}
                              />

                              {/* Done toggle */}
                              <button
                                onClick={() => updateSet(ex, si, "done", !s.done)}
                                style={{
                                  width:34, height:34, borderRadius:9, border:"none", cursor:"pointer",
                                  background: isTiming ? `${plan.color}44` : s.done ? plan.color : "rgba(255,255,255,0.07)",
                                  color: s.done ? "#000" : isTiming ? plan.color : "#333355",
                                  fontSize: isTiming ? 14 : 13,
                                  transition:"all 0.2s",
                                  transform: isTiming ? "scale(1.1)" : "scale(1)",
                                  boxShadow: isTiming ? `0 0 10px ${plan.color}55` : "none",
                                  display:"flex",alignItems:"center",justifyContent:"center",
                                  margin:"0 auto",
                                }}
                              >{isTiming ? "⏱" : s.done ? "✓" : "○"}</button>
                            </div>
                          );
                        })}
                      </div>
                      </>}/>

                      {/* Progress bar */}
                      <div style={{height:2,background:"rgba(255,255,255,0.04)"}}>
                        <div style={{height:"100%",width:`${(doneCount/total)*100}%`,background:`linear-gradient(90deg,${plan.color}66,${plan.color})`,transition:"width 0.4s ease"}}/>
                      </div>
                    </div>
                  );
                })}
              </div>
            </>
          )
        )}

        {/* MEALS TAB */}
        {tab==="meals" && (
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {MEALS.map((meal, i) => {
              const done = !!(log.meals||{})[meal.id];
              return (
                <div key={meal.id} onClick={() => update(["meals",meal.id], !done)}
                  style={{
                    display:"flex",alignItems:"flex-start",gap:14,padding:"14px 16px",
                    background: done ? "#39d98a18" : "#111120",
                    borderRadius:14, cursor:"pointer",
                    border: done ? "1px solid #39d98a44" : "1px solid #1a1a2e",
                    transition:"all 0.25s", animation:`fadeUp 0.3s ${i*0.05}s both`,
                  }}>
                  <div style={{
                    width:42,height:42,borderRadius:12,flexShrink:0,
                    background: done ? "#39d98a" : "rgba(255,255,255,0.06)",
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:22, transition:"all 0.2s",
                  }}>{done?"✓":meal.emoji}</div>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",justifyContent:"space-between"}}>
                      <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:14,fontWeight:600,color:done?"rgba(255,255,255,0.5)":"#fff",textDecoration:done?"line-through":"none"}}>{meal.name}</div>
                      <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,color:"#888aaa"}}>{meal.time}</div>
                    </div>
                    <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"#888aaa",marginTop:3,lineHeight:1.4}}>{meal.foods}</div>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,color:"#39d98a",marginTop:4,fontWeight:700}}>{meal.macros}</div>

              );
            })}
            <div style={{background:"#111120",borderRadius:14,padding:"12px 16px",border:"1px solid #1a1a2e"}}>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"#888aaa",marginBottom:6}}>Daily target</div>
              <div style={{display:"flex",gap:16}}>
                {[["Protein","190g","#ff6b6b"],["Carbs","375g","#f0b429"],["Fats","100g","#4fc3f7"],["Kcal","3,160","#39d98a"]].map(([l,v,c])=>(
                  <div key={l} style={{textAlign:"center"}}>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:18,fontWeight:800,color:c}}>{v}</div>
                    <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:"#555577"}}>{l}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* SUPPLEMENTS TAB */}
        {tab==="supps" && (
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {SUPPLEMENTS.map((supp, i) => {
              const done = !!(log.supplements||{})[supp.id];
              return (
                <div key={supp.id} onClick={() => update(["supplements",supp.id], !done)}
                  style={{
                    display:"flex",alignItems:"center",gap:14,padding:"14px 16px",
                    background: done ? `${supp.color}14` : "#111120",
                    borderRadius:14, cursor:"pointer",
                    border: done ? `1px solid ${supp.color}44` : "1px solid #1a1a2e",
                    transition:"all 0.25s", animation:`fadeUp 0.3s ${i*0.05}s both`,
                  }}>
                  <div style={{
                    width:44,height:44,borderRadius:12,flexShrink:0,
                    background: done ? supp.color : "rgba(255,255,255,0.06)",
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:22, transition:"all 0.2s",
                  }}>{done?"✓":supp.emoji}</div>
                  <div style={{flex:1}}>
                    <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:14,fontWeight:600,color:done?"rgba(255,255,255,0.5)":"#fff",textDecoration:done?"line-through":"none"}}>{supp.name}</div>
                    <div style={{display:"flex",gap:10,marginTop:3}}>
                      <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,color:supp.color,fontWeight:700}}>{supp.dose}</span>
                      <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,color:"#555577"}}>{supp.timing}</span>
                    </div>
                  </div>
                  {done && <div style={{fontSize:18,animation:"pop 0.3s ease"}}>✅</div>}
                </div>
              );
            })}
            <div style={{background:"#1a0a00",borderRadius:14,padding:"12px 16px",border:"1px solid #f0b42922"}}>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"#f0b429",fontWeight:600}}>⭐ AA Priority · 🌿 Dairy-Free</div>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"#888aaa",marginTop:4}}>Pea + Rice protein = complete amino profile, gut-friendly. Vit D3 4,000–6,000 IU · Omega-3 3–4g EPA/DHA · Magnesium 400mg — critical for Black men. Get bloodwork to confirm dosing.</div>
            </div>
          </div>
        )}

        {/* WEIGHT TAB */}
        {tab==="weight" && (
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            <div style={{background:"#111120",borderRadius:16,padding:20,border:"1px solid #1a1a2e"}}>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,color:"#888aaa",marginBottom:12}}>Log today's weight</div>
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                <input
                  type="number" step="0.1" value={weightInput}
                  onChange={e=>setWeightInput(e.target.value)}
                  placeholder="e.g. 177.5"
                  style={{
                    flex:1, padding:"14px 16px",
                    background:"#0e0e1c", border:"1px solid #2a2a3e", borderRadius:12,
                    fontFamily:"'Barlow Condensed',sans-serif", fontSize:24, fontWeight:700, color:"#fff",
                    outline:"none", textAlign:"center",
                  }}
                />
                <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,color:"#888aaa",fontWeight:600}}>lbs</span>
              </div>
              <button onClick={saveWeight} style={{
                width:"100%", marginTop:12, padding:"14px",
                background:"linear-gradient(135deg,#f0b429,#ff8f00)",
                border:"none", borderRadius:12, cursor:"pointer",
                fontFamily:"'Barlow Condensed',sans-serif", fontSize:18, fontWeight:800, color:"#000", letterSpacing:1,
              }}>SAVE WEIGHT</button>
            </div>
            {log.weight && (
              <div style={{background:"#111120",borderRadius:16,padding:20,border:"1px solid #39d98a44",textAlign:"center"}}>
                <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,color:"#888aaa"}}>Today's logged weight</div>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:48,fontWeight:900,color:"#f0b429",lineHeight:1}}>{log.weight} <span style={{fontSize:24}}>lbs</span></div>
                {log.weight > 175 && (
                  <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:14,color:"#39d98a",marginTop:8}}>
                    +{(log.weight-175).toFixed(1)} lbs gained 💪
                  </div>
                )}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── CALENDAR ───────────────────────────────────────────────────────────── */
function Calendar({ logs, selectedDate, setSelectedDate, setView }) {
  const today = todayKey();
  const [viewDate, setViewDate] = useState(new Date(today + "T12:00:00"));

  const year = viewDate.getFullYear(), month = viewDate.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  const getCompletion = (key) => {
    const log = logs[key];
    if(!log) return null;
    const dow = DOW(key);
    const plan = WEEKLY_PLAN[dow];
    const wDone = plan.exercises.filter(e=>(log.workouts||{})[e.id]).length;
    const mDone = MEALS.filter(m=>(log.meals||{})[m.id]).length;
    const sDone = SUPPLEMENTS.filter(s=>(log.supplements||{})[s.id]).length;
    const total = plan.exercises.length + MEALS.length + SUPPLEMENTS.length;
    const done = wDone + mDone + sDone;
    if(total===0) return null;
    return done/total;
  };

  const cells = [];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);

  return (
    <div style={{padding:"16px", animation:MOTION?"none":"fadeUp 0.4s ease both"}}>
      {/* Month nav */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <button onClick={()=>setViewDate(new Date(year,month-1,1))} style={{background:"#1a1a2e",border:"none",color:"#fff",padding:"8px 14px",borderRadius:10,cursor:"pointer",fontSize:18}}>‹</button>
        <div style={{textAlign:"center"}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:30,fontWeight:900,color:"#fff",letterSpacing:1}}>{["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"][month]}</div>
          <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,color:"#888aaa"}}>{year}</div>
        </div>
        <button onClick={()=>setViewDate(new Date(year,month+1,1))} style={{background:"#1a1a2e",border:"none",color:"#fff",padding:"8px 14px",borderRadius:10,cursor:"pointer",fontSize:18}}>›</button>
      </div>

      {/* Day headers */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:6}}>
        {["S","M","T","W","T","F","S"].map((d,i)=>(
          <div key={i} style={{textAlign:"center",fontFamily:"'DM Sans',sans-serif",fontSize:11,fontWeight:600,color:"#555577",padding:"4px 0"}}>{d}</div>
        ))}
      </div>

      {/* Calendar grid */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:5}}>
        {cells.map((day, i) => {
          if(!day) return <div key={`e${i}`}/>;
          const key = getDateKey(year,month,day);
          const comp = getCompletion(key);
          const isToday = key===today;
          const isSel = key===selectedDate;
          const future = key > today;
          let bg = "#111120", border="1px solid #1a1a2e", dotColor=null;
          if(comp!==null && !future) {
            if(comp>=0.9) { bg="#39d98a22"; border="1px solid #39d98a55"; dotColor="#39d98a"; }
            else if(comp>=0.5) { bg="#f0b42922"; border="1px solid #f0b42955"; dotColor="#f0b429"; }
            else if(comp>0) { bg="#ff6b6b18"; border="1px solid #ff6b6b33"; dotColor="#ff6b6b"; }
          }
          if(isSel) { bg="#f0b42933"; border="2px solid #f0b429"; }
          if(isToday && !isSel) { border="2px solid #4fc3f7"; }
          return (
            <div key={key} onClick={()=>{ setSelectedDate(key); setView("log"); }}
              style={{
                aspectRatio:"1",background:bg,border,borderRadius:12,
                display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
                cursor:future?"default":"pointer",position:"relative",
                opacity:future?0.3:1,transition:"all 0.15s",
              }}>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:isSel||isToday?800:600,color:isSel?"#f0b429":isToday?"#4fc3f7":"#fff"}}>{day}</div>
              {dotColor && <div style={{width:5,height:5,borderRadius:"50%",background:dotColor,marginTop:2}}/>}
            </div>
          );
        })}
      </div>

      {/* Legend */}
      <div style={{display:"flex",gap:20,justifyContent:"center",marginTop:20,flexWrap:"wrap"}}>
        {[["#39d98a","90%+ Complete"],["#f0b429","50–89%"],["#ff6b6b","< 50%"],["#4fc3f7","Today"]].map(([c,l])=>(
          <div key={l} style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:10,height:10,borderRadius:"50%",background:c}}/>
            <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"#888aaa"}}>{l}</span>
          </div>
        ))}
      </div>

      {/* Week summary */}
      <div style={{marginTop:20,background:"#111120",borderRadius:16,padding:16,border:"1px solid #1a1a2e"}}>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:18,fontWeight:800,color:"#fff",marginBottom:12}}>WEEKLY SCHEDULE</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {[1,2,3,4,5,6,0].map(dow=>{
            const p = WEEKLY_PLAN[dow];
            return (
              <div key={dow} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 12px",background:"#0e0e1c",borderRadius:10}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:p.color,flexShrink:0}}/>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:700,color:"#fff",width:32,flexShrink:0}}>{["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dow]}</div>
                <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"#888aaa",flex:1}}>{p.name}</div>
                <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:"#555577"}}>{p.exercises.length>0?`${p.exercises.length} exercises`:"Rest"}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ─── PROGRESS ───────────────────────────────────────────────────────────── */
function Progress({ logs, setLogs, profile, setProfile, onCelebrate }) {
  const [editProfile, setEditProfile] = useState(false);
  const [sw, setSw] = useState(String(profile.startWeight));
  const [sd, setSd] = useState(profile.startDate||todayKey());
  const [chartRange, setChartRange] = useState("all");
  const [editingEntry, setEditingEntry] = useState(null); // date key being edited
  const [editVal, setEditVal] = useState("");
  const [addDate, setAddDate] = useState("");
  const [addVal, setAddVal] = useState("");
  const [showAddForm, setShowAddForm] = useState(false);
  const today = todayKey();

  // All weight entries sorted oldest → newest
  const allWeightData = Object.entries(logs)
    .filter(([,l]) => l.weight)
    .sort(([a],[b]) => a.localeCompare(b))
    .map(([date, l]) => ({ date, w: l.weight }));

  const filtered = chartRange === "all" ? allWeightData
    : chartRange === "30" ? allWeightData.slice(-30)
    : allWeightData.slice(-7);

  const currentWeight = allWeightData.length > 0 ? allWeightData[allWeightData.length-1].w : profile.startWeight;
  const gained = currentWeight - profile.startWeight;
  const gainPct = Math.min(100, Math.max(0, gained / 20 * 100));
  const daysLogged = Object.keys(logs).length;
  const totalWorkouts = Object.values(logs).reduce((acc,l,_,arr) => {
    const key = Object.keys(logs)[Object.values(logs).indexOf(l)];
    const dow = key ? DOW(key) : 0;
    const p = WEEKLY_PLAN[dow];
    return acc + (p.exercises.filter(e => (l.workouts||{})[e.id]).length > 0 ? 1 : 0);
  }, 0);

  // 7-day trend (avg last 7 vs avg previous 7)
  const last7 = allWeightData.slice(-7).map(d=>d.w);
  const prev7 = allWeightData.slice(-14,-7).map(d=>d.w);
  const avgLast7 = last7.length ? last7.reduce((a,b)=>a+b,0)/last7.length : null;
  const avgPrev7 = prev7.length ? prev7.reduce((a,b)=>a+b,0)/prev7.length : null;
  const weekTrend = (avgLast7 && avgPrev7) ? avgLast7 - avgPrev7 : null;

  // Heaviest / lightest
  const allW = allWeightData.map(d=>d.w);
  const heaviest = allW.length ? Math.max(...allW) : null;
  const lightest = allW.length ? Math.min(...allW) : null;

  // Weekly averages
  const weeklyAvgs = (() => {
    if(allWeightData.length < 2) return [];
    const byWeek = {};
    allWeightData.forEach(({date, w}) => {
      const d = new Date(date+"T12:00:00");
      const yr = d.getFullYear();
      const wk = Math.ceil(((d - new Date(yr,0,1))/86400000 + new Date(yr,0,1).getDay()+1)/7);
      const key = `${yr}-W${String(wk).padStart(2,"0")}`;
      if(!byWeek[key]) byWeek[key] = [];
      byWeek[key].push(w);
    });
    return Object.entries(byWeek)
      .sort(([a],[b])=>a.localeCompare(b))
      .map(([wk, ws]) => ({ wk, avg: ws.reduce((a,b)=>a+b,0)/ws.length, count: ws.length }));
  })();

  const saveProfile = async () => {
    const newP = {...profile, startWeight:parseFloat(sw)||175, startDate:sd, currentWeight};
    setProfile(newP);
    await storageSet("profile", newP);
    setEditProfile(false);
  };

  const saveEditEntry = async (dateKey) => {
    const w = parseFloat(editVal);
    if(isNaN(w)||w<100||w>400) { setEditingEntry(null); return; }
    const newLogs = {...logs, [dateKey]: {...(logs[dateKey]||{}), weight: w}};
    setLogs(newLogs);
    await storageSet("logs", newLogs);
    setEditingEntry(null);
    // milestone check
    const gained2 = w - profile.startWeight;
    for(const m of MILESTONES) {
      if(gained2 >= m.lbs && gained < m.lbs) { onCelebrate(m); break; }
    }
  };

  const deleteEntry = async (dateKey) => {
    const newLogs = {...logs};
    if(newLogs[dateKey]) {
      const day = {...newLogs[dateKey]};
      delete day.weight;
      newLogs[dateKey] = day;
    }
    setLogs(newLogs);
    await storageSet("logs", newLogs);
  };

  const saveAddEntry = async () => {
    if(!addDate || !addVal) return;
    const w = parseFloat(addVal);
    if(isNaN(w)||w<100||w>400) return;
    const newLogs = {...logs, [addDate]: {...(logs[addDate]||{}), weight: w}};
    setLogs(newLogs);
    await storageSet("logs", newLogs);
    setAddDate(""); setAddVal(""); setShowAddForm(false);
    const gained2 = w - profile.startWeight;
    for(const m of MILESTONES) {
      if(gained2 >= m.lbs && gained < m.lbs) { onCelebrate(m); break; }
    }
  };

  // SVG chart
  const chartH = 130, chartW = 310;
  let chartPath = "", chartArea = "", chartPoints = [];
  if(filtered.length >= 2) {
    const ws = filtered.map(d=>d.w);
    const mn = Math.min(...ws) - 1.5, mx = Math.max(...ws) + 1.5;
    chartPoints = filtered.map((d,i) => ({
      x: (i/(filtered.length-1))*chartW,
      y: chartH - ((d.w-mn)/(mx-mn))*chartH,
      w: d.w, date: d.date,
    }));
    const ptStr = chartPoints.map(p=>`${p.x},${p.y}`).join(" L ");
    chartPath  = `M ${ptStr}`;
    chartArea  = `M ${chartPoints[0].x},${chartPoints[0].y} L ${ptStr} L ${chartW},${chartH} L 0,${chartH} Z`;
  }

  // Y-axis labels
  const yLabels = (() => {
    if(filtered.length < 2) return [];
    const ws = filtered.map(d=>d.w);
    const mn = Math.floor(Math.min(...ws)-1), mx = Math.ceil(Math.max(...ws)+1);
    const step = Math.ceil((mx-mn)/4);
    const out = [];
    for(let v=mn; v<=mx; v+=step) out.push(v);
    return out.map(v=>({
      v, y: chartH - ((v-mn+1.5)/((mx-mn)+3))*chartH,
    }));
  })();

  const badges = [
    {lbs:1,emoji:"🌱",label:"First Pound"},{lbs:2,emoji:"💧",label:"2 lbs"},
    {lbs:5,emoji:"🔥",label:"5 lbs"},{lbs:10,emoji:"⚡",label:"10 lbs"},
    {lbs:15,emoji:"💎",label:"15 lbs"},{lbs:20,emoji:"🏆",label:"Goal!"},
  ];

  const S = {
    label: {fontFamily:"'DM Sans',sans-serif",fontSize:10,color:"#555577",fontWeight:600,textTransform:"uppercase",letterSpacing:0.5},
    val:   {fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900},
    card:  {background:"#111120",borderRadius:16,border:"1px solid #1a1a2e"},
  };

  return (
    <div style={{padding:"16px",display:"flex",flexDirection:"column",gap:18,animation:MOTION?"none":"fadeUp 0.4s ease both"}}>

      {/* ── HEADER ── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
        <div>
          <div style={{...S.val,fontSize:34,color:"#fff",letterSpacing:1}}>
            WEIGHT <span style={{color:"#f0b429"}}>LOG</span>
          </div>
          <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"#555577",marginTop:2}}>{allWeightData.length} entries recorded</div>
        </div>
        <button onClick={()=>setShowAddForm(!showAddForm)} style={{
          background:showAddForm?"#1a1a2e":"linear-gradient(135deg,#f0b429,#ff8f00)",
          border:"none",borderRadius:12,padding:"8px 16px",cursor:"pointer",
          fontFamily:"'Barlow Condensed',sans-serif",fontSize:15,fontWeight:800,
          color:showAddForm?"#888aaa":"#000",letterSpacing:0.5,
        }}>{showAddForm ? "✕ Cancel" : "+ ADD ENTRY"}</button>
      </div>

      {/* ── ADD ENTRY FORM ── */}
      {showAddForm && (
        <div style={{...S.card,padding:16,border:"1px solid #f0b42933",animation:"fadeUp 0.3s ease"}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:800,color:"#f0b429",marginBottom:12}}>ADD / UPDATE WEIGHT ENTRY</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div>
              <div style={{...S.label,marginBottom:5}}>Date</div>
              <input type="date" value={addDate} onChange={e=>setAddDate(e.target.value)} max={today}
                style={{width:"100%",padding:"10px 12px",background:"#0e0e1c",border:"1px solid #2a2a3e",borderRadius:10,color:"#fff",fontFamily:"'DM Sans',sans-serif",fontSize:13,outline:"none"}}/>
            </div>
            <div>
              <div style={{...S.label,marginBottom:5}}>Weight (lbs)</div>
              <input type="number" step="0.1" value={addVal} onChange={e=>setAddVal(e.target.value)} placeholder="175.0"
                style={{width:"100%",padding:"10px 12px",background:"#0e0e1c",border:"1px solid #2a2a3e",borderRadius:10,color:"#fff",fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:700,outline:"none",textAlign:"center"}}/>
            </div>
          </div>
          <button onClick={saveAddEntry} style={{
            width:"100%",marginTop:12,padding:"12px",
            background:"linear-gradient(135deg,#f0b429,#ff8f00)",border:"none",borderRadius:10,cursor:"pointer",
            fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:800,color:"#000",letterSpacing:1,
          }}>SAVE ENTRY</button>
        </div>
      )}

      {/* ── HERO STAT ── */}
      <div style={{...S.card,padding:20,background:"linear-gradient(135deg,#1a0f00,#111120)",border:"1px solid #f0b42933",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",right:16,top:10,fontSize:56,opacity:0.06}}>⚖️</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16,marginBottom:16}}>
          <div>
            <div style={{...S.label}}>Start</div>
            <div style={{...S.val,fontSize:26,color:"#fff"}}>{profile.startWeight}<span style={{fontSize:14,color:"#555577"}}> lbs</span></div>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{...S.label}}>Current</div>
            <div style={{...S.val,fontSize:26,color:"#4fc3f7"}}>{currentWeight}<span style={{fontSize:14,color:"#555577"}}> lbs</span></div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{...S.label}}>Goal</div>
            <div style={{...S.val,fontSize:26,color:"#39d98a"}}>{profile.startWeight+20}<span style={{fontSize:14,color:"#555577"}}> lbs</span></div>
          </div>
        </div>
        <div style={{textAlign:"center",marginBottom:14}}>
          <div style={{...S.val,fontSize:52,color:gained>=0?"#f0b429":"#ff6b6b",lineHeight:1}}>
            {gained>=0?"+":""}{gained.toFixed(1)} <span style={{fontSize:24,color:"rgba(255,255,255,0.4)"}}>lbs gained</span>
          </div>
        </div>
        <div style={{height:10,background:"rgba(255,255,255,0.06)",borderRadius:5,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${gainPct}%`,background:"linear-gradient(90deg,#f0b429,#ff6b6b)",borderRadius:5,transition:"width 1s ease",position:"relative"}}>
            {gainPct>8&&<div style={{position:"absolute",right:6,top:0,height:"100%",display:"flex",alignItems:"center",fontFamily:"'Barlow Condensed',sans-serif",fontSize:9,fontWeight:800,color:"#000"}}>{gainPct.toFixed(0)}%</div>}
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:5}}>
          <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:"#555577"}}>{profile.startWeight} lbs</span>
          <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:"#555577"}}>Goal: {profile.startWeight+20} lbs</span>
        </div>
      </div>

      {/* ── STAT PILLS ── */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
        {[
          {label:"7-day avg", val: avgLast7 ? avgLast7.toFixed(1) : "—", color:"#4fc3f7", icon:"📊"},
          {label:"Week trend", val: weekTrend!=null ? `${weekTrend>=0?"+":""}${weekTrend.toFixed(1)}` : "—", color: weekTrend!=null&&weekTrend>=0?"#39d98a":"#ff6b6b", icon: weekTrend!=null&&weekTrend>=0?"📈":"📉"},
          {label:"Heaviest",  val: heaviest ? heaviest.toFixed(1) : "—", color:"#ff6b6b", icon:"🔺"},
          {label:"Lightest",  val: lightest ? lightest.toFixed(1) : "—", color:"#39d98a", icon:"🔻"},
        ].map(s=>(
          <div key={s.label} style={{...S.card,padding:"12px 8px",textAlign:"center"}}>
            <div style={{fontSize:16}}>{s.icon}</div>
            <div style={{...S.val,fontSize:17,color:s.color,marginTop:3}}>{s.val}</div>
            <div style={{...S.label,marginTop:2,fontSize:9}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* ── CHART ── */}
      <div style={{...S.card,padding:18}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{...S.val,fontSize:18,color:"#fff"}}>WEIGHT CHART</div>
          <div style={{display:"flex",gap:4}}>
            {[["7","7D"],["30","30D"],["all","All"]].map(([v,l])=>(
              <button key={v} onClick={()=>setChartRange(v)} style={{
                padding:"4px 10px",borderRadius:8,border:"none",cursor:"pointer",
                background: chartRange===v ? "#f0b429" : "#1a1a2e",
                color: chartRange===v ? "#000" : "#888aaa",
                fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:700,
              }}>{l}</button>
            ))}
          </div>
        </div>

        {filtered.length < 2 ? (
          <div style={{textAlign:"center",padding:"30px 0",color:"#333344",fontFamily:"'DM Sans',sans-serif",fontSize:13}}>
            Log at least 2 days of weight to see your chart
          </div>
        ) : (
          <div style={{overflowX:"auto"}}>
            <svg width={chartW+36} height={chartH+32} style={{display:"block",overflow:"visible"}}>
              <defs>
                <linearGradient id="cg2" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stopColor="#f0b429" stopOpacity="0.35"/>
                  <stop offset="100%" stopColor="#f0b429" stopOpacity="0"/>
                </linearGradient>
              </defs>
              <g transform="translate(32,4)">
                {/* Grid lines */}
                {[0,0.25,0.5,0.75,1].map(t=>(
                  <line key={t} x1={0} y1={t*chartH} x2={chartW} y2={t*chartH} stroke="rgba(255,255,255,0.04)" strokeWidth="1"/>
                ))}
                {/* Area fill */}
                {chartArea && <path d={chartArea} fill="url(#cg2)"/>}
                {/* Line */}
                {chartPath && <path d={chartPath} fill="none" stroke="#f0b429" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>}
                {/* Points */}
                {chartPoints.map((p,i)=>(
                  <g key={i}>
                    <circle cx={p.x} cy={p.y} r="5" fill="#f0b429" stroke="#07070f" strokeWidth="2"/>
                    {(i===0||i===chartPoints.length-1||chartPoints.length<=10) && (
                      <text x={p.x} y={p.y-10} textAnchor="middle" fill="#f0b429"
                        style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:10,fontWeight:700}}>{p.w}</text>
                    )}
                  </g>
                ))}
                {/* Y-axis labels */}
                {yLabels.map(({v,y})=>(
                  <text key={v} x={-6} y={y+4} textAnchor="end" fill="#555577"
                    style={{fontFamily:"'DM Sans',sans-serif",fontSize:9}}>{v}</text>
                ))}
                {/* X-axis labels */}
                {filtered.length > 1 && [0, filtered.length-1].map(i=>(
                  <text key={i} x={chartPoints[i]?.x} y={chartH+16} textAnchor={i===0?"start":"end"} fill="#555577"
                    style={{fontFamily:"'DM Sans',sans-serif",fontSize:9}}>
                    {filtered[i]?.date?.slice(5)}
                  </text>
                ))}
              </g>
            </svg>
          </div>
        )}
      </div>

      {/* ── WEEKLY AVERAGES ── */}
      {weeklyAvgs.length > 1 && (
        <div style={{...S.card,padding:18}}>
          <div style={{...S.val,fontSize:18,color:"#fff",marginBottom:14}}>WEEKLY AVERAGES</div>
          <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:220,overflowY:"auto"}}>
            {[...weeklyAvgs].reverse().map((w,i)=>{
              const prev = weeklyAvgs[weeklyAvgs.length-2-i];
              const delta = prev ? w.avg - prev.avg : null;
              return (
                <div key={w.wk} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",background:"#0e0e1c",borderRadius:10}}>
                  <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"#555577",width:60,flexShrink:0}}>{w.wk}</div>
                  <div style={{flex:1,height:4,background:"rgba(255,255,255,0.06)",borderRadius:2,overflow:"hidden"}}>
                    <div style={{height:"100%",width:`${Math.min(100,((w.avg-profile.startWeight)/20)*100)}%`,background:"linear-gradient(90deg,#f0b429,#ff6b6b)",borderRadius:2}}/>
                  </div>
                  <div style={{...S.val,fontSize:17,color:"#fff",textAlign:"right",minWidth:54}}>{w.avg.toFixed(1)}</div>
                  {delta!=null && (
                    <div style={{...S.val,fontSize:13,color:delta>=0?"#39d98a":"#ff6b6b",minWidth:40,textAlign:"right"}}>
                      {delta>=0?"+":""}{delta.toFixed(1)}
                    </div>
                  )}
                  <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:"#333355",minWidth:28}}>{w.count}d</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── DAILY LOG TABLE ── */}
      <div style={{...S.card,padding:18}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{...S.val,fontSize:18,color:"#fff"}}>DAILY WEIGHT LOG</div>
          <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"#555577"}}>{allWeightData.length} entries · tap to edit</div>
        </div>

        {allWeightData.length === 0 ? (
          <div style={{textAlign:"center",padding:"24px 0",color:"#333344",fontFamily:"'DM Sans',sans-serif",fontSize:13}}>
            No weight entries yet. Start logging from the Log tab or use + Add Entry above.
          </div>
        ) : (
          <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:380,overflowY:"auto"}}>
            {[...allWeightData].reverse().map((entry, idx) => {
              const prev = allWeightData[allWeightData.length - 2 - idx];
              const delta = prev ? entry.w - prev.w : null;
              const isEdit = editingEntry === entry.date;
              const d = new Date(entry.date + "T12:00:00");
              const label = `${DAY_NAMES[d.getDay()]}, ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}`;
              const isToday2 = entry.date === today;
              return (
                <div key={entry.date} style={{
                  display:"flex",alignItems:"center",gap:10,padding:"10px 12px",
                  background: isToday2 ? "#4fc3f718" : (idx%2===0?"#0e0e1c":"#0b0b18"),
                  borderRadius:12,
                  border: isToday2 ? "1px solid #4fc3f744" : "1px solid transparent",
                  animation:`fadeUp 0.25s ${Math.min(idx,10)*0.03}s both`,
                }}>
                  {/* Date */}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:isToday2?"#4fc3f7":"#888aaa",fontWeight:isToday2?600:400,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                      {isToday2 ? "Today — " : ""}{label}
                    </div>
                  </div>

                  {/* Delta */}
                  <div style={{width:44,textAlign:"right"}}>
                    {delta!=null && (
                      <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:700,color:delta>0?"#39d98a":delta<0?"#ff6b6b":"#555577"}}>
                        {delta>0?"+":""}{delta.toFixed(1)}
                      </span>
                    )}
                  </div>

                  {/* Weight — inline edit or display */}
                  {isEdit ? (
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      <input autoFocus type="number" step="0.1" value={editVal} onChange={e=>setEditVal(e.target.value)}
                        onKeyDown={e=>{ if(e.key==="Enter") saveEditEntry(entry.date); if(e.key==="Escape") setEditingEntry(null); }}
                        style={{width:72,padding:"5px 8px",background:"#1a1a2e",border:"1px solid #f0b429",borderRadius:8,color:"#f0b429",fontFamily:"'Barlow Condensed',sans-serif",fontSize:18,fontWeight:700,outline:"none",textAlign:"center"}}/>
                      <button onClick={()=>saveEditEntry(entry.date)} style={{background:"#39d98a",border:"none",borderRadius:7,padding:"5px 9px",cursor:"pointer",color:"#000",fontSize:13,fontWeight:700}}>✓</button>
                      <button onClick={()=>setEditingEntry(null)} style={{background:"#1a1a2e",border:"none",borderRadius:7,padding:"5px 9px",cursor:"pointer",color:"#888aaa",fontSize:13}}>✕</button>
                    </div>
                  ) : (
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <div onClick={()=>{ setEditingEntry(entry.date); setEditVal(String(entry.w)); }}
                        style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:900,color:"#fff",cursor:"pointer",padding:"2px 8px",borderRadius:8,transition:"background 0.15s"}}
                        onMouseEnter={e=>e.currentTarget.style.background="#1a1a2e"}
                        onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                        {entry.w}<span style={{fontSize:12,color:"#555577",fontWeight:400}}> lbs</span>
                      </div>
                      <button onClick={()=>deleteEntry(entry.date)} style={{background:"none",border:"none",cursor:"pointer",color:"#ff6b6b",fontSize:14,opacity:0.4,padding:"2px 4px",lineHeight:1}}
                        onMouseEnter={e=>e.currentTarget.style.opacity="1"}
                        onMouseLeave={e=>e.currentTarget.style.opacity="0.4"}>🗑</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* ── MILESTONE BADGES ── */}
      <div style={{...S.card,padding:18}}>
        <div style={{...S.val,fontSize:18,color:"#fff",marginBottom:14}}>MILESTONE BADGES</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          {badges.map(b=>{
            const unlocked = gained >= b.lbs;
            return (
              <div key={b.lbs} style={{
                textAlign:"center",padding:"14px 8px",borderRadius:14,
                background: unlocked?"#f0b42918":"rgba(255,255,255,0.03)",
                border: unlocked?"1px solid #f0b42944":"1px solid #1a1a2e",
                transition:"all 0.3s",
              }}>
                <div style={{fontSize:30,filter:unlocked?"none":"grayscale(1) opacity(0.2)",transition:"all 0.3s"}}>{b.emoji}</div>
                <div style={{...S.val,fontSize:15,color:unlocked?"#f0b429":"#333344",marginTop:4}}>{b.lbs===20?"GOAL!":"+"+b.lbs+" lb"}</div>
                <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:unlocked?"#888aaa":"#333344"}}>{b.label}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* ── PROFILE SETTINGS ── */}
      <div style={{...S.card,padding:18}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:editProfile?14:0}}>
          <div style={{...S.val,fontSize:18,color:"#fff"}}>PROFILE SETTINGS</div>
          <button onClick={()=>setEditProfile(!editProfile)} style={{background:"#1a1a2e",border:"none",color:"#888aaa",padding:"6px 14px",borderRadius:8,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600}}>
            {editProfile?"Cancel":"Edit"}
          </button>
        </div>
        {editProfile && (
          <div style={{display:"flex",flexDirection:"column",gap:12,animation:"fadeUp 0.3s ease"}}>
            <div>
              <label style={{...S.label,display:"block",marginBottom:5}}>Starting Weight (lbs)</label>
              <input type="number" value={sw} onChange={e=>setSw(e.target.value)} style={{width:"100%",padding:"10px 14px",background:"#0e0e1c",border:"1px solid #2a2a3e",borderRadius:10,color:"#fff",fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:700,outline:"none"}}/>
            </div>
            <div>
              <label style={{...S.label,display:"block",marginBottom:5}}>Program Start Date</label>
              <input type="date" value={sd} onChange={e=>setSd(e.target.value)} style={{width:"100%",padding:"10px 14px",background:"#0e0e1c",border:"1px solid #2a2a3e",borderRadius:10,color:"#fff",fontFamily:"'DM Sans',sans-serif",fontSize:14,outline:"none"}}/>
            </div>
            <button onClick={saveProfile} style={{padding:"12px",background:"linear-gradient(135deg,#f0b429,#ff8f00)",border:"none",borderRadius:10,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:800,color:"#000",letterSpacing:1}}>SAVE PROFILE</button>
          </div>
        )}
        {!editProfile && (
          <div style={{display:"flex",gap:24,marginTop:12}}>
            <div><div style={{...S.label}}>Start</div><div style={{...S.val,fontSize:22,color:"#fff"}}>{profile.startWeight} lbs</div></div>
            <div><div style={{...S.label}}>Goal</div><div style={{...S.val,fontSize:22,color:"#f0b429"}}>{profile.startWeight+20} lbs</div></div>
            <div><div style={{...S.label}}>Since</div><div style={{...S.val,fontSize:18,color:"#4fc3f7"}}>{profile.startDate||"—"}</div></div>
          </div>
        )}
      </div>

      {/* ── IMPORT FROM WATCH ── */}
      <WatchImportCard logs={logs} setLogs={setLogs} onCelebrate={onCelebrate}/>

      {/* ── DATA: BACKUP & RESTORE ── */}
      <DataCard logs={logs} setLogs={setLogs} onCelebrate={onCelebrate}/>

    </div>
  );
}

/* ─── MAIN APP ───────────────────────────────────────────────────────────── */
function App() {
  const [view, setView] = useState("dashboard");
  const [selectedDate, setSelectedDate] = useState(todayKey());
  const [logs, setLogs] = useState({});
  const [profile, setProfile] = useState({ startWeight:175, startDate:todayKey(), currentWeight:175 });
  const [celebration, setCelebration] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [activeTimer, setActiveTimer] = useState(null); // { exercise, setNum, totalSets, color }
  const celebQueue = useRef([]);

  useEffect(() => {
    (async () => {
      const l = await storageGet("logs");
      const p = await storageGet("profile");
      if(l) setLogs(l);
      if(p) setProfile(p);
      setLoaded(true);
    })();
  }, []);

  const handleCelebrate = useCallback((data) => {
    if(celebration) { celebQueue.current.push(data); return; }
    setCelebration(data);
  }, [celebration]);

  const handleCelebDone = useCallback(() => {
    if(celebQueue.current.length > 0) { setCelebration(celebQueue.current.shift()); }
    else { setCelebration(null); }
  }, []);

  const stopTimer = useCallback(() => setActiveTimer(null), []);   // timer ran out
  const { startTimer, cancelTimer, adjustTimer, activity, health } = useWatchLive({ logs, setLogs, activeTimer, setActiveTimer });

  // Lenis smooths wheel/trackpad scrolling; phones keep native touch scrolling and inner lists scroll on their own
  const lenis = useRef(null);
  useEffect(() => {
    if (!window.Lenis || REDUCED_MOTION) return;
    lenis.current = new Lenis({ autoRaf: true, allowNestedScroll: true });
    return () => { lenis.current.destroy(); lenis.current = null; };
  }, []);
  // each tab opens at the top, with its sections staggering in
  const viewRef = useRef(null);
  useEffect(() => { if (lenis.current) lenis.current.scrollTo(0, { immediate: true }); else window.scrollTo(0, 0); }, [view]);
  useStaggerIn(viewRef, loaded ? view : null);

  if(!loaded) return (
    <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#07070f",flexDirection:"column",gap:16}}>
      <div style={{width:48,height:48,borderRadius:"50%",border:"3px solid #f0b42933",borderTopColor:"#f0b429",animation:"spin 0.8s linear infinite"}}/>
      <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,color:"#888aaa",letterSpacing:2}}>LOADING YOUR PLAN...</div>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:"#07070f",display:"flex",flexDirection:"column",maxWidth:480,margin:"0 auto",fontFamily:"'DM Sans',sans-serif",color:"#ffffff",position:"relative"}}>
      <GlobalStyle/>
      {celebration && <Celebration data={celebration} onDone={handleCelebDone}/>}
      {activeTimer && <TimerIsland timer={activeTimer} onStop={stopTimer} onCancel={cancelTimer} onAdjust={adjustTimer}/>}
      <div ref={viewRef} style={{flex:1, overflowY:"auto", paddingTop: activeTimer ? 58 : 0, paddingBottom:4, transition:"padding-top 0.3s ease"}}>
        {view==="dashboard" && <Dashboard logs={logs} profile={profile} setView={setView} setSelectedDate={setSelectedDate} setLogs={setLogs} onCelebrate={handleCelebrate} activity={activity} health={health}/>}
        {view==="log" && <DailyLog selectedDate={selectedDate} logs={logs} setLogs={setLogs} onCelebrate={handleCelebrate} profile={profile} activeTimer={activeTimer} onStartTimer={startTimer} onStopTimer={cancelTimer}/>}
        {view==="calendar" && <Calendar logs={logs} selectedDate={selectedDate} setSelectedDate={setSelectedDate} setView={setView}/>}
        {view==="progress" && <Progress logs={logs} setLogs={setLogs} profile={profile} setProfile={setProfile} onCelebrate={handleCelebrate}/>}
      </div>
      <Nav view={view} setView={setView}/>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
