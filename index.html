<!DOCTYPE html>
<html lang="en">

      padding-bottom: env(safe-area-inset-bottom);

</head>

  <script>
    // Register service worker for offline use
    if ('serviceWorker' in navigator) {

        navigator.serviceWorker.register('./sw.js')
          .then(r => console.log('SW registered'))
          .catch(e => console.log('SW failed:', e));
      });
    }
  </script>

  <!-- Live two-way sync with FitTracker Watch (shared with the watch app). -->
  <script>
/*
 * FTWLive — live two-way sync between FitTracker Watch and the Muscle Growth Tracker phone app.
 * Shared by both apps (plain ES5 so it runs on older Tizen watches too).
 *
 * Uses a Firebase Realtime Database over its REST API (no SDK):
 *   /sync/<pair code>/d/<YYYY-MM-DD>/<exerciseId>/<setIndex> = { l: lb|null, r: reps|null, d: done, t: ms, b: "w"|"p" }
 *   /sync/<pair code>/rest = { s: start ms, e: end ms, x: exerciseId, n: set just done, N: total sets,
 *                              b: "w"|"p", c: true if cancelled }
 *   /sync/<pair code>/stats/<date>/<w|hc> = daily activity from the watch (w) or Samsung Health (hc):
 *                              { s: steps, c: kcal, k: km, hr: latest bpm, hrMin: lowest bpm today, t: ms }
 *   /sync/<pair code>/wt/<date> = { lb: body weight, t: ms, b: "p" phone | "h" Samsung Health }
 *   /sync/<pair code>/hc = { t: last Samsung Health sync, n: workouts saved, err: message }
 * Changes stream in with Server-Sent Events; writes queue in an outbox while offline.
 * The pair code is a long random secret: the database rules only allow access under it.
 */
var FTWLive = (function () {
  'use strict';

  var CFG_KEY = 'ftwLiveCfg', OUT_KEY = 'ftwLiveOutbox', DAYS_BACK = 14;
  var cfg = load(CFG_KEY, null);
  var outbox = load(OUT_KEY, {});
  var h = {};                       // data handlers: onSet, onSync, onRest
  var statusFns = [];
  var status = 'off';
  var extras = [];                  // optional streams: stats, weight, Samsung Health status
  var esDays = null, esRest = null, flushing = false, flushT = null, restT = null, pendingRest;
  var fails = 0;
  var useQuery = true, gotData = false;   // date filter on the stream; dropped if the server refuses it

  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function setStatus(s) {
    if (s === status) return;
    status = s;
    for (var i = 0; i < statusFns.length; i++) { try { statusFns[i](s); } catch (e) {} }
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dayKey(ms) { var d = new Date(ms == null ? Date.now() : ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function base() { return cfg.url.replace(/\/+$/, '') + '/sync/' + cfg.code; }

  function newCode() {
    var chars = 'abcdefghijkmnpqrstuvwxyz23456789', out = '', bytes = [];
    try { bytes = Array.prototype.slice.call(window.crypto.getRandomValues(new Uint8Array(28))); } catch (e) {}
    for (var i = 0; i < 28; i++) out += chars.charAt((bytes[i] != null ? bytes[i] : Math.floor(Math.random() * 256)) % chars.length);
    return out;
  }

  /* ---------------- pairing ---------------- */
  // Watch: build the text for the pairing QR (creates the code the first time).
  function pairText(url) {
    if (!url) return null;
    if (!cfg || cfg.url !== url) { cfg = { url: url, code: (cfg && cfg.code) || newCode() }; save(CFG_KEY, cfg); connect(); }
    return 'FTWPAIR1|' + cfg.url + '|' + cfg.code;
  }
  // Phone: read a scanned pairing QR. Returns true if it was one.
  function pairFrom(text) {
    var m = /^FTWPAIR1\|(https?:\/\/[^|\s]+)\|([a-z0-9]{24,})$/.exec(text || '');
    if (!m) return false;
    cfg = { url: m[1], code: m[2] }; save(CFG_KEY, cfg);
    connect();
    return true;
  }
  function unpair() { cfg = null; save(CFG_KEY, null); outbox = {}; save(OUT_KEY, outbox); closeStreams(); setStatus('off'); }

  /* ---------------- streaming ---------------- */
  function closeStreams() {
    if (esDays) { esDays.close(); esDays = null; }
    if (esRest) { esRest.close(); esRest = null; }
    extras.forEach(function (es) { es.close(); }); extras = [];
  }

  // Stream a subtree and report each record `depth` levels down: depth 1 = /<date>, 2 = /<date>/<src>.
  // depth 0 reports the whole node.
  function openExtra(path, depth, cb, filtered) {
    var since = dayKey(Date.now() - DAYS_BACK * 864e5);
    var q = filtered && useQuery ? '?orderBy=' + encodeURIComponent('"$key"') + '&startAt=' + encodeURIComponent('"' + since + '"') : '';
    var es = new EventSource(base() + '/' + path + '.json' + q);
    function emit(segs, data) {
      if (segs.length === depth) { cb(segs, data); return; }
      if (segs.length > depth || !data || typeof data !== 'object') return;
      for (var k in data) if (Object.prototype.hasOwnProperty.call(data, k)) emit(segs.concat(String(k)), data[k]);
    }
    function on(type) {
      return function (ev) {
        var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (!m) return;
        var segs = (m.path || '/').split('/').filter(Boolean);
        if (depth === 0 || segs.length > depth) {      // partial change inside a record: re-read the record
          var rec = segs.slice(0, depth);
          xhr('GET', base() + '/' + path + (rec.length ? '/' + rec.join('/') : '') + '.json', undefined, function (ok, x) {
            if (ok) { try { cb(rec, JSON.parse(x.responseText)); } catch (e) {} }
          });
          return;
        }
        if (type === 'patch') { for (var k in m.data) emit(segs.concat(k.split('/').filter(Boolean)), m.data[k]); }
        else emit(segs, m.data);
      };
    }
    es.addEventListener('put', on('put'));
    es.addEventListener('patch', on('patch'));
    extras.push(es);
  }

  function walk(segs, data) {
    if (segs.length === 3) {
      if (h.onSet && data && typeof data === 'object') h.onSet(segs[0], segs[1], +segs[2], data);
      return;
    }
    if (segs.length > 3 || !data || typeof data !== 'object') return;
    for (var k in data) if (Object.prototype.hasOwnProperty.call(data, k) && data[k] != null) walk(segs.concat(String(k)), data[k]);
  }

  function onDays(type) {
    return function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (!m) return;
      var segs = (m.path || '/').split('/').filter(Boolean);
      if (type === 'patch') { for (var k in m.data) walk(segs.concat(k.split('/').filter(Boolean)), m.data[k]); }
      else walk(segs, m.data);
      fails = 0; gotData = true; setStatus('live');
      if (h.onSync) h.onSync();
    };
  }

  function onRestEv(ev) {
    var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (!m) return;
    if (m.path === '/') { if (h.onRest) h.onRest(m.data); return; }
    xhr('GET', base() + '/rest.json', undefined, function (ok, x) {   // partial update: fetch the whole record
      if (ok && h.onRest) { try { h.onRest(JSON.parse(x.responseText)); } catch (e) {} }
    });
  }

  function connect() {
    closeStreams();
    if (!cfg) { setStatus('off'); return; }
    if (typeof EventSource === 'undefined') { setStatus('error'); return; }
    setStatus('connecting');
    var since = dayKey(Date.now() - DAYS_BACK * 864e5);
    var q = useQuery ? '?orderBy=' + encodeURIComponent('"$key"') + '&startAt=' + encodeURIComponent('"' + since + '"') : '';
    esDays = new EventSource(base() + '/d.json' + q);
    esDays.addEventListener('put', onDays('put'));
    esDays.addEventListener('patch', onDays('patch'));
    esDays.addEventListener('cancel', function () { setStatus('error'); });
    var me = esDays;
    esDays.onerror = function () {
      if (me.readyState === 2 && useQuery && !gotData) { useQuery = false; if (esDays === me) connect(); return; }
      fails++;
      setStatus(navigator.onLine === false || fails > 1 ? 'offline' : 'connecting');
      // a refused connection closes the stream for good: reopen it ourselves, backing off
      if (me.readyState === 2 && esDays === me) setTimeout(function () { if (esDays === me) connect(); }, Math.min(30000, 2000 * fails));
    };
    esRest = new EventSource(base() + '/rest.json');
    esRest.addEventListener('put', onRestEv);
    esRest.addEventListener('patch', onRestEv);
    if (h.onStats) openExtra('stats', 2, function (segs, v) { if (v) h.onStats(segs[0], segs[1], v); }, true);
    if (h.onWeight) openExtra('wt', 1, function (segs, v) { if (v) h.onWeight(segs[0], v); }, true);
    if (h.onHealth) openExtra('hc', 0, function (segs, v) { h.onHealth(v); }, false);
    flush();
  }

  /* ---------------- writes ---------------- */
  function xhr(method, url, body, cb) {
    var x = new XMLHttpRequest();
    try {
      x.open(method, url, true);
      x.setRequestHeader('Content-Type', 'application/json');
      x.timeout = 12000;
      x.onload = function () { cb(x.status >= 200 && x.status < 300, x); };
      x.onerror = x.ontimeout = function () { cb(false, x); };
      x.send(body === undefined ? null : JSON.stringify(body));
    } catch (e) { cb(false, x); }
  }

  function scheduleFlush(ms) { clearTimeout(flushT); flushT = setTimeout(flush, ms); }

  function flush() {
    if (!cfg || flushing) return;
    var keys = Object.keys(outbox);
    if (!keys.length) return;
    flushing = true;
    var body = {}, sent = {};
    keys.forEach(function (k) { body[k] = outbox[k]; sent[k] = JSON.stringify(outbox[k]); });
    // one multi-path update for everything queued
    xhr('PATCH', base() + '.json', body, function (ok) {
      flushing = false;
      if (ok) {
        keys.forEach(function (k) { if (JSON.stringify(outbox[k]) === sent[k]) delete outbox[k]; });
        save(OUT_KEY, outbox);
        if (Object.keys(outbox).length) scheduleFlush(50);
      } else {
        setStatus('offline');
        scheduleFlush(5000);
      }
    });
  }

  function queue(path, v, ms) {
    if (!cfg) return;
    outbox[path] = v;
    save(OUT_KEY, outbox);
    scheduleFlush(ms);
  }
  function pushSet(date, exId, idx, set) { queue('d/' + date + '/' + exId + '/' + idx, set, 250); }
  function pushStats(date, src, v) { queue('stats/' + date + '/' + src, v, 1000); }
  function pushWeight(date, v) { queue('wt/' + date, v, 500); }

  // Rest timer state is short-lived: retry briefly, never queue it for later.
  function pushRest(r) {
    if (!cfg) return;
    pendingRest = r;
    clearTimeout(restT);
    (function send(tries) {
      xhr('PUT', base() + '/rest.json', pendingRest, function (ok) {
        if (ok || tries <= 0) return;
        var still = pendingRest && (pendingRest.c || pendingRest.e > Date.now());
        if (still) restT = setTimeout(function () { send(tries - 1); }, 2000);
      });
    }(3));
  }

  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('online', function () { if (cfg) { connect(); } });
  }

  return {
    start: function (handlers) { h = handlers || {}; connect(); },
    onStatus: function (fn) { statusFns.push(fn); fn(status); return function () { statusFns = statusFns.filter(function (f) { return f !== fn; }); }; },
    status: function () { return status; },
    isPaired: function () { return !!cfg; },
    pairText: pairText, pairFrom: pairFrom, unpair: unpair,
    pushSet: pushSet, pushRest: pushRest, pushStats: pushStats, pushWeight: pushWeight, flush: flush,
    config: function () { return cfg ? { url: cfg.url, code: cfg.code } : null; },
    pending: function () { return Object.keys(outbox).length; },
    dayKey: dayKey, DAYS_BACK: DAYS_BACK
  };
}());
  </script>

  <!-- Watch sync (FitTracker Watch → this app). Plain JS so it loads before React. -->
  <script>
/*
 * watch-sync.js — receive workouts from FitTracker Watch (Galaxy Watch, Tizen).
 * Include it with a script tag pointing at watch-sync.js (or paste it inline, as the app does).
 *
 *   WatchSync.scanQR(onSession)          open the camera, read the code(s) shown on the watch
 *   WatchSync.syncBluetooth(onSession)   pull every queued workout over Bluetooth (Chrome only)
 *
 * onSession(s) is called once per workout, with:
 *   { id, date, name, planDay, minutes, xp, avgHr, maxHr, totalSets, volume,
 *     exercises: [ { id, name, sets: [ { weight|null, reps } ] } ] }
 * Workouts already imported (same id) are skipped automatically.
 */
var WatchSync = (function () {
  'use strict';

  var SVC  = 'a7f30001-6b2c-4e8d-9f1a-3c5e7b9d0f21';
  var CTRL = 'a7f30002-6b2c-4e8d-9f1a-3c5e7b9d0f21';
  var DATA = 'a7f30003-6b2c-4e8d-9f1a-3c5e7b9d0f21';
  var JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
  var SEEN_KEY = 'watchSyncIds';

  /* ---------------- shared ---------------- */
  function seen() { try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || []; } catch (e) { return []; } }
  function markSeen(id) {
    var s = seen(); if (s.indexOf(id) === -1) s.push(id);
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(s.slice(-500))); } catch (e) {}
  }

  // names: optional { exerciseId: "Display Name" } so v2 sessions (ids only) read nicely
  var names = {};
  function setNames(map) { names = map || {}; }

  function unpack(o) {
    var vol = 0, total = 0;
    var exercises = (o.e || []).map(function (row) {
      var sets = row.slice(1).map(function (s) {
        var set = s.length === 2 ? { weight: s[0], reps: s[1] } : { weight: null, reps: s[0] };
        if (set.weight) vol += set.weight * set.reps;
        total++;
        return set;
      });
      var key = row[0];
      return { id: o.v >= 2 ? key : null, name: names[key] || key, sets: sets };
    });
    return { id: o.id, date: new Date(o.id), name: o.n, planDay: o.p != null ? o.p : null,
             minutes: o.m, xp: o.x, avgHr: o.h || null, maxHr: o.H || null,
             totalSets: total, volume: vol, exercises: exercises, handoff: !!o.ho };
  }

  // returns true if delivered, false if it was a duplicate
  function deliver(obj, onSession) {
    if (seen().indexOf(obj.id) !== -1) return false;
    markSeen(obj.id);
    onSession(unpack(obj));
    return true;
  }

  /* ---------------- QR ---------------- */
  var css = '' +
    '.ws-ov{position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"DM Sans",system-ui,sans-serif;color:#eee}' +
    '.ws-ov video{width:100%;max-width:480px;max-height:70vh;object-fit:cover}' +
    '.ws-box{position:absolute;width:62vmin;height:62vmin;max-width:300px;max-height:300px;border:3px solid #f0b429;border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}' +
    '.ws-msg{position:absolute;bottom:14vh;left:0;right:0;text-align:center;font-size:17px;padding:0 20px}' +
    '.ws-dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.ws-dots i{width:10px;height:10px;border-radius:50%;background:#333}.ws-dots i.on{background:#f0b429}' +
    '.ws-x{position:absolute;top:18px;right:18px;background:#222;color:#eee;border:0;border-radius:22px;padding:10px 18px;font-size:16px}' +
    '.ws-photo{display:none;flex-direction:column;align-items:center;gap:16px;padding:0 28px;text-align:center}' +
    '.ws-photo p{font-size:15px;color:#aaa;line-height:1.45;max-width:340px}.ws-photo b{color:#eee}' +
    '.ws-shoot{background:#f0b429;color:#111;border:0;border-radius:16px;padding:16px 28px;font:800 20px "Barlow Condensed",sans-serif;letter-spacing:1.5px}' +
    '.ws-ov.photo video,.ws-ov.photo .ws-box{display:none}.ws-ov.photo .ws-photo{display:flex}.ws-ov.photo .ws-msg{position:static;margin-top:18px}';

  function loadScript(src) {
    return new Promise(function (ok, fail) {
      var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail;
      document.head.appendChild(s);
    });
  }

  // opts.onPair(text): called with a watch pairing code (FTWPAIR1|…); return true to accept it
  function scanQR(onSession, opts) {
    opts = opts || {};
    return new Promise(function (resolve, reject) {
      var style = document.createElement('style'); style.textContent = css; document.head.appendChild(style);
      var ov = document.createElement('div'); ov.className = 'ws-ov';
      ov.innerHTML = '<video playsinline muted></video><div class="ws-box"></div>' +
        '<div class="ws-photo"><div style="font-size:44px">⌚📷</div>' +
          '<p class="ws-why"></p>' +
          '<button class="ws-shoot">TAKE PHOTO OF CODE</button>' +
          '<input class="ws-file" type="file" accept="image/*" capture="environment" hidden></div>' +
        '<div class="ws-msg"><div class="ws-t">' + (opts.title || 'Point at the code on your watch') + '</div><div class="ws-dots"></div></div>' +
        '<button class="ws-x">Cancel</button>';
      document.body.appendChild(ov);
      var video = ov.querySelector('video'), msg = ov.querySelector('.ws-t'), dots = ov.querySelector('.ws-dots');
      var stream = null, running = true, detector = null, canvas = document.createElement('canvas');
      var sessions = {};   // id -> { total, parts: [] }
      var photoMode = false;

      function close(result, err) {
        running = false;
        if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
        ov.remove(); style.remove();
        err ? reject(err) : resolve(result);
      }
      ov.querySelector('.ws-x').onclick = function () { close({ imported: 0, cancelled: true }); };

      function handle(text) {
        if (/^FTWPAIR1\|/.test(text || '')) {
          if (opts.onPair && opts.onPair(text)) {
            if (navigator.vibrate) navigator.vibrate([60, 60, 60]);
            close({ imported: 0, paired: true });
          } else msg.textContent = 'That pairing code didn\'t work. Show it again on the watch.';
          return;
        }
        var m = /^FTW1:([0-9a-z]+):(\d+)\/(\d+):([\s\S]*)$/.exec(text || '');
        if (!m) return;
        var id = m[1], i = +m[2], n = +m[3];
        var s = sessions[id] || (sessions[id] = { total: n, parts: [] });
        if (s.parts[i - 1] == null) { s.parts[i - 1] = m[4]; if (navigator.vibrate) navigator.vibrate(30); }
        var have = s.parts.filter(function (p) { return p != null; }).length;
        dots.innerHTML = new Array(n + 1).join('<i></i>');
        for (var k = 0; k < n; k++) if (s.parts[k] != null) dots.children[k].className = 'on';
        if (photoMode) {
          var missing = [];
          for (var q = 0; q < n; q++) if (s.parts[q] == null) missing.push(q + 1);
          msg.textContent = have < n ? 'Got ' + have + ' of ' + n + '. Now take a photo of code ' + missing.join(' / ') +
            ' (turn the bezel on the watch to show it)' : 'Got it';
        } else {
          msg.textContent = n > 1 ? 'Got ' + have + ' of ' + n + ' — keep holding steady' : 'Got it';
        }
        if (have === n) {
          try {
            var obj = JSON.parse(s.parts.join(''));
            var isNew = deliver(obj, onSession);
            if (navigator.vibrate) navigator.vibrate([60, 60, 60]);
            close({ imported: isNew ? 1 : 0, duplicate: !isNew });
          } catch (e) { s.parts = []; msg.textContent = 'Bad read, trying again…'; }
        }
      }

      function frame() {
        if (!running) return;
        if (video.readyState < 2) return requestAnimationFrame(frame);
        if (detector) {
          detector.detect(video).then(function (codes) {
            codes.forEach(function (c) { handle(c.rawValue); });
            if (running) setTimeout(frame, 120);
          }).catch(function () { if (running) setTimeout(frame, 200); });
        } else {
          var w = video.videoWidth, h = video.videoHeight, side = Math.min(w, h), scale = Math.min(1, 720 / side);
          canvas.width = canvas.height = Math.round(side * scale);
          var ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(video, (w - side) / 2, (h - side) / 2, side, side, 0, 0, canvas.width, canvas.height);
          var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var r = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
          if (r) handle(r.data);
          setTimeout(frame, 100);
        }
      }

      // Prefer the browser's built-in QR reader (Chrome on Android); fall back to jsQR.
      var fallback = function () { return window.jsQR ? null : loadScript(JSQR_URL); };
      var ready = Promise.resolve().then(function () {
        var BD = window.BarcodeDetector;
        if (!BD || typeof BD.getSupportedFormats !== 'function') return fallback();
        return BD.getSupportedFormats().then(function (f) {
          if (f.indexOf('qr_code') !== -1) detector = new BD({ formats: ['qr_code'] });
          else return fallback();
        });
      }).catch(fallback);

      /* ---- photo fallback: works without live camera access (e.g. a file opened from storage) ---- */
      function readImage(img) {
        var max = 1400, sc = Math.min(1, max / Math.max(img.width, img.height));
        var cw = Math.round(img.width * sc), chh = Math.round(img.height * sc);

    let next = logsRef.current, changed = false;
    items.forEach(({date, exId, idx, cell}) => {
      const k = `${date}/${exId}/${idx}`, m = metaRef.current[k], t = cell.t || 0;
      if (m && m.t >= t) return;
      const local = normCell(((next[date] || {}).workouts || {})[exId + "_sets"]?.[idx]);
      if (!m && !cellEmpty(local)) return;            // phone has its own unsynced entry: it gets pushed instead
      const c = {done: !!cell.d, lbs: cell.l == null ? "" : String(cell.l), reps: cell.r == null ? "" : String(cell.r)};
      metaRef.current[k] = {h: cellHash(c), t};
      if (cellHash(c) === cellHash(local)) return;
      next = writeCell(next, date, exId, idx, c);
      changed = true;
    });
    saveMeta();
    if (changed) { logsRef.current = next; setLogs(next); storageSet("logs", next); }
  }, [setLogs]);

  // rest timer started / changed / cancelled on the watch
  // u = the device that made this change (older versions only send b, who started the rest)
  const onRemoteRest = useCallback((r) => {
    if (!r) return;
    const at = timerRef.current;
    if (r.c) { if (at && at.s === r.s) setActiveTimer(null); return; }
    if ((r.u || r.b) !== "w") return;                                // our own echo
    if (at && at.s === r.s) {                                        // the watch changed the running rest
      const next = r.e > Date.now() ? {...at, endsAt: r.e, total: Math.max(1, Math.round((r.e - r.s) / 1000))} : null;
      timerRef.current = next; setActiveTimer(next);
      return;
    }
    if (!(r.e > Date.now() + 1000)) return;
    const ex = PLAN_EX[r.x];
    if (!ex) return;
    const next = {exercise: ex, setNum: r.n, totalSets: r.N, color: planColorFor(r.x),
                  s: r.s, endsAt: r.e, total: Math.max(1, Math.round((r.e - r.s) / 1000)), remote: true};
    timerRef.current = next; setActiveTimer(next);
  }, [setActiveTimer]);

  // daily activity from the watch (w) and Samsung Health (hc)
  const [activity, setActivity] = useState(() => { try { return JSON.parse(localStorage.getItem("watchActivity")) || {}; } catch { return {}; } });
  const [health, setHealth] = useState(() => { try { return JSON.parse(localStorage.getItem("watchHealth")); } catch { return null; } });
  const onStats = useCallback((date, src, v) => {
    setActivity(prev => {
      const next = {...prev, [date]: {...(prev[date] || {}), [src]: v}};
      const keep = Object.keys(next).sort().slice(-14);
      const out = Object.fromEntries(keep.map(k => [k, next[k]]));
      try { localStorage.setItem("watchActivity", JSON.stringify(out)); } catch {}
      return out;
    });
  }, []);
  const onHealth = useCallback((v) => {
    setHealth(v);
    try { localStorage.setItem("watchHealth", JSON.stringify(v)); } catch {}
  }, []);
  // weight from Samsung Health (via the bridge app): newest wins, an unsynced phone entry is kept
  const onWeight = useCallback((date, v) => {
    const lb = Number(v.lb), t = v.t || 0;
    if (!(lb > 0)) return;
    const k = `wt/${date}`, m = metaRef.current[k];
    if (m && m.t >= t) return;
    const cur = (logsRef.current[date] || {}).weight;
    const hasLocal = cur !== "" && cur != null;
    if (!m && hasLocal && String(Number(cur)) !== String(lb)) return;
    metaRef.current[k] = {h: String(lb), t};
    saveMeta();
    if (hasLocal && Number(cur) === lb) return;
    const next = {...logsRef.current, [date]: {...(logsRef.current[date] || {}), weight: lb}};
    logsRef.current = next; setLogs(next); storageSet("logs", next);
  }, [setLogs]);

  useEffect(() => {
    if (!window.FTWLive) return;
    FTWLive.start({
      onSet: (date, exId, idx, cell) => queue.current.push({date, exId, idx, cell}),
      onSync: applyRemote,
      onRest: onRemoteRest,
      onStats, onWeight, onHealth,
    });
    let first = true;
    return FTWLive.onStatus(s => { if (s === "live" && first) { first = false; pushDiff(); } });
  }, []);

  useEffect(() => { const t = setTimeout(pushDiff, 400); return () => clearTimeout(t); }, [logs, pushDiff]);

  // rest timer started / cancelled on the phone
  const startTimer = useCallback((t) => {
    const s = Date.now(), total = parseRest(t.exercise.rest);
    const timer = {...t, s, endsAt: s + total * 1000, total};
    timerRef.current = timer; setActiveTimer(timer);
    if (window.FTWLive) FTWLive.pushRest({s, e: timer.endsAt, x: t.exercise.id, n: t.setNum, N: t.totalSets, b: "p", u: "p"});
  }, [setActiveTimer]);
  const cancelTimer = useCallback(() => {
    const at = timerRef.current;
    timerRef.current = null; setActiveTimer(null);
    if (at && window.FTWLive) FTWLive.pushRest({s: at.s, e: Date.now(), x: at.exercise.id, n: at.setNum, N: at.totalSets, b: at.remote ? "w" : "p", u: "p", c: true});
  }, [setActiveTimer]);
  // ±15s on the phone: same rest (same start), new end, so the watch shows it too
  const adjustTimer = useCallback((sec) => {
    const at = timerRef.current;
    if (!at) return;
    const e = at.endsAt + sec * 1000;
    if (e <= Date.now() + 1000) { cancelTimer(); return; }
    const next = {...at, endsAt: e, total: Math.max(1, Math.round((e - at.s) / 1000))};
    timerRef.current = next; setActiveTimer(next);
    if (window.FTWLive) FTWLive.pushRest({s: at.s, e, x: at.exercise.id, n: at.setNum, N: at.totalSets, b: at.remote ? "w" : "p", u: "p"});
  }, [setActiveTimer, cancelTimer]);

  return { startTimer, cancelTimer, adjustTimer, activity, health };
}

const agoText = (ms) => {
  if (!ms) return "never";
  const m = Math.round((Date.now() - ms) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
};

// Opens the FitTracker Health bridge app (Android) with this pairing, which syncs and returns here.
function openHealthBridge(onMissing) {
  const cfg = window.FTWLive && FTWLive.config();
  if (!cfg) return;
  const q = `u=${encodeURIComponent(cfg.url)}&c=${encodeURIComponent(cfg.code)}`;
  let left = false;
  const onHide = () => { if (document.hidden) left = true; };
  document.addEventListener("visibilitychange", onHide);
  setTimeout(() => { document.removeEventListener("visibilitychange", onHide); if (!left) onMissing(); }, 1800);
  location.href = `intent://sync?${q}#Intent;scheme=ftwbridge;end`;
}

function LiveStatus() {
  const [st, setSt] = useState(window.FTWLive ? FTWLive.status() : "off");
  useEffect(() => window.FTWLive ? FTWLive.onStatus(setSt) : undefined, []);
  return st;
}

function WatchSyncCard({ logs, setLogs, onCelebrate, health }) {
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const [last, setLast] = useState(() => { try { return localStorage.getItem("watchLastSync"); } catch { return null; } });
  const logsRef = useRef(logs);
  useEffect(() => { logsRef.current = logs; }, [logs]);
  const live = LiveStatus();
  const paired = !!(window.FTWLive && FTWLive.isPaired()) || live !== "off";
  const results = useRef([]);

  // called once per workout; saves immediately so nothing is lost mid-sync
  const onSession = (s) => {
    const r = mergeWatchSession(logsRef.current, s);
    logsRef.current = r.logs;
    setLogs(r.logs);
    storageSet("logs", r.logs);
    results.current.push({...r, name: s.name, handoff: s.handoff});
  };

  const finish = () => {
    const rs = results.current; results.current = [];
    const now = new Date().toISOString();
    try { localStorage.setItem("watchLastSync", now); } catch {}
    setLast(now);
    if (!rs.length) return;
    const d = (k) => { const x = new Date(k + "T12:00:00"); return `${DAY_NAMES[x.getDay()]} ${MONTH_NAMES[x.getMonth()]} ${x.getDate()}`; };
    const sets = rs.reduce((a, r) => a + r.added, 0);
    // a mid-workout hand-off from the watch (battery dying): carry on from the Log tab
    if (rs.some(r => r.handoff)) {
      const h = rs.find(r => r.handoff);
      setStatus(`${h.name}: ${sets ? `${sets} new set${sets === 1 ? "" : "s"} from your watch` : "already up to date"}. Finish the rest in the Log tab.`);
      onCelebrate({ emoji: "🔋", title: "HANDED OFF!", msg: h.allDone ? "Workout complete. Every set made it off your watch." : "Your watch sets are safe. Pick up where you left off." });
      return;
    }
    setStatus(rs.length === 1
      ? `${rs[0].name} → ${d(rs[0].key)} · ${sets} sets` + (rs[0].onPlan ? "" : " (not that day's plan, still counts for your pyramid)")
      : `${rs.length} workouts · ${sets} sets imported`);
    onCelebrate({ emoji: "⌚", title: "WATCH SYNCED!",
      msg: rs.some(r => r.allDone) ? "Workout complete. Every set logged from your wrist." : `${sets} sets added to your log.` });
  };

  const pair = async () => {
    setBusy(true); setStatus("");
    try {
      const r = await WatchSync.scanQR(onSession, {
        title: "Point at the pairing code on your watch",
        onPair: (text) => FTWLive.pairFrom(text),
      });
      if (r.paired) setStatus("Paired! Sets and rest timers now sync both ways.");
      else if (!r.cancelled) finish();
    } catch (e) { setStatus(e.message || "Camera error"); }
    setBusy(false);
  };
  const unpair = () => {
    if (!confirm("Unlink the watch? Your logged workouts stay on both devices.")) return;
    FTWLive.unpair(); setStatus("Watch unlinked.");
  };
  const connectHealth = () => {
    setStatus("");
    openHealthBridge(() => setStatus("Couldn't open the FitTracker Health app. Install it on this phone first (see README), then tap again."));
  };
  const hcLine = !health ? "Not connected" : health.err ? `Problem: ${health.err}` :
    `Synced ${agoText(health.t)}${health.n ? ` · ${health.n} workout${health.n === 1 ? "" : "s"} saved` : ""}`;

  const LIVE_TXT = {
    live:       ["#39d98a", "Live", "Sets and rest timers sync instantly"],
    connecting: ["#f0b429", "Connecting", "Reaching your sync database…"],
    offline:    ["#ff6b6b", "Offline", "Changes will sync when you're back online"],
    error:      ["#ff6b6b", "Error", "Can't reach the sync database. Check its rules (see README)."],
  };

  const btn = (primary) => ({
    flex: 1, padding: "12px 8px", borderRadius: 12, cursor: busy ? "default" : "pointer",
    border: primary ? "none" : "1px solid #2a2a3e", background: primary ? "#f0b429" : "#1a1a2e",
    color: primary ? "#000" : "#fff", opacity: busy ? 0.5 : 1,
    fontFamily: "'Barlow Condensed',sans-serif", fontSize: 16, fontWeight: 800, letterSpacing: 1,
  });
  const ago = last ? (() => {
    const m = Math.round((Date.now() - new Date(last)) / 60000);
    return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
  })() : "never";

  const lt = LIVE_TXT[live];
  return (
    <div style={{background: "#111120", borderRadius: 20, padding: "16px 18px", border: "1px solid #1a1a2e"}}>
      <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12}}>
        <div>
          <div style={{fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "#888aaa", fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5}}>⌚ Galaxy Watch</div>
          <div style={{fontFamily: "'Barlow Condensed',sans-serif", fontSize: 22, fontWeight: 800, color: "#fff"}}>{paired ? "WATCH LINK" : "SYNC WORKOUTS"}</div>
        </div>
        {paired && lt ? (
          <div style={{display: "flex", alignItems: "center", gap: 6, background: `${lt[0]}1a`, border: `1px solid ${lt[0]}55`, borderRadius: 20, padding: "5px 11px"}}>
            <div style={{width: 8, height: 8, borderRadius: "50%", background: lt[0], boxShadow: `0 0 6px ${lt[0]}`, animation: live === "live" ? "pulseGlow 2s ease-in-out infinite" : "none"}}/>
            <span style={{fontFamily: "'Barlow Condensed',sans-serif", fontSize: 14, fontWeight: 800, letterSpacing: 1, color: lt[0], textTransform: "uppercase"}}>{lt[1]}</span>
          </div>
        ) : (
          <div style={{fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "#555577", textAlign: "right"}}>Last sync<br/>{ago}</div>
        )}
      </div>

      {paired ? (
        <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, marginBottom: 12}}>
          <div style={{fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: "#888aaa", lineHeight: 1.4}}>{lt ? lt[2] : ""}</div>
          <button onClick={unpair} style={{background: "none", border: "none", color: "#555577", fontFamily: "'DM Sans',sans-serif", fontSize: 11, cursor: "pointer", whiteSpace: "nowrap", textDecoration: "underline"}}>Unlink</button>
        </div>
      ) : (
        <>
          <button disabled={busy} onClick={pair} style={{...btn(true), width: "100%", marginBottom: 8}}>🔗 PAIR WATCH FOR LIVE SYNC</button>
          <div style={{fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "#555577", margin: "0 2px 10px", lineHeight: 1.4}}>
            On the watch: open FitTracker → <b style={{color: "#888aaa"}}>Pair phone</b>, then tap the button above.
          </div>
        </>
      )}

      {paired && (
        <div style={{display: "flex", alignItems: "center", gap: 12, background: "#16162a", border: "1px solid #22223a", borderRadius: 14, padding: "10px 12px", marginBottom: 14}}>
          <div style={{fontSize: 22}}>❤️</div>
          <div style={{flex: 1, minWidth: 0}}>
            <div style={{fontFamily: "'Barlow Condensed',sans-serif", fontSize: 16, fontWeight: 800, color: "#fff", letterSpacing: 0.5}}>SAMSUNG HEALTH</div>
            <div style={{fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: health && health.err ? "#ff6b6b" : "#888aaa", lineHeight: 1.35}}>{hcLine}</div>
          </div>
          <button onClick={connectHealth} style={{...btn(!health), flex: "none", padding: "9px 14px", fontSize: 14}}>{health ? "SYNC NOW" : "CONNECT"}</button>
        </div>
      )}
      {status && <div style={{fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: "#f0b429", marginTop: 10, lineHeight: 1.4}}>{status}</div>}
    </div>
  );
}

/* ─── WATCH IMPORT (Progress tab settings — scan/Bluetooth a finished workout off the watch) ── */
function WatchImportCard({ logs, setLogs, onCelebrate }) {
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const logsRef = useRef(logs);
  useEffect(() => { logsRef.current = logs; }, [logs]);
  const hasBt = !!(window.WatchSync && WatchSync.supportsBluetooth());
  const results = useRef([]);

  const onSession = (s) => {
    const r = mergeWatchSession(logsRef.current, s);
    logsRef.current = r.logs;
    setLogs(r.logs);
    storageSet("logs", r.logs);
    results.current.push({...r, name: s.name, handoff: s.handoff});
  };

  const finish = () => {
    const rs = results.current; results.current = [];
    if (!rs.length) return;
    const d = (k) => { const x = new Date(k + "T12:00:00"); return `${DAY_NAMES[x.getDay()]} ${MONTH_NAMES[x.getMonth()]} ${x.getDate()}`; };
    const sets = rs.reduce((a, r) => a + r.added, 0);
    if (rs.some(r => r.handoff)) {
      const h = rs.find(r => r.handoff);
      setStatus(`${h.name}: ${sets ? `${sets} new set${sets === 1 ? "" : "s"} from your watch` : "already up to date"}. Finish the rest in the Log tab.`);
      onCelebrate && onCelebrate({ emoji: "🔋", title: "HANDED OFF!", msg: h.allDone ? "Workout complete. Every set made it off your watch." : "Your watch sets are safe. Pick up where you left off." });
      return;
    }
    setStatus(rs.length === 1
      ? `${rs[0].name} → ${d(rs[0].key)} · ${sets} sets` + (rs[0].onPlan ? "" : " (not that day's plan, still counts for your pyramid)")
      : `${rs.length} workouts · ${sets} sets imported`);
    onCelebrate && onCelebrate({ emoji: "⌚", title: "WATCH SYNCED!",
      msg: rs.some(r => r.allDone) ? "Workout complete. Every set logged from your wrist." : `${sets} sets added to your log.` });
  };

  const scan = async () => {
    setBusy(true); setStatus("");
    try {
      const r = await WatchSync.scanQR(onSession);
      if (r.duplicate) setStatus("Already imported that workout");
      else if (!r.cancelled) finish();
    } catch (e) { setStatus(e.message || "Camera error"); }
    setBusy(false);
  };

  const bluetooth = async () => {
    setBusy(true); setStatus("");
    try {
      const r = await WatchSync.syncBluetooth(onSession, setStatus);
      if (r.imported) finish(); else { setStatus("Up to date: nothing new on the watch"); finish(); }
    } catch (e) { setStatus(e.message || "Bluetooth error"); }
    setBusy(false);
  };

  const btn = (primary) => ({
    flex: 1, padding: "12px 8px", borderRadius: 12, cursor: busy ? "default" : "pointer",

    color: primary ? "#000" : "#fff", opacity: busy ? 0.5 : 1,
    fontFamily: "'Barlow Condensed',sans-serif", fontSize: 16, fontWeight: 800, letterSpacing: 1,
  });

  return (
    <div style={{background: "#111120", borderRadius: 20, padding: "16px 18px", border: "1px solid #1a1a2e"}}>
      <div style={{fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "#888aaa", fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5}}>⌚ Galaxy Watch</div>
      <div style={{fontFamily: "'Barlow Condensed',sans-serif", fontSize: 22, fontWeight: 800, color: "#fff", marginBottom: 12}}>IMPORT A FINISHED WORKOUT</div>
      <div style={{display: "flex", gap: 8}}>
        <button disabled={busy} onClick={scan} style={btn(false)}>📷 SCAN CODE</button>
        <button disabled={busy || !hasBt} onClick={bluetooth} style={btn(false)}>{hasBt ? "🔵 BLUETOOTH" : "BLUETOOTH: CHROME ONLY"}</button>
      </div>
      {status && <div style={{fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: "#f0b429", marginTop: 10, lineHeight: 1.4}}>{status}</div>}
    </div>
  );
}

/* ─── MOTION (React Bits-style components on GSAP) ───────────────────────── */
const REDUCED_MOTION = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const MOTION = !!window.gsap && !REDUCED_MOTION;

// Count Up: tweens from the number on screen to the new one. React never owns the text, so re-renders can't make it jump.
function CountUp({ to = 0, decimals = 0, duration = 1, prefix = "", suffix = "" }) {
  const el = useRef(null), shown = useRef(0);
  const text = (v) => prefix + (decimals ? v.toFixed(decimals) : Math.round(v).toLocaleString()) + suffix;
  React.useLayoutEffect(() => {
    if (!MOTION) { shown.current = to; el.current.textContent = text(to); return; }
    const o = { v: shown.current };
    el.current.textContent = text(o.v);
    const t = gsap.to(o, { v: to, duration, ease: "power2.out",
      onUpdate: () => { shown.current = o.v; if (el.current) el.current.textContent = text(o.v); } });
    return () => t.kill();
  }, [to, decimals, prefix, suffix]);
  return <span ref={el}/>;
}

// Shiny Text: a light sweep across gradient-clipped text
function ShinyText({ children, color = "#f0b429", shine = "#fff4cc", speed = 3.5 }) {
  return (
    <span style={{
      backgroundImage: `linear-gradient(110deg, ${color} 40%, ${shine} 50%, ${color} 60%)`,
      backgroundSize: "200% 100%", WebkitBackgroundClip: "text", backgroundClip: "text",
      color: "transparent", WebkitTextFillColor: "transparent",
      animation: `shine ${speed}s linear infinite`,
    }}>{children}</span>
  );
}

// Spotlight Card: a soft glow that follows your finger or pointer
function SpotlightCard({ children, glow = "rgba(240,180,41,0.18)", style, onClick }) {
  const ref = useRef(null);
  const move = (e) => {
    const r = ref.current.getBoundingClientRect();
    ref.current.style.setProperty("--mx", `${e.clientX - r.left}px`);
    ref.current.style.setProperty("--my", `${e.clientY - r.top}px`);
    ref.current.style.setProperty("--spot", "1");
  };
  const leave = () => ref.current.style.setProperty("--spot", "0");
  return (
    <div ref={ref} onClick={onClick} onPointerMove={move} onPointerDown={move} onPointerLeave={leave} onPointerCancel={leave}
      style={{position:"relative", overflow:"hidden", ...style}}>
      <div style={{position:"absolute", inset:0, pointerEvents:"none", opacity:"var(--spot, 0)", transition:"opacity 0.35s ease",
        background:`radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%), ${glow}, transparent 70%)`}}/>
      {children}
    </div>
  );
}

// Animated List: stagger a screen's sections in whenever `key` changes
function useStaggerIn(ref, key) {
  React.useLayoutEffect(() => {
    const root = ref.current && ref.current.firstElementChild;
    if (!MOTION || !root) return;
    const t = gsap.from(root.children, { y: 18, opacity: 0, duration: 0.45, ease: "power3.out", stagger: 0.06, clearProps: "transform" });
    return () => t.revert();
  }, [key]);
}

// Flip Panel: collapses to nothing, and flips between two faces. Its height follows the face
// that's showing, so neither side is ever clipped and there's no dead space.
function FlipPanel({ open, flipped, front, back }) {
  const frontRef = useRef(null), backRef = useRef(null);
  const [h, setH] = useState({ f: 0, b: 0 });
  React.useLayoutEffect(() => {
    const measure = () => setH({ f: frontRef.current.offsetHeight, b: backRef.current.offsetHeight });
    measure();
    if (!window.ResizeObserver) return;
    const ro = new ResizeObserver(measure);
    ro.observe(frontRef.current); ro.observe(backRef.current);
    return () => ro.disconnect();
  }, []);
  const d = REDUCED_MOTION ? 0 : 0.45, flipD = REDUCED_MOTION ? 0 : 0.6, ease = "cubic-bezier(.4,0,.2,1)";
  // the face turning away stays visible until it's edge-on, then drops out of tab order and taps
  const face = (on) => ({ position:"absolute", top:0, left:0, right:0, backfaceVisibility:"hidden", WebkitBackfaceVisibility:"hidden",
    visibility: on ? "visible" : "hidden", transition:`visibility 0s linear ${on ? 0 : flipD / 2}s` });
  return (
    <div aria-hidden={!open} style={{ height: open ? (flipped ? h.b : h.f) : 0, overflow:"hidden", perspective:1200,
      visibility: open ? "visible" : "hidden", transition:`height ${d}s ${ease}, visibility 0s linear ${open ? 0 : d}s` }}>
      <div style={{ position:"relative", transformStyle:"preserve-3d", transform: flipped ? "rotateY(180deg)" : "none",
        transition:`transform ${flipD}s ${ease}` }}>
        <div ref={frontRef} style={face(!flipped)}>{front}</div>
        <div ref={backRef} style={{ ...face(flipped), transform:"rotateY(180deg)" }}>{back}</div>
      </div>
    </div>
  );
}

/* ─── PROGRESS RING ──────────────────────────────────────────────────────── */
function Ring({ pct=0, color="#f0b429", size=80, stroke=7, children }) {
  const r = (size - stroke*2) / 2;
  const circ = 2 * Math.PI * r;
  // start empty and fill on the next frame, so rings sweep in when a screen opens
  const [ready, setReady] = useState(!MOTION);
  useEffect(() => { if (ready) return; const id = requestAnimationFrame(() => setReady(true)); return () => cancelAnimationFrame(id); }, []);
  const dash = circ - ((ready ? pct : 0)/100)*circ;
  return (
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={pct>0?color:"transparent"} strokeWidth={stroke}
          strokeDasharray={circ} strokeDashoffset={dash} strokeLinecap="round"
          style={{transition:"stroke-dashoffset 0.8s ease"}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{children}</div>
    </div>
  );
}

/* ─── DATA: EXPORT / IMPORT / CLEAR ──────────────────────────────────────── */
const _normCell = (s) => !s ? {done:false,lbs:"",reps:""} : typeof s === "boolean" ? {done:s,lbs:"",reps:""} : {done:!!s.done, lbs:s.lbs ?? "", reps:s.reps ?? ""};
const _hasData = (c) => c.done || c.lbs !== "" || c.reps !== "";
function _pickCell(a, b) {
  const A = _normCell(a), B = _normCell(b);
  if (A.done && (A.lbs || A.reps)) return A;
  if (B.done && (B.lbs || B.reps)) return B;
  if (_hasData(A)) return A;
  if (_hasData(B)) return B;
  return A.done ? A : B;
}
// Merge an incoming logs object into local logs: union of days, keeping the richest set.
function mergeLogs(local, inc) {
  const out = {...local};
  for (const [date, day] of Object.entries(inc || {})) {
    const cur = {...(out[date] || {})}; cur.workouts = {...(cur.workouts || {})};
    const iw = (day && day.workouts) || {};
    for (const [k, v] of Object.entries(iw)) {
      if (!k.endsWith("_sets") || !Array.isArray(v)) continue;
      const ex = cur.workouts[k] || [];
      const n = Math.max(ex.length, v.length); const merged = [];
      for (let i = 0; i < n; i++) merged[i] = _pickCell(ex[i], v[i]);
      cur.workouts[k] = merged;
    }
    for (const k of Object.keys(cur.workouts)) {
      if (k.endsWith("_sets")) {
        const arr = cur.workouts[k] || [];
        cur.workouts[k.slice(0, -5)] = arr.length > 0 && arr.every(s => _normCell(s).done);
      }
    }
    if (day && day.meals) cur.meals = {...(day.meals || {}), ...(cur.meals || {})};
    if (day && day.supplements) cur.supplements = {...(day.supplements || {}), ...(cur.supplements || {})};
    if (day && day.weight != null && cur.weight == null) cur.weight = day.weight;
    out[date] = cur;
  }
  return out;
}

// ── CSV import: Date,Exercise,Set,Weight,Reps,Bodyweight → the same shape mergeLogs expects.
// Exercise matches by id (bench) or display name (Barbell Bench Press), case-insensitive.
const EXERCISE_LOOKUP = (() => {
  const m = {};
  Object.values(WEEKLY_PLAN).forEach(p => p.exercises.forEach(e => {
    m[e.id.toLowerCase()] = e.id;
    m[e.name.toLowerCase()] = e.id;
  }));
  return m;
})();

function parseCsvRows(text) {
  // minimal CSV parser: handles quoted fields with embedded commas/newlines
  const rows = []; let row = []; let field = ""; let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ""; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(field); field = ""; rows.push(row); row = [];
    } else field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

function parseCsvLogs(text) {
  const rows = parseCsvRows(text);
  if (!rows.length) throw new Error("empty file");
  const header = rows[0].map(h => h.trim().toLowerCase());
  const col = (name) => header.indexOf(name);
  const cDate = col("date"), cEx = col("exercise"), cSet = col("set"), cW = col("weight"), cR = col("reps"), cBw = col("bodyweight");
  if (cDate < 0 || cEx < 0) throw new Error('CSV needs at least "Date" and "Exercise" columns');

  const inc = {};
  let skipped = 0;
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const date = (r[cDate] || "").trim();
    const exRaw = (r[cEx] || "").trim();
    if (!date || !exRaw) continue;
    const exId = EXERCISE_LOOKUP[exRaw.toLowerCase()];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !exId) { skipped++; continue; }

    const day = inc[date] || (inc[date] = { workouts: {} });
    const key = exId + "_sets";
    const arr = day.workouts[key] || (day.workouts[key] = []);
    const setNum = cSet >= 0 ? parseInt(r[cSet], 10) : NaN;
    const idx = Number.isFinite(setNum) && setNum > 0 ? setNum - 1 : arr.length;
    const lbsVal = cW >= 0 ? (r[cW] || "").trim() : "";
    const repsVal = cR >= 0 ? (r[cR] || "").trim() : "";
    arr[idx] = { done: true, lbs: lbsVal, reps: repsVal };

    const bw = cBw >= 0 ? (r[cBw] || "").trim() : "";
    if (bw && !isNaN(parseFloat(bw))) day.weight = parseFloat(bw);
  }
  // fill any sparse gaps (e.g. Set numbers skipped) so arrays aren't holey
  Object.values(inc).forEach(day => Object.keys(day.workouts).forEach(k => {
    day.workouts[k] = Array.from(day.workouts[k], (c) => c || { done: false, lbs: "", reps: "" });
  }));
  return { inc, days: Object.keys(inc).length, skipped };
}

function DataCard({ logs, setLogs, onCelebrate }) {
  const fileRef = useRef(null);
  const [msg, setMsg] = useState("");
  const [adv, setAdv] = useState(false);
  const dayCount = Object.keys(logs).length;

  const doExport = () => {
    let profile = null; try { profile = JSON.parse(localStorage.getItem("profile")); } catch {}
    const payload = { v: 1, app: "fittracker", exportedAt: new Date().toISOString(), logs, profile };
    const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `fittracker-backup-${todayKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    setMsg(`Exported ${dayCount} day${dayCount === 1 ? "" : "s"}.`);
  };

  const onFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const text = await f.text();
      const isCsv = /\.csv$/i.test(f.name) || (!/\.json$/i.test(f.name) && text.trim()[0] !== "{");
      let inc, added, skipped = 0;
      if (isCsv) {
        const r = parseCsvLogs(text);
        inc = r.inc; added = r.days; skipped = r.skipped;
      } else {
        const data = JSON.parse(text);
        inc = data && data.logs ? data.logs : data;
        if (!inc || typeof inc !== "object" || Array.isArray(inc)) throw new Error("not a FitTracker backup");
        added = Object.keys(inc).length;
      }
      const merged = mergeLogs(logs, inc);
      setLogs(merged); await storageSet("logs", merged);
      setMsg(`Imported ${added} day${added === 1 ? "" : "s"}.` + (skipped ? ` (${skipped} row${skipped === 1 ? "" : "s"} skipped — check date format / exercise name)` : ""));
      onCelebrate && onCelebrate({ emoji: "📥", title: "WORKOUTS IMPORTED!", msg: `${added} days merged into your log.` });
    } catch (err) {
      setMsg("Couldn't read that file: " + (err.message || err));
    }
    e.target.value = "";
  };

  const clearAll = () => {
    const typed = prompt("This permanently deletes ALL workout data on this phone and can't be undone.\n\nExport a backup first if you're unsure.\n\nType CLEAR to confirm:");
    if ((typed || "").trim().toUpperCase() !== "CLEAR") { setMsg("Clear cancelled."); return; }
    setLogs({}); storageSet("logs", {});
    setMsg("All workout data cleared.");
  };

  const btn = (bg, fg) => ({
    flex: 1, padding: "11px 8px", borderRadius: 12, border: "1px solid #2a2a3e", cursor: "pointer",
    background: bg, color: fg, fontFamily: "'Barlow Condensed',sans-serif", fontSize: 15, fontWeight: 800, letterSpacing: 1,
  });

  return (
    <div style={{ background: "#111120", borderRadius: 20, padding: "16px 18px", border: "1px solid #1a1a2e" }}>
      <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "#888aaa", fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5 }}>Data</div>
      <div style={{ fontFamily: "'Barlow Condensed',sans-serif", fontSize: 22, fontWeight: 800, color: "#fff", marginBottom: 4 }}>BACKUP & RESTORE</div>
      <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: "#888aaa", marginBottom: 12 }}>{dayCount} day{dayCount === 1 ? "" : "s"} logged on this phone</div>
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <button onClick={doExport} style={btn("#1a1a2e", "#fff")}>⬇ EXPORT</button>
        <button onClick={() => fileRef.current && fileRef.current.click()} style={btn("#f0b429", "#000")}>⬆ IMPORT</button>
      </div>
      <input ref={fileRef} type="file" accept="application/json,.json,.csv,text/csv" onChange={onFile} style={{ display: "none" }} />
      {msg && <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: "#f0b429", marginTop: 10, lineHeight: 1.4 }}>{msg}</div>}
      <div onClick={() => setAdv(a => !a)} style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "#444466", marginTop: 14, cursor: "pointer", userSelect: "none" }}>
        {adv ? "▾" : "▸"} Advanced
      </div>
      {adv && (
        <div style={{ marginTop: 10, padding: "12px 14px", background: "#16101a", border: "1px solid #3a2030", borderRadius: 14 }}>
          <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "#888aaa", lineHeight: 1.45, marginBottom: 10 }}>
            Danger zone. Clearing wipes every logged workout on this phone and can't be undone — export a backup first.
          </div>
          <button onClick={clearAll} style={{ ...btn("#1a1a2e", "#ff6b6b"), width: "100%", borderColor: "#3a2030" }}>🗑 CLEAR ALL DATA</button>
        </div>
      )}
    </div>
  );
}

/* ─── REST TIMER HELPERS ─────────────────────────────────────────────────── */
function parseRest(str) {
  if(!str) return 60;
  const minMatch = str.match(/(\d+)\s*min/);
  if(minMatch) return parseInt(minMatch[1]) * 60;
  const secMatch = str.match(/(\d+)\s*s/);
  if(secMatch) return parseInt(secMatch[1]);
  return 60;
}

function TimerIsland({ timer, onStop, onCancel, onAdjust }) {
  // timer = { exercise, setNum, totalSets, color, s, endsAt, total }  (s/endsAt: shared with the watch)
  // Time left always comes from the shared end time, rounded up like the watch, so both read the same
  // second, and it can't drift when the phone throttles timers (locked screen, background tab).
  const total      = timer.total || parseRest(timer.exercise.rest);
  const endsAt     = timer.endsAt || (timer.s || Date.now()) + total * 1000;
  const left       = () => Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
  const [remaining, setRemaining] = useState(left);
  const [done,      setDone]      = useState(false);
  const [expanded,  setExpanded]  = useState(false);
  const live = LiveStatus();
  const linked = live === "live";

  useEffect(() => {
    setDone(false);
    let id = null, endT = null;
    const tick = () => {
      const r = left();
      setRemaining(r);
      if (r > 0 || endT) return;
      clearInterval(id);
      setDone(true);
      try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch {}
      endT = setTimeout(onStop, 1000);
    };
    tick();
    if (!endT) id = setInterval(tick, 250);
    document.addEventListener("visibilitychange", tick);
    return () => { clearInterval(id); clearTimeout(endT); document.removeEventListener("visibilitychange", tick); };
  }, [endsAt, timer.s, onStop]);

  const pct      = Math.max(0, remaining / total);
  const mins     = Math.floor(remaining / 60);
  const secs     = remaining % 60;
  const timeStr  = mins > 0 ? `${mins}:${String(secs).padStart(2,"0")}` : `${remaining}`;
  const col      = done ? "#39d98a" : remaining <= 5 ? "#ff6b6b" : remaining <= 15 ? "#f0b429" : timer.color;
  const urgent   = remaining <= 5 && !done;

  // Arc for the pill outline
  const W = expanded ? 320 : (linked ? 240 : 220), H = expanded ? 52 : 36, R = H / 2;
  const arc = `M ${R},0 H ${W - R} A ${R},${R} 0 0 1 ${W},${R} A ${R},${R} 0 0 1 ${W - R},${H} H ${R} A ${R},${R} 0 0 1 0,${R} A ${R},${R} 0 0 1 ${R},0 Z`;
  const perim = 2 * Math.PI * R + 2 * (W - 2 * R);

  return (
    <div style={{
      position:"fixed", top:10, left:"50%",
      transform:"translateX(-50%)",
      zIndex:500,
      animation:"islandIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both",
      cursor:"pointer",
    }} onClick={() => setExpanded(e => !e)}>

      {/* Pill shell */}
      <div style={{
        position:"relative",
        width:W, height:H,
        background:"#08080f",
        borderRadius:R,
        display:"flex", alignItems:"center",
        padding: expanded ? "0 14px" : "0 10px",
        gap: expanded ? 10 : 7,
        boxShadow:`0 4px 24px rgba(0,0,0,0.7), 0 0 0 1px ${col}33`,
        transition:"width 0.3s cubic-bezier(0.34,1.56,0.64,1), height 0.3s cubic-bezier(0.34,1.56,0.64,1), padding 0.3s ease",
        overflow:"hidden",
      }}>

        {/* SVG draining outline */}
        <svg style={{position:"absolute",inset:0,pointerEvents:"none"}} width={W} height={H}>
          <path d={arc} fill="none" stroke={`${col}22`} strokeWidth="1.5"/>
          <path d={arc} fill="none" stroke={col} strokeWidth="1.5"
            strokeDasharray={perim}
            strokeDashoffset={perim * pct}
            strokeLinecap="round"
            style={{transition:"stroke-dashoffset 1s linear, stroke 0.4s ease"}}
          />
        </svg>

        {/* Tiny color dot */}
        <div style={{
          width: done ? 10 : urgent ? 10 : 8,
          height: done ? 10 : urgent ? 10 : 8,
          borderRadius:"50%",
          background: col,
          flexShrink:0,
          transition:"all 0.3s",
          animation: urgent ? "streakBounce 0.4s ease-in-out infinite" : done ? "pop 0.4s ease" : "none",
          boxShadow: `0 0 ${urgent ? 8 : 4}px ${col}`,
        }}/>

        {/* Set badge */}
        <div style={{
          fontFamily:"'Barlow Condensed',sans-serif",
          fontSize: expanded ? 13 : 11,
          fontWeight:800, color:col, letterSpacing:0.3,
          flexShrink:0, transition:"font-size 0.2s",
        }}>
          {done ? "DONE" : `S${timer.setNum}/${timer.totalSets}`}
        </div>

        {/* Separator */}
        <div style={{width:1,height:14,background:"rgba(255,255,255,0.1)",flexShrink:0}}/>

        {/* Countdown */}
        <div style={{
          fontFamily:"'Barlow Condensed',sans-serif",
          fontSize: expanded ? 22 : 17,
          fontWeight:900, color:"#fff", letterSpacing:-0.5,
          lineHeight:1, flexShrink:0,
          transition:"font-size 0.2s",
          animation: urgent ? "streakBounce 0.4s ease-in-out infinite" : "none",
        }}>{done ? "✅" : timeStr}</div>

        {/* same countdown is on the watch right now */}
        {linked && !done && (
          <div title="Synced with your watch" style={{fontSize:11,color:"#39d98a",flexShrink:0,display:"flex",alignItems:"center",gap:2,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,letterSpacing:0.5}}>
            ⌚{!expanded && <span>SYNCED</span>}
          </div>
        )}

        {/* Exercise name — only when expanded */}
        {expanded && (
          <div style={{
            fontFamily:"'DM Sans',sans-serif", fontSize:11, color:"rgba(255,255,255,0.45)",
            overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", flex:1,
            animation:"fadeUp 0.2s ease",
          }}>{timer.exercise.name}</div>
        )}

        {/* Expanded controls */}
        {expanded && (
          <div style={{display:"flex",gap:5,flexShrink:0,animation:"fadeUp 0.2s ease"}}>
            {/* ±15s instead of pause: a pause can't be shared, a new end time can */}
            {[-15, 15].map(d => (
              <button key={d} aria-label={`${d > 0 ? "Add" : "Remove"} 15 seconds`} onClick={e=>{e.stopPropagation();onAdjust && onAdjust(d);}} style={{
                padding:"3px 7px",borderRadius:6,border:"none",cursor:"pointer",
                background:"rgba(255,255,255,0.08)", color:"#888aaa",
                fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,fontWeight:800,
              }}>{d > 0 ? "+15" : "−15"}</button>
            ))}
            <button onClick={e=>{e.stopPropagation();(onCancel||onStop)();}} style={{
              padding:"3px 8px",borderRadius:6,border:"none",cursor:"pointer",
              background:"rgba(255,255,255,0.05)",color:"#555577",
              fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,fontWeight:800,
            }}>✕</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── LOCAL PYRAMID CALCULATOR ───────────────────────────────────────────── */
// Determines warm-up → working weight pyramid from last session data, no backend needed
function calcPyramid(numSets, lastSessionSets) {
  // Find the heaviest logged weight from the last session
  const logged = (lastSessionSets || []).map(s => parseFloat(s.lbs)).filter(n => !isNaN(n) && n > 0);
  const topWeight = logged.length ? Math.max(...logged) : null;

  if(!topWeight) return null; // no prior data → no suggestion yet

  // Build pyramid: sets go from ~60% up to ~100% of last top weight, in 5 lb increments
  const pcts = numSets === 2 ? [0.75, 1.0]
             : numSets === 3 ? [0.65, 0.82, 1.0]
             : numSets === 4 ? [0.60, 0.75, 0.88, 1.0]
             : numSets === 5 ? [0.55, 0.68, 0.80, 0.92, 1.0]
             : Array.from({length:numSets},(_,i)=> 0.55 + (0.45/(numSets-1))*i);

  const notes = ["warm-up","build","working weight","push hard","max effort"];
  return pcts.map((p, i) => {
    const raw   = topWeight * p;
    const lbs   = Math.round(raw / 5) * 5; // round to nearest 5 lbs
    const note  = notes[Math.min(i, notes.length-1)];
    return { set: i+1, lbs, note };
  });
}

function PyramidSuggestion({ exercise, numSets, lastSessionSets, planColor, alwaysOpen }) {

            <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:9,color:"#555577"}}>lbs</span>
            <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:9,color:planColor,marginTop:3,textAlign:"center",lineHeight:1.3}}>{w.note}</span>
          </div>

  );

/* ─── DAILY LOG ──────────────────────────────────────────────────────────── */
function DailyLog({ selectedDate, logs, setLogs, onCelebrate, profile, activeTimer, onStartTimer, onStopTimer }) {
  const log = logs[selectedDate] || {};
  const dow = DOW(selectedDate);
  const plan = WEEKLY_PLAN[dow];
  const date = new Date(selectedDate + "T12:00:00");
  const dateLabel = `${DAY_NAMES[date.getDay()]}, ${MONTH_NAMES[date.getMonth()]} ${date.getDate()} ${date.getFullYear()}`;
  const [weightInput, setWeightInput] = useState(log.weight||"");
  const [tab, setTab] = useState("workout");
  const prevRef = useRef({});

  // Parse numeric set count from string like "4", "3"
  const numSets = useCallback((ex) => parseInt(ex.sets) || 1, []);

  // Returns array of {done, lbs, reps} for each set
  const getSetsData = useCallback((exId, total) => {
    const raw = (log.workouts||{})[exId + "_sets"] || [];
    return Array.from({length: total}, (_, i) => {
      const s = raw[i];
      if(!s) return {done:false, lbs:"", reps:""};
      if(typeof s === "boolean") return {done:s, lbs:"", reps:""};
      return {done:!!s.done, lbs:s.lbs||"", reps:s.reps||""};
    });
  }, [log]);

  // Backward-compat shim used by completion checks
  const setsDoneFor = useCallback((exId, total) => {
    return getSetsData(exId, total).map(s => s.done);
  }, [getSetsData]);

  // Find last logged session for an exercise across all dates before today
  const getLastSession = useCallback((exId, total) => {
    const sorted = Object.keys(logs)
      .filter(k => k < selectedDate && logs[k]?.workouts?.[exId+"_sets"])
      .sort((a,b) => b.localeCompare(a));
    if(!sorted.length) return null;
    const raw = logs[sorted[0]].workouts[exId+"_sets"] || [];
    return Array.from({length:total},(_,i)=>{
      const s = raw[i];
      if(!s) return {done:false,lbs:"",reps:""};
      if(typeof s==="boolean") return {done:s,lbs:"",reps:""};
      return {done:!!s.done,lbs:s.lbs||"",reps:s.reps||""};
    });
  }, [logs, selectedDate]);

  const updateSet = useCallback(async (ex, setIdx, field, value) => {
    const total = numSets(ex);
    const newLogs = {...logs};
    const day = {...(newLogs[selectedDate]||{})};
    day.workouts = {...(day.workouts||{})};

    const prev = getSetsData(ex.id, total);
    const updated = prev.map((s,i) => i===setIdx ? {...s, [field]: value} : {...s});
    // auto-mark done when weight+reps filled in
    if(field==="done") updated[setIdx].done = value;
    day.workouts[ex.id+"_sets"] = updated;
    day.workouts[ex.id] = updated.every(s=>s.done);

    newLogs[selectedDate] = day;
    setLogs(newLogs);
    await storageSet("logs", newLogs);

    if(field==="done" && value) {
      onStartTimer({ exercise:ex, setNum:setIdx+1, totalSets:total, color:plan.color });
    } else if(field==="done" && !value) {
      onStopTimer();
    }

    // Celebration check
    const prevDay = prevRef.current[selectedDate]||{};
    const allDoneNow = plan.exercises.every(e => {
      const n=numSets(e); const s=Array.from({length:n},(_,i)=>!!((day.workouts[e.id+"_sets"]||[])[i]?.done));
      return s.every(Boolean);
    });
    const allDonePrev = plan.exercises.every(e => {
      const n=numSets(e); const s=Array.from({length:n},(_,i)=>!!((prevDay.workouts||{})[e.id+"_sets"]?.[i]?.done));
      return s.every(Boolean);
    });
    if(allDoneNow && !allDonePrev && plan.exercises.length>0)
      onCelebrate({emoji:"💪",title:"WORKOUT COMPLETE!",msg:`${plan.name} destroyed. Every set done.`});

    prevRef.current[selectedDate] = day;
  }, [logs, selectedDate, plan, numSets, getSetsData, setLogs, onCelebrate, onStartTimer, onStopTimer]);

  const update = useCallback(async (path, val) => {
    const newLogs = {...logs};
    const day = {...(newLogs[selectedDate]||{})};
    if(path[0]==="meals") { day.meals={...(day.meals||{})}; day.meals[path[1]]=val; }
    else if(path[0]==="supplements") { day.supplements={...(day.supplements||{})}; day.supplements[path[1]]=val; }
    else if(path[0]==="weight") { day.weight=val; }
    newLogs[selectedDate]=day;
    setLogs(newLogs);
    await storageSet("logs",newLogs);

    const prev = prevRef.current[selectedDate]||{};
    if(path[0]==="meals" && val===true) {
      const dn = MEALS.filter(m=>(day.meals||{})[m.id]).length;
      const db = MEALS.filter(m=>(prev.meals||{})[m.id]).length;
      if(dn===MEALS.length && db<MEALS.length)
        onCelebrate({emoji:"🍽️",title:"ALL MEALS HIT!",msg:"Nutrition on point. Muscles are feasting."});
    }
    if(path[0]==="supplements" && val===true) {
      const dn = SUPPLEMENTS.filter(s=>(day.supplements||{})[s.id]).length;
      const db = SUPPLEMENTS.filter(s=>(prev.supplements||{})[s.id]).length;
      if(dn===SUPPLEMENTS.length && db<SUPPLEMENTS.length)
        onCelebrate({emoji:"💊",title:"SUPPLEMENTS DONE!",msg:"Stack complete. Optimization mode activated."});
    }
    prevRef.current[selectedDate] = day;
  }, [logs, selectedDate, setLogs, onCelebrate]);

  // Count completed exercises (all sets done) for tab badge
  const exDoneCount = plan.exercises.filter(ex => {
    const total = numSets(ex);
    const sets = setsDoneFor(ex.id, total);
    return sets.every(Boolean);
  }).length;

  // Workout cards stay collapsed except the one you're on (first unfinished, or the one resting).
  // Tapping a card overrides that for the day; finished cards fold away on their own.
  const [openOverride, setOpenOverride] = useState({});
  const [flippedEx, setFlippedEx] = useState({});
  useEffect(() => { setOpenOverride({}); setFlippedEx({}); }, [selectedDate]);
  const currentExId = (plan.exercises.find(ex => !setsDoneFor(ex.id, numSets(ex)).every(Boolean)) || {}).id;
  const isOpen = (ex) => ex.id in openOverride ? openOverride[ex.id]
    : ex.id === currentExId || activeTimer?.exercise?.id === ex.id;
  const toggleOpen = (ex) => setOpenOverride(o => ({...o, [ex.id]: !isOpen(ex)}));
  const allOpen = plan.exercises.length > 0 && plan.exercises.every(isOpen);
  const setAllOpen = (v) => setOpenOverride(Object.fromEntries(plan.exercises.map(ex => [ex.id, v])));

  const saveWeight = useCallback(async () => {
    const w = parseFloat(weightInput);
    if(isNaN(w)||w<100||w>400) return;
    await update(["weight"], w);
    // Check milestones
    const gained = w - profile.startWeight;
    for(const m of MILESTONES) {
      const prev = logs[selectedDate]?.weight;
      if(gained>=m.lbs && (!prev||prev-profile.startWeight<m.lbs))
        onCelebrate(m);
    }
  }, [weightInput, update, profile, logs, selectedDate]);

  const tabs = [
    {id:"workout",    label:"Workout",    icon:"💪", count: plan.exercises.length > 0 ? `${exDoneCount}/${plan.exercises.length}` : "Rest"},
    {id:"meals",      label:"Meals",      icon:"🍽️", count: `${MEALS.filter(m=>(log.meals||{})[m.id]).length}/${MEALS.length}`},
    {id:"supps",      label:"Supps",      icon:"💊", count: `${SUPPLEMENTS.filter(s=>(log.supplements||{})[s.id]).length}/${SUPPLEMENTS.length}`},
    {id:"weight",     label:"Weight",     icon:"⚖️", count: log.weight ? `${log.weight}` : "—"},
  ];

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%", animation:MOTION?"none":"fadeUp 0.4s ease both"}}>
      {/* Date header */}
      <div style={{padding:"16px 16px 0"}}>
        <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"#888aaa"}}>{dateLabel}</div>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,fontWeight:900,color:"#fff",letterSpacing:0.5}}>
          <span style={{color:plan.color}}>{plan.emoji} {plan.name}</span>
        </div>
        <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"#555577",marginTop:2}}>{plan.sub}</div>
      </div>

      {/* Tab bar */}
      <div style={{display:"flex",padding:"12px 16px 0",gap:8,overflowX:"auto"}}>
        {tabs.map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            display:"flex",alignItems:"center",gap:6,padding:"8px 14px",borderRadius:12,border:"none",cursor:"pointer",
            background: tab===t.id ? "#f0b429" : "#1a1a2e",
            color: tab===t.id ? "#000" : "#888aaa",
            fontFamily:"'DM Sans',sans-serif", fontWeight:600, fontSize:12, whiteSpace:"nowrap",
            transition:"all 0.2s",
          }}>
            <span>{t.icon}</span>{t.label}
            <span style={{
              background: tab===t.id ? "rgba(0,0,0,0.2)" : "rgba(255,255,255,0.08)",
              borderRadius:6, padding:"1px 6px", fontSize:10, fontWeight:700
            }}>{t.count}</span>
          </button>
        ))}
      </div>

      {/* Content */}
      <div style={{flex:1, overflowY:"auto", padding:"14px 16px 16px"}}>
        {/* WORKOUT TAB */}
        {tab==="workout" && (
          plan.type==="rest" ? (
            <div style={{textAlign:"center",padding:"40px 20px"}}>
              <div style={{fontSize:60,marginBottom:16}}>{plan.emoji}</div>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,fontWeight:800,color:"#fff"}}>{plan.name}</div>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:14,color:"#888aaa",marginTop:8}}>{plan.sub}</div>
              <div style={{marginTop:20,padding:"16px",background:"#111120",borderRadius:16,fontSize:14,color:"#555577",lineHeight:1.6,fontFamily:"'DM Sans',sans-serif"}}>
                Focus on nutrition, sleep 8–9 hrs, foam roll, and light walking. This is when muscles GROW.
              </div>
            </div>
          ) : (
            <>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"-4px 2px 10px"}}>
                <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"#555577"}}>Tap a card to open · ↻ flips to the plan</span>
                <button onClick={() => setAllOpen(!allOpen)} style={{background:"none",border:"none",cursor:"pointer",color:plan.color,fontFamily:"'DM Sans',sans-serif",fontSize:11,fontWeight:600,padding:"4px 0"}}>
                  {allOpen ? "Collapse all" : "Expand all"}
                </button>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {plan.exercises.map((ex, i) => {
                  const total     = numSets(ex);
                  const setsData  = getSetsData(ex.id, total);
                  const allDone   = setsData.every(s=>s.done);
                  const anyDone   = setsData.some(s=>s.done);
                  const doneCount = setsData.filter(s=>s.done).length;
                  const isActive  = activeTimer?.exercise?.id === ex.id;
                  const lastSess  = getLastSession(ex.id, total);
                  const open      = isOpen(ex);
                  const flipped   = !!flippedEx[ex.id];
                  const lastLogged = (lastSess || []).filter(s => s.lbs || s.reps);

                  return (
                    <div key={ex.id} style={{
                      background: allDone ? `${plan.color}18` : anyDone ? `${plan.color}09` : "#111120",
                      borderRadius:18,
                      border: isActive ? `2px solid ${plan.color}` : allDone ? `1px solid ${plan.color}44` : "1px solid #1a1a2e",
                      overflow:"hidden", transition:"all 0.25s",
                      animation:`fadeUp 0.3s ${i*0.06}s both`,
                    }}>

                      {/* Exercise header: tap to open / collapse */}
                      <div role="button" tabIndex={0} aria-expanded={open}
                        onClick={() => toggleOpen(ex)}
                        onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleOpen(ex); } }}
                        style={{display:"flex",alignItems:"center",gap:12,padding: open ? "12px 14px 8px" : "12px 14px",cursor:"pointer",transition:"padding 0.3s ease"}}>
                        <div style={{
                          width:34,height:34,borderRadius:10,flexShrink:0,
                          background: allDone ? plan.color : anyDone ? `${plan.color}33` : "rgba(255,255,255,0.06)",
                          display:"flex",alignItems:"center",justifyContent:"center",
                          fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:900,
                          color: allDone ? "#000" : plan.color, transition:"all 0.25s",
                        }}>
                          {allDone ? "✓" : anyDone ? `${doneCount}/${total}` : ""}
                        </div>
                        <div style={{flex:1}}>
                          <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:14,fontWeight:600,
                            color: allDone ? "rgba(255,255,255,0.4)":"#fff",
                            textDecoration: allDone?"line-through":"none",
                          }}>{ex.name}</div>
                          <div style={{display:"flex",gap:8,marginTop:2,flexWrap:"wrap"}}>
                            <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,color:plan.color,fontWeight:700}}>{ex.sets} sets · {ex.reps} reps</span>
                            <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,color:"#444466"}}>↺ {ex.rest}</span>
                          </div>
                        </div>
                        {isActive && <div style={{fontSize:15,animation:"streakBounce 0.8s ease-in-out infinite"}}>⏱️</div>}
                        {allDone && !isActive && <div style={{fontSize:17,animation:"pop 0.3s ease"}}>⚡</div>}
                        {/* collapsed: one dot per set, so progress reads at a glance */}
                        {!open && (
                          <div style={{display:"flex",gap:3}}>
                            {setsData.map((s, si) => <div key={si} style={{width:6,height:6,borderRadius:"50%",background: s.done ? plan.color : "rgba(255,255,255,0.12)"}}/>)}
                          </div>
                        )}
                        {open && (
                          <button aria-label={flipped ? "Show set log" : "Show plan and last session"}
                            onClick={e => { e.stopPropagation(); setFlippedEx(f => ({...f, [ex.id]: !flipped})); }}
                            style={{display:"flex",alignItems:"center",gap:4,padding:"5px 9px",borderRadius:9,cursor:"pointer",
                              border:`1px solid ${plan.color}44`, background: flipped ? `${plan.color}22` : "rgba(255,255,255,0.04)",
                              color: plan.color, fontFamily:"'Barlow Condensed',sans-serif", fontSize:12, fontWeight:800, letterSpacing:0.5}}>
                            <span style={{display:"inline-block",transition:"transform 0.6s ease",transform:`rotate(${flipped ? 180 : 0}deg)`}}>↻</span>
                            {flipped ? "LOG" : "PLAN"}
                          </button>
                        )}
                        <div style={{color:"#555577",fontSize:12,transition:"transform 0.35s ease",transform:`rotate(${open ? 180 : 0}deg)`}}>▾</div>
                      </div>

                      <FlipPanel open={open} flipped={flipped}
                        back={
                          <div style={{paddingBottom:12}}>
                            <PyramidSuggestion exercise={ex} numSets={total} lastSessionSets={lastSess} planColor={plan.color} alwaysOpen/>
                            <div style={{margin:"0 14px",padding:"8px 12px",background:"rgba(255,255,255,0.03)",borderRadius:10}}>
                              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:9,fontWeight:600,color:"#444466",textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}}>Last session</div>
                              {lastLogged.length ? (
                                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                                  {lastSess.map((s, si) => (s.lbs || s.reps) ? (
                                    <div key={si} style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:700,color:"#fff",background:"rgba(255,255,255,0.05)",borderRadius:8,padding:"4px 8px"}}>
                                      <span style={{color:"#555577"}}>S{si+1} </span>{s.lbs || "BW"}{s.reps ? ` × ${s.reps}` : ""}

                                <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"#444466"}}>Nothing logged yet for this exercise</div>
