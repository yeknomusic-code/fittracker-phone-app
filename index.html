  <!-- Live two-way sync with FitTracker Watch (shared with the watch app). -->
  <script>
/*
 * FTWLive — live two-way sync between FitTracker Watch and the Muscle Growth Tracker phone app.
 * Shared by both apps (plain ES5 so it runs on older Tizen watches too).
 *
 * Uses a Firebase Realtime Database over its REST API (no SDK):
 *   /sync/<pair code>/d/<YYYY-MM-DD>/<exerciseId>/<setIndex> = { l: lb|null, r: reps|null, d: done, t: ms, b: "w"|"p" }
 *   /sync/<pair code>/rest = { s: start ms, e: end ms, x: exerciseId, n: set just done, N: total sets,
 *                              b: "w"|"p", c: true if cancelled }
 *   /sync/<pair code>/stats/<date>/<w|hc> = daily activity from the watch (w) or Samsung Health (hc):
 *                              { s: steps, c: kcal, k: km, hr: latest bpm, hrMin: lowest bpm today, t: ms }
 *   /sync/<pair code>/wt/<date> = { lb: body weight, t: ms, b: "p" phone | "h" Samsung Health }
 *   /sync/<pair code>/hc = { t: last Samsung Health sync, n: workouts saved, err: message }
 * Changes stream in with Server-Sent Events; writes queue in an outbox while offline.
 * The pair code is a long random secret: the database rules only allow access under it.
 */
var FTWLive = (function () {
  'use strict';

  var CFG_KEY = 'ftwLiveCfg', OUT_KEY = 'ftwLiveOutbox', DAYS_BACK = 14;
  var cfg = load(CFG_KEY, null);
  var outbox = load(OUT_KEY, {});
  var h = {};                       // data handlers: onSet, onSync, onRest
  var statusFns = [];
  var status = 'off';
  var extras = [];                  // optional streams: stats, weight, Samsung Health status
  var esDays = null, esRest = null, flushing = false, flushT = null, restT = null, pendingRest;
  var fails = 0;
  var useQuery = true, gotData = false;   // date filter on the stream; dropped if the server refuses it

  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function setStatus(s) {
    if (s === status) return;
    status = s;
    for (var i = 0; i < statusFns.length; i++) { try { statusFns[i](s); } catch (e) {} }
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dayKey(ms) { var d = new Date(ms == null ? Date.now() : ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function base() { return cfg.url.replace(/\/+$/, '') + '/sync/' + cfg.code; }

  function newCode() {
    var chars = 'abcdefghijkmnpqrstuvwxyz23456789', out = '', bytes = [];
    try { bytes = Array.prototype.slice.call(window.crypto.getRandomValues(new Uint8Array(28))); } catch (e) {}
    for (var i = 0; i < 28; i++) out += chars.charAt((bytes[i] != null ? bytes[i] : Math.floor(Math.random() * 256)) % chars.length);
    return out;
  }

  /* ---------------- pairing ---------------- */
  // Watch: build the text for the pairing QR (creates the code the first time).
  function pairText(url) {
    if (!url) return null;
    if (!cfg || cfg.url !== url) { cfg = { url: url, code: (cfg && cfg.code) || newCode() }; save(CFG_KEY, cfg); connect(); }
    return 'FTWPAIR1|' + cfg.url + '|' + cfg.code;
  }
  // Phone: read a scanned pairing QR. Returns true if it was one.
  function pairFrom(text) {
    var m = /^FTWPAIR1\|(https?:\/\/[^|\s]+)\|([a-z0-9]{24,})$/.exec(text || '');
    if (!m) return false;
    cfg = { url: m[1], code: m[2] }; save(CFG_KEY, cfg);
    connect();
    return true;
  }
  function unpair() { cfg = null; save(CFG_KEY, null); outbox = {}; save(OUT_KEY, outbox); closeStreams(); setStatus('off'); }
  // Phone: create a new pairing here and hand the code to a watch that can't show one (Apple Watch).
  function createPair(url) {
    cfg = { url: String(url).replace(/\/+$/, ''), code: newCode() };
    save(CFG_KEY, cfg); outbox = {}; save(OUT_KEY, outbox);
    connect();
    return { url: cfg.url, code: cfg.code };
  }

  /* ---------------- streaming ---------------- */
  function closeStreams() {
    if (esDays) { esDays.close(); esDays = null; }
    if (esRest) { esRest.close(); esRest = null; }
    extras.forEach(function (es) { es.close(); }); extras = [];
  }

  // Stream a subtree and report each record `depth` levels down: depth 1 = /<date>, 2 = /<date>/<src>.
  // depth 0 reports the whole node.
  function openExtra(path, depth, cb, filtered) {
    var since = dayKey(Date.now() - DAYS_BACK * 864e5);
    var q = filtered && useQuery ? '?orderBy=' + encodeURIComponent('"$key"') + '&startAt=' + encodeURIComponent('"' + since + '"') : '';
    var es = new EventSource(base() + '/' + path + '.json' + q);
    function emit(segs, data) {
      if (segs.length === depth) { cb(segs, data); return; }
      if (segs.length > depth || !data || typeof data !== 'object') return;
      for (var k in data) if (Object.prototype.hasOwnProperty.call(data, k)) emit(segs.concat(String(k)), data[k]);
    }
    function on(type) {
      return function (ev) {
        var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (!m) return;
        var segs = (m.path || '/').split('/').filter(Boolean);
        if (depth === 0 || segs.length > depth) {      // partial change inside a record: re-read the record
          var rec = segs.slice(0, depth);
          xhr('GET', base() + '/' + path + (rec.length ? '/' + rec.join('/') : '') + '.json', undefined, function (ok, x) {
            if (ok) { try { cb(rec, JSON.parse(x.responseText)); } catch (e) {} }
          });
          return;
        }
        if (type === 'patch') { for (var k in m.data) emit(segs.concat(k.split('/').filter(Boolean)), m.data[k]); }
        else emit(segs, m.data);
      };
    }
    es.addEventListener('put', on('put'));
    es.addEventListener('patch', on('patch'));
    extras.push(es);
  }

  function walk(segs, data) {
    if (segs.length === 3) {
      if (h.onSet && data && typeof data === 'object') h.onSet(segs[0], segs[1], +segs[2], data);
      return;
    }
    if (segs.length > 3 || !data || typeof data !== 'object') return;
    for (var k in data) if (Object.prototype.hasOwnProperty.call(data, k) && data[k] != null) walk(segs.concat(String(k)), data[k]);
  }

  function onDays(type) {
    return function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (!m) return;
      var segs = (m.path || '/').split('/').filter(Boolean);
      if (type === 'patch') { for (var k in m.data) walk(segs.concat(k.split('/').filter(Boolean)), m.data[k]); }
      else walk(segs, m.data);
      fails = 0; gotData = true; setStatus('live');
      if (h.onSync) h.onSync();
    };
  }

  function onRestEv(ev) {
    var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (!m) return;
    if (m.path === '/') { if (h.onRest) h.onRest(m.data); return; }
    xhr('GET', base() + '/rest.json', undefined, function (ok, x) {   // partial update: fetch the whole record
      if (ok && h.onRest) { try { h.onRest(JSON.parse(x.responseText)); } catch (e) {} }
    });
  }

  function connect() {
    closeStreams();
    if (!cfg) { setStatus('off'); return; }
    if (typeof EventSource === 'undefined') { setStatus('error'); return; }
    setStatus('connecting');
    var since = dayKey(Date.now() - DAYS_BACK * 864e5);
    var q = useQuery ? '?orderBy=' + encodeURIComponent('"$key"') + '&startAt=' + encodeURIComponent('"' + since + '"') : '';
    esDays = new EventSource(base() + '/d.json' + q);
    esDays.addEventListener('put', onDays('put'));
    esDays.addEventListener('patch', onDays('patch'));
    esDays.addEventListener('cancel', function () { setStatus('error'); });
    var me = esDays;
    esDays.onerror = function () {
      if (me.readyState === 2 && useQuery && !gotData) { useQuery = false; if (esDays === me) connect(); return; }
      fails++;
      setStatus(navigator.onLine === false || fails > 1 ? 'offline' : 'connecting');
      // a refused connection closes the stream for good: reopen it ourselves, backing off
      if (me.readyState === 2 && esDays === me) setTimeout(function () { if (esDays === me) connect(); }, Math.min(30000, 2000 * fails));
    };
    esRest = new EventSource(base() + '/rest.json');
    esRest.addEventListener('put', onRestEv);
    esRest.addEventListener('patch', onRestEv);
    if (h.onStats) openExtra('stats', 2, function (segs, v) { if (v) h.onStats(segs[0], segs[1], v); }, true);
    if (h.onWeight) openExtra('wt', 1, function (segs, v) { if (v) h.onWeight(segs[0], v); }, true);
    if (h.onHealth) openExtra('hc', 0, function (segs, v) { h.onHealth(v); }, false);
    flush();
  }

  /* ---------------- writes ---------------- */
  function xhr(method, url, body, cb) {
    var x = new XMLHttpRequest();
    try {
      x.open(method, url, true);
      x.setRequestHeader('Content-Type', 'application/json');
      x.timeout = 12000;
      x.onload = function () { cb(x.status >= 200 && x.status < 300, x); };
      x.onerror = x.ontimeout = function () { cb(false, x); };
      x.send(body === undefined ? null : JSON.stringify(body));
    } catch (e) { cb(false, x); }
  }

  function scheduleFlush(ms) { clearTimeout(flushT); flushT = setTimeout(flush, ms); }

  function flush() {
    if (!cfg || flushing) return;
    var keys = Object.keys(outbox);
    if (!keys.length) return;
    flushing = true;
    var body = {}, sent = {};
    keys.forEach(function (k) { body[k] = outbox[k]; sent[k] = JSON.stringify(outbox[k]); });
    // one multi-path update for everything queued
    xhr('PATCH', base() + '.json', body, function (ok) {
      flushing = false;
      if (ok) {
        keys.forEach(function (k) { if (JSON.stringify(outbox[k]) === sent[k]) delete outbox[k]; });
        save(OUT_KEY, outbox);
        if (Object.keys(outbox).length) scheduleFlush(50);
      } else {
        setStatus('offline');
        scheduleFlush(5000);
      }
    });
  }

  function queue(path, v, ms) {
    if (!cfg) return;
    outbox[path] = v;
    save(OUT_KEY, outbox);
    scheduleFlush(ms);
  }
  function pushSet(date, exId, idx, set) { queue('d/' + date + '/' + exId + '/' + idx, set, 250); }
  function pushStats(date, src, v) { queue('stats/' + date + '/' + src, v, 1000); }
  function pushWeight(date, v) { queue('wt/' + date, v, 500); }

  // Rest timer state is short-lived: retry briefly, never queue it for later.
  function pushRest(r) {
    if (!cfg) return;
    pendingRest = r;
    clearTimeout(restT);
    (function send(tries) {
      xhr('PUT', base() + '/rest.json', pendingRest, function (ok) {
        if (ok || tries <= 0) return;
        var still = pendingRest && (pendingRest.c || pendingRest.e > Date.now());
        if (still) restT = setTimeout(function () { send(tries - 1); }, 2000);
      });
    }(3));
  }

  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('online', function () { if (cfg) { connect(); } });
  }

  return {
    start: function (handlers) { h = handlers || {}; connect(); },
    onStatus: function (fn) { statusFns.push(fn); fn(status); return function () { statusFns = statusFns.filter(function (f) { return f !== fn; }); }; },
    status: function () { return status; },
    isPaired: function () { return !!cfg; },
    pairText: pairText, pairFrom: pairFrom, unpair: unpair, createPair: createPair,
    pushSet: pushSet, pushRest: pushRest, pushStats: pushStats, pushWeight: pushWeight, flush: flush,
    config: function () { return cfg ? { url: cfg.url, code: cfg.code } : null; },
    pending: function () { return Object.keys(outbox).length; },
    dayKey: dayKey, DAYS_BACK: DAYS_BACK
  };
}());
  </script>

  <!-- Watch sync (FitTracker Watch → this app). Plain JS so it loads before React. -->
  <script>
/*
 * watch-sync.js — receive workouts from FitTracker Watch (Galaxy Watch, Tizen).
 * Include it with a script tag pointing at watch-sync.js (or paste it inline, as the app does).
 *
 *   WatchSync.scanQR(onSession)          open the camera, read the code(s) shown on the watch
 *   WatchSync.syncBluetooth(onSession)   pull every queued workout over Bluetooth (Chrome only)
 *
 * onSession(s) is called once per workout, with:
 *   { id, date, name, planDay, minutes, xp, avgHr, maxHr, totalSets, volume,
 *     exercises: [ { id, name, sets: [ { weight|null, reps } ] } ] }
 * Workouts already imported (same id) are skipped automatically.
 */
var WatchSync = (function () {
  'use strict';

  var SVC  = 'a7f30001-6b2c-4e8d-9f1a-3c5e7b9d0f21';
  var CTRL = 'a7f30002-6b2c-4e8d-9f1a-3c5e7b9d0f21';
  var DATA = 'a7f30003-6b2c-4e8d-9f1a-3c5e7b9d0f21';
  var JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
  var SEEN_KEY = 'watchSyncIds';

  /* ---------------- shared ---------------- */
  function seen() { try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || []; } catch (e) { return []; } }
  function markSeen(id) {
    var s = seen(); if (s.indexOf(id) === -1) s.push(id);
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(s.slice(-500))); } catch (e) {}
  }

  // names: optional { exerciseId: "Display Name" } so v2 sessions (ids only) read nicely
  var names = {};
  function setNames(map) { names = map || {}; }

  function unpack(o) {
    var vol = 0, total = 0;
    var exercises = (o.e || []).map(function (row) {
      var sets = row.slice(1).map(function (s) {
        var set = s.length === 2 ? { weight: s[0], reps: s[1] } : { weight: null, reps: s[0] };
        if (set.weight) vol += set.weight * set.reps;
        total++;
        return set;
      });
      var key = row[0];
      return { id: o.v >= 2 ? key : null, name: names[key] || key, sets: sets };
    });
    return { id: o.id, date: new Date(o.id), name: o.n, planDay: o.p != null ? o.p : null,
             minutes: o.m, xp: o.x, avgHr: o.h || null, maxHr: o.H || null,
             totalSets: total, volume: vol, exercises: exercises, handoff: !!o.ho };
  }

  // returns true if delivered, false if it was a duplicate
  function deliver(obj, onSession) {
    if (seen().indexOf(obj.id) !== -1) return false;
    markSeen(obj.id);
    onSession(unpack(obj));
    return true;
  }

  /* ---------------- QR ---------------- */
  var css = '' +
    '.ws-ov{position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"DM Sans",system-ui,sans-serif;color:#eee}' +
    '.ws-ov video{width:100%;max-width:480px;max-height:70vh;object-fit:cover}' +
    '.ws-box{position:absolute;width:62vmin;height:62vmin;max-width:300px;max-height:300px;border:3px solid #2ff3ff;border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}' +
    '.ws-msg{position:absolute;bottom:14vh;left:0;right:0;text-align:center;font-size:17px;padding:0 20px}' +
    '.ws-dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.ws-dots i{width:10px;height:10px;border-radius:50%;background:#333}.ws-dots i.on{background:#2ff3ff}' +
    '.ws-x{position:absolute;top:18px;right:18px;background:#222;color:#eee;border:0;border-radius:22px;padding:10px 18px;font-size:16px}' +
    '.ws-photo{display:none;flex-direction:column;align-items:center;gap:16px;padding:0 28px;text-align:center}' +
    '.ws-photo p{font-size:15px;color:#aaa;line-height:1.45;max-width:340px}.ws-photo b{color:#eee}' +
    '.ws-shoot{background:#2ff3ff;color:#111;border:0;border-radius:16px;padding:16px 28px;font:800 20px "Barlow Condensed",sans-serif;letter-spacing:1.5px}' +
    '.ws-ov.photo video,.ws-ov.photo .ws-box{display:none}.ws-ov.photo .ws-photo{display:flex}.ws-ov.photo .ws-msg{position:static;margin-top:18px}';

  function loadScript(src) {
    return new Promise(function (ok, fail) {
      var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail;
      document.head.appendChild(s);
    });
  }

  // opts.onPair(text): called with a watch pairing code (FTWPAIR1|…); return true to accept it
  function scanQR(onSession, opts) {
    opts = opts || {};
    return new Promise(function (resolve, reject) {
      var style = document.createElement('style'); style.textContent = css; document.head.appendChild(style);
      var ov = document.createElement('div'); ov.className = 'ws-ov';
      ov.innerHTML = '<video playsinline muted></video><div class="ws-box"></div>' +
        '<div class="ws-photo"><div style="font-size:44px">⌚📷</div>' +
          '<p class="ws-why"></p>' +
          '<button class="ws-shoot">TAKE PHOTO OF CODE</button>' +
          '<input class="ws-file" type="file" accept="image/*" capture="environment" hidden></div>' +
        '<div class="ws-msg"><div class="ws-t">' + (opts.title || 'Point at the code on your watch') + '</div><div class="ws-dots"></div></div>' +
        '<button class="ws-x">Cancel</button>';
      document.body.appendChild(ov);
      var video = ov.querySelector('video'), msg = ov.querySelector('.ws-t'), dots = ov.querySelector('.ws-dots');
      var stream = null, running = true, detector = null, canvas = document.createElement('canvas');
      var sessions = {};   // id -> { total, parts: [] }
      var photoMode = false;

      function close(result, err) {
        running = false;
        if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
        ov.remove(); style.remove();
        err ? reject(err) : resolve(result);
      }
      ov.querySelector('.ws-x').onclick = function () { close({ imported: 0, cancelled: true }); };

      function handle(text) {
        if (/^FTWPAIR1\|/.test(text || '')) {
          if (opts.onPair && opts.onPair(text)) {
            if (navigator.vibrate) navigator.vibrate([60, 60, 60]);
            close({ imported: 0, paired: true });
          } else msg.textContent = 'That pairing code didn\'t work. Show it again on the watch.';
          return;
        }
        var m = /^FTW1:([0-9a-z]+):(\d+)\/(\d+):([\s\S]*)$/.exec(text || '');
        if (!m) return;
        var id = m[1], i = +m[2], n = +m[3];
        var s = sessions[id] || (sessions[id] = { total: n, parts: [] });
        if (s.parts[i - 1] == null) { s.parts[i - 1] = m[4]; if (navigator.vibrate) navigator.vibrate(30); }
        var have = s.parts.filter(function (p) { return p != null; }).length;
        dots.innerHTML = new Array(n + 1).join('<i></i>');
        for (var k = 0; k < n; k++) if (s.parts[k] != null) dots.children[k].className = 'on';
        if (photoMode) {
          var missing = [];
          for (var q = 0; q < n; q++) if (s.parts[q] == null) missing.push(q + 1);
          msg.textContent = have < n ? 'Got ' + have + ' of ' + n + '. Now take a photo of code ' + missing.join(' / ') +
            ' (turn the bezel on the watch to show it)' : 'Got it';
        } else {
          msg.textContent = n > 1 ? 'Got ' + have + ' of ' + n + ' — keep holding steady' : 'Got it';
        }
        if (have === n) {
          try {
            var obj = JSON.parse(s.parts.join(''));
            var isNew = deliver(obj, onSession);
            if (navigator.vibrate) navigator.vibrate([60, 60, 60]);
            close({ imported: isNew ? 1 : 0, duplicate: !isNew });
          } catch (e) { s.parts = []; msg.textContent = 'Bad read, trying again…'; }
        }
      }

      function frame() {
        if (!running) return;
        if (video.readyState < 2) return requestAnimationFrame(frame);
        if (detector) {
          detector.detect(video).then(function (codes) {
            codes.forEach(function (c) { handle(c.rawValue); });
            if (running) setTimeout(frame, 120);
          }).catch(function () { if (running) setTimeout(frame, 200); });
        } else {
          var w = video.videoWidth, h = video.videoHeight, side = Math.min(w, h), scale = Math.min(1, 720 / side);
          canvas.width = canvas.height = Math.round(side * scale);
          var ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(video, (w - side) / 2, (h - side) / 2, side, side, 0, 0, canvas.width, canvas.height);
          var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var r = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });

// local calendar date (toISOString() is UTC, which rolled evening entries over to the next day)
const fmt = (d) => getDateKey(d.getFullYear(), d.getMonth(), d.getDate());
const todayKey = () => fmt(new Date());
const DOW = (dateStr) => new Date(dateStr + "T12:00:00").getDay();
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function getDateKey(year, month, day) {
  return `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
}

/* ─── STORAGE ────────────────────────────────────────────────────────────── */
function storageGet(key) {
  try { const v = localStorage.getItem(key); return Promise.resolve(v ? JSON.parse(v) : null); }
  catch { return Promise.resolve(null); }
}
function storageSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  return Promise.resolve();
}


/* ─── WATCH SYNC ─────────────────────────────────────────────────────────── */
// Workouts logged on the Galaxy Watch (FitTracker Watch) arrive by QR code or Bluetooth
// and are merged into logs[date].workouts exactly like sets logged here, so the pyramid,
// calendar, streak and completion rings all count them.

const PLAN_EX = {};
Object.values(WEEKLY_PLAN).forEach(p => p.exercises.forEach(e => { PLAN_EX[e.id] = e; }));
if (window.WatchSync) WatchSync.setNames(Object.fromEntries(Object.values(PLAN_EX).map(e => [e.id, e.name])));

// Watch timestamps use the phone's local date
const localKey = (ms) => { const d = new Date(ms); return getDateKey(d.getFullYear(), d.getMonth(), d.getDate()); };

function mergeWatchSession(logs, s) {
  const key = localKey(s.id);
  const day = {...(logs[key] || {})};
  day.workouts = {...(day.workouts || {})};
  let added = 0;
  s.exercises.forEach(ex => {
    if (!ex.id) return;
    const planEx = PLAN_EX[ex.id];
    const total = planEx ? (parseInt(planEx.sets) || 1) : ex.sets.length;
    const existing = day.workouts[ex.id + "_sets"] || [];
    const len = Math.max(total, ex.sets.length);
    const merged = Array.from({length: len}, (_, i) => {
      const o = existing[i];
      const old = !o ? null : (typeof o === "boolean" ? {done: o, lbs: "", reps: ""} : o);
      const w = ex.sets[i];
      if (old && old.done && (old.lbs || old.reps)) return old;      // phone entry wins
      if (!w) return old || {done: false, lbs: "", reps: ""};
      added++;
      return {done: true, lbs: w.weight == null ? "" : String(w.weight), reps: String(w.reps)};
    });
    day.workouts[ex.id + "_sets"] = merged;
    day.workouts[ex.id] = merged.slice(0, total).every(x => x.done);
  });
  const plan = WEEKLY_PLAN[DOW(key)];
  const onPlan = s.exercises.some(x => plan.exercises.some(e => e.id === x.id));
  const allDone = plan.exercises.length > 0 && plan.exercises.every(e => day.workouts[e.id]);
  return { logs: {...logs, [key]: day}, key, added, onPlan, allDone };
}

/* ─── LIVE WATCH LINK ────────────────────────────────────────────────────── */
// Two-way, real-time sync with FitTracker Watch through your Firebase database (FTWLive).
// Each set is stored per date/exercise/set with a timestamp; the newest edit wins.

const LIVE_META_KEY = "watchLiveMeta";      // last synced value + time for each set
const normCell = (s) => !s ? {done:false,lbs:"",reps:""} : typeof s === "boolean" ? {done:s,lbs:"",reps:""} : {done:!!s.done, lbs:s.lbs||"", reps:s.reps||""};
const cellHash = (c) => `${c.done?1:0}|${c.lbs}|${c.reps}`;
const cellEmpty = (c) => !c.done && !c.lbs && !c.reps;
const numOrNull = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };
const planColorFor = (exId) => { const p = Object.values(WEEKLY_PLAN).find(p => p.exercises.some(e => e.id === exId)); return p ? p.color : `${P.acc}`; };

function writeCell(logs, date, exId, idx, cell) {
  const day = {...(logs[date] || {})};
  day.workouts = {...(day.workouts || {})};
  const planEx = PLAN_EX[exId];
  const total = planEx ? (parseInt(planEx.sets) || 1) : idx + 1;
  const old = day.workouts[exId + "_sets"] || [];
  const arr = Array.from({length: Math.max(total, idx + 1, old.length)}, (_, i) => normCell(old[i]));
  arr[idx] = cell;
  day.workouts[exId + "_sets"] = arr;
  day.workouts[exId] = arr.slice(0, total).every(s => s.done);
  return {...logs, [date]: day};
}

function useWatchLive({ logs, setLogs, activeTimer, setActiveTimer }) {
  const logsRef = useRef(logs);
  const timerRef = useRef(activeTimer);
  const metaRef = useRef((() => { try { return JSON.parse(localStorage.getItem(LIVE_META_KEY)) || {}; } catch { return {}; } })());
  const queue = useRef([]);
  useEffect(() => { logsRef.current = logs; }, [logs]);
  useEffect(() => { timerRef.current = activeTimer; }, [activeTimer]);
  const saveMeta = () => { try { localStorage.setItem(LIVE_META_KEY, JSON.stringify(metaRef.current)); } catch {} };

  // phone → cloud: push every set that changed since it was last synced
  const pushDiff = useCallback(() => {
    if (!window.FTWLive || !FTWLive.isPaired()) return;
    const since = FTWLive.dayKey(Date.now() - FTWLive.DAYS_BACK * 864e5);
    let changed = false;
    Object.entries(logsRef.current).forEach(([date, day]) => {
      if (date < since || !day) return;
      // body weight (also goes to Samsung Health through the Health bridge app)
      const wv = day.weight === "" || day.weight == null ? null : Number(day.weight);
      if (wv != null && !isNaN(wv)) {
        const k = `wt/${date}`, h = String(wv), m = metaRef.current[k];
        if (!m || m.h !== h) {
          const t = Date.now();
          metaRef.current[k] = {h, t};
          FTWLive.pushWeight(date, {lb: wv, t, b: "p"});
          changed = true;
        }
      }
      if (!day.workouts) return;
      Object.entries(day.workouts).forEach(([key, arr]) => {
        if (!key.endsWith("_sets") || !Array.isArray(arr)) return;
        const exId = key.slice(0, -5);
        arr.forEach((s, i) => {
          const c = normCell(s), k = `${date}/${exId}/${i}`, h = cellHash(c), m = metaRef.current[k];
          if ((!m && cellEmpty(c)) || (m && m.h === h)) return;
          const t = Date.now();
          metaRef.current[k] = {h, t};
          FTWLive.pushSet(date, exId, i, {l: numOrNull(c.lbs), r: numOrNull(c.reps), d: c.done, t, b: "p"});
          changed = true;
        });
      });
    });
    if (changed) saveMeta();
  }, []);

  // cloud → phone: apply sets from the watch (newest wins; unsynced phone entries are kept)
  const applyRemote = useCallback(() => {
    const items = queue.current.splice(0);
    if (!items.length) return;
    let next = logsRef.current, changed = false;
    items.forEach(({date, exId, idx, cell}) => {
      const k = `${date}/${exId}/${idx}`, m = metaRef.current[k], t = cell.t || 0;
      if (m && m.t >= t) return;
      const local = normCell(((next[date] || {}).workouts || {})[exId + "_sets"]?.[idx]);
      if (!m && !cellEmpty(local)) return;            // phone has its own unsynced entry: it gets pushed instead
      const c = {done: !!cell.d, lbs: cell.l == null ? "" : String(cell.l), reps: cell.r == null ? "" : String(cell.r)};
      metaRef.current[k] = {h: cellHash(c), t};
      if (cellHash(c) === cellHash(local)) return;
      next = writeCell(next, date, exId, idx, c);
      changed = true;
    });
    saveMeta();
    if (changed) { logsRef.current = next; setLogs(next); storageSet("logs", next); }
  }, [setLogs]);

  // rest timer started / changed / cancelled on the watch
  // u = the device that made this change (older versions only send b, who started the rest)
  const onRemoteRest = useCallback((r) => {
    if (!r) return;
    const at = timerRef.current;
    if (r.c) { if (at && at.s === r.s) setActiveTimer(null); return; }
    if ((r.u || r.b) !== "w") return;                                // our own echo
    if (at && at.s === r.s) {                                        // the watch changed the running rest
      const next = r.e > Date.now() ? {...at, endsAt: r.e, total: Math.max(1, Math.round((r.e - r.s) / 1000))} : null;
      timerRef.current = next; setActiveTimer(next);
      return;
    }
    if (!(r.e > Date.now() + 1000)) return;
    const ex = PLAN_EX[r.x];
    if (!ex) return;
    const next = {exercise: ex, setNum: r.n, totalSets: r.N, color: planColorFor(r.x),
                  s: r.s, endsAt: r.e, total: Math.max(1, Math.round((r.e - r.s) / 1000)), remote: true};
    timerRef.current = next; setActiveTimer(next);
  }, [setActiveTimer]);

  // daily activity from the watch (w) and Samsung Health (hc)
  const [activity, setActivity] = useState(() => { try { return JSON.parse(localStorage.getItem("watchActivity")) || {}; } catch { return {}; } });
  const [health, setHealth] = useState(() => { try { return JSON.parse(localStorage.getItem("watchHealth")); } catch { return null; } });
  const onStats = useCallback((date, src, v) => {
    setActivity(prev => {
      const next = {...prev, [date]: {...(prev[date] || {}), [src]: v}};
      const keep = Object.keys(next).sort().slice(-14);
      const out = Object.fromEntries(keep.map(k => [k, next[k]]));
      try { localStorage.setItem("watchActivity", JSON.stringify(out)); } catch {}
      return out;
    });
  }, []);
  const onHealth = useCallback((v) => {
    setHealth(v);
    try { localStorage.setItem("watchHealth", JSON.stringify(v)); } catch {}
  }, []);
  // weight from Samsung Health (via the bridge app): newest wins, an unsynced phone entry is kept
  const onWeight = useCallback((date, v) => {
    const lb = Number(v.lb), t = v.t || 0;
    if (!(lb > 0)) return;
    const k = `wt/${date}`, m = metaRef.current[k];
    if (m && m.t >= t) return;
    const cur = (logsRef.current[date] || {}).weight;
    const hasLocal = cur !== "" && cur != null;
    if (!m && hasLocal && String(Number(cur)) !== String(lb)) return;
    metaRef.current[k] = {h: String(lb), t};
    saveMeta();
    if (hasLocal && Number(cur) === lb) return;
    const next = {...logsRef.current, [date]: {...(logsRef.current[date] || {}), weight: lb}};
    logsRef.current = next; setLogs(next); storageSet("logs", next);
  }, [setLogs]);

  useEffect(() => {
    if (!window.FTWLive) return;
    FTWLive.start({
      onSet: (date, exId, idx, cell) => queue.current.push({date, exId, idx, cell}),
      onSync: applyRemote,
      onRest: onRemoteRest,
      onStats, onWeight, onHealth,
    });
    let first = true;
    return FTWLive.onStatus(s => { if (s === "live" && first) { first = false; pushDiff(); } });
  }, []);

  useEffect(() => { const t = setTimeout(pushDiff, 400); return () => clearTimeout(t); }, [logs, pushDiff]);

  // rest timer started / cancelled on the phone
  const startTimer = useCallback((t) => {
    const s = Date.now(), total = parseRest(t.exercise.rest);
    const timer = {...t, s, endsAt: s + total * 1000, total};
    timerRef.current = timer; setActiveTimer(timer);
    if (window.FTWLive) FTWLive.pushRest({s, e: timer.endsAt, x: t.exercise.id, n: t.setNum, N: t.totalSets, b: "p", u: "p"});
  }, [setActiveTimer]);
  const cancelTimer = useCallback(() => {
    const at = timerRef.current;
    timerRef.current = null; setActiveTimer(null);
    if (at && window.FTWLive) FTWLive.pushRest({s: at.s, e: Date.now(), x: at.exercise.id, n: at.setNum, N: at.totalSets, b: at.remote ? "w" : "p", u: "p", c: true});
  }, [setActiveTimer]);
  // ±15s on the phone: same rest (same start), new end, so the watch shows it too
  const adjustTimer = useCallback((sec) => {
    const at = timerRef.current;
    if (!at) return;
    const e = at.endsAt + sec * 1000;
    if (e <= Date.now() + 1000) { cancelTimer(); return; }
    const next = {...at, endsAt: e, total: Math.max(1, Math.round((e - at.s) / 1000))};
    timerRef.current = next; setActiveTimer(next);
    if (window.FTWLive) FTWLive.pushRest({s: at.s, e, x: at.exercise.id, n: at.setNum, N: at.totalSets, b: at.remote ? "w" : "p", u: "p"});
  }, [setActiveTimer, cancelTimer]);

  return { startTimer, cancelTimer, adjustTimer, activity, health };
}

const agoText = (ms) => {
  if (!ms) return "never";
  const m = Math.round((Date.now() - ms) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
};

// Opens the FitTracker Health bridge app (Android) with this pairing, which syncs and returns here.
function openHealthBridge(onMissing) {
  const cfg = window.FTWLive && FTWLive.config();
  if (!cfg) return;
  const q = `u=${encodeURIComponent(cfg.url)}&c=${encodeURIComponent(cfg.code)}`;
  let left = false;
  const onHide = () => { if (document.hidden) left = true; };
  document.addEventListener("visibilitychange", onHide);
  setTimeout(() => { document.removeEventListener("visibilitychange", onHide); if (!left) onMissing(); }, 1800);
  location.href = `intent://sync?${q}#Intent;scheme=ftwbridge;end`;
}

// Your Firebase database URL, so Apple Watch setup works on a phone that has never been paired.

const FTW_DEFAULT_SYNC_URL = "";

const isAppleDevice = () => /iPhone|iPad|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function getWatchKind() {
  try { const k = localStorage.getItem("watchKind"); if (k === "apple" || k === "galaxy") return k; } catch {}
  return isAppleDevice() ? "apple" : "galaxy";
}
function saveWatchKind(k) {
  try { localStorage.setItem("watchKind", k); } catch {}
  window.dispatchEvent(new Event("watchkind"));
}
function useWatchKind() {
  const [kind, setKind] = useState(getWatchKind);
  useEffect(() => {
    const on = () => setKind(getWatchKind());
    window.addEventListener("watchkind", on);
    return () => window.removeEventListener("watchkind", on);
  }, []);
  return [kind, saveWatchKind];
}
const WATCH_NAME = { galaxy: "Galaxy Watch", apple: "Apple Watch" };
const cleanSyncUrl = (v) => {
  v = String(v || "").trim().replace(/\/+$/, "");
  return /^https:\/\/[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)$/i.test(v) ? v.toLowerCase() : null;
};

function WatchSyncCard({ logs, setLogs, onCelebrate, health }) {
  const [kind] = useWatchKind();
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const [last, setLast] = useState(() => { try { return localStorage.getItem("watchLastSync"); } catch { return null; } });
  const logsRef = useRef(logs);
  useEffect(() => { logsRef.current = logs; }, [logs]);
  const live = LiveStatus();
  const paired = !!(window.FTWLive && FTWLive.isPaired()) || live !== "off";
  const results = useRef([]);

  // called once per workout; saves immediately so nothing is lost mid-sync
  const onSession = (s) => {
    const r = mergeWatchSession(logsRef.current, s);
    logsRef.current = r.logs;
    setLogs(r.logs);
    storageSet("logs", r.logs);
    results.current.push({...r, name: s.name, handoff: s.handoff});
  };

  const finish = () => {
    const rs = results.current; results.current = [];
    const now = new Date().toISOString();
    try { localStorage.setItem("watchLastSync", now); } catch {}
    setLast(now);
    if (!rs.length) return;
    const d = (k) => { const x = new Date(k + "T12:00:00"); return `${DAY_NAMES[x.getDay()]} ${MONTH_NAMES[x.getMonth()]} ${x.getDate()}`; };
    const sets = rs.reduce((a, r) => a + r.added, 0);
    // a mid-workout hand-off from the watch (battery dying): carry on from the Log tab
    if (rs.some(r => r.handoff)) {
      const h = rs.find(r => r.handoff);
      setStatus(`${h.name}: ${sets ? `${sets} new set${sets === 1 ? "" : "s"} from your watch` : "already up to date"}. Finish the rest in the Log tab.`);
      onCelebrate({ emoji: "🔋", title: "HANDED OFF!", msg: h.allDone ? "Workout complete. Every set made it off your watch." : "Your watch sets are safe. Pick up where you left off." });
      return;
    }
    setStatus(rs.length === 1
      ? `${rs[0].name} → ${d(rs[0].key)} · ${sets} sets` + (rs[0].onPlan ? "" : " (not that day's plan, still counts for your pyramid)")
      : `${rs.length} workouts · ${sets} sets imported`);
    onCelebrate({ emoji: "⌚", title: "WATCH SYNCED!",
      msg: rs.some(r => r.allDone) ? "Workout complete. Every set logged from your wrist." : `${sets} sets added to your log.` });
  };

  const pair = async () => {
    setBusy(true); setStatus("");
    try {
      const r = await WatchSync.scanQR(onSession, {
        title: "Point at the pairing code on your watch",
        onPair: (text) => FTWLive.pairFrom(text),
      });
      if (r.paired) setStatus("Paired! Sets and rest timers now sync both ways.");
      else if (!r.cancelled) finish();
    } catch (e) { setStatus(e.message || "Camera error"); }
    setBusy(false);
  };
  const unpair = () => {
    if (!confirm("Unlink the watch? Your logged workouts stay on both devices.")) return;
    FTWLive.unpair(); setStatus("Watch unlinked.");
  };
  const connectHealth = () => {
    setStatus("");
    openHealthBridge(() => setStatus("Couldn't open the FitTracker Health app. Install it on this phone first (see README), then tap again."));
  };
  const hcLine = !health ? "Not connected" : health.err ? `Problem: ${health.err}` :
    `Synced ${agoText(health.t)}${health.n ? ` · ${health.n} workout${health.n === 1 ? "" : "s"} saved` : ""}`;

  const LIVE_TXT = {
    live:       [`${P.good}`, "Live", "Sets and rest timers sync instantly"],
    connecting: [`${P.acc}`, "Connecting", "Reaching your sync database…"],
    offline:    [`${P.bad}`, "Offline", "Changes will sync when you're back online"],
    error:      [`${P.bad}`, "Error", "Can't reach the sync database. Check its rules (see README)."],
  };

  const btn = (primary) => ({
    flex: 1, padding: "12px 8px", borderRadius: 16, cursor: busy ? "default" : "pointer",
    border: primary ? "none" : `1px solid rgba(${P.ink},0.22)`, background: primary ? `${P.acc}` : `rgba(${P.ink},0.13)`,
    color: primary ? `${P.onAcc}` : `${P.text}`, opacity: busy ? 0.5 : 1,
    fontFamily: "'Barlow Condensed',sans-serif", fontSize: 16, fontWeight: 800, letterSpacing: 1,
  });
  const ago = last ? (() => {
    const m = Math.round((Date.now() - new Date(last)) / 60000);
    return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
  })() : "never";

  const lt = LIVE_TXT[live];
  return (
    <div style={{background: `${P.card}`, borderRadius: 28, padding: "16px 18px", border: `1px solid rgba(${P.ink},0.16)`}}>
      <div style={{fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: `${P.sub}`, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 10}}>{kind === "apple" ? "" : "⌚ "}{WATCH_NAME[kind]}</div>

      {paired && lt ? (
        <div style={{display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8}}>
          <div style={{display: "flex", alignItems: "center", gap: 6}}>
            <div style={{width: 8, height: 8, borderRadius: "50%", background: lt[0], boxShadow: `0 0 6px ${lt[0]}`, animation: live === "live" ? "pulseGlow 2s ease-in-out infinite" : "none"}}/>
            <span style={{fontFamily: "'Barlow Condensed',sans-serif", fontSize: 16, fontWeight: 800, letterSpacing: 1, color: lt[0], textTransform: "uppercase"}}>{lt[1]}</span>
          </div>
          <button onClick={unpair} style={{background: "none", border: "none", color: `${P.muted}`, fontFamily: "'DM Sans',sans-serif", fontSize: 11, cursor: "pointer"}}>Unlink</button>
        </div>
      ) : kind === "galaxy" ? (
        <button disabled={busy} onClick={pair} style={{...btn(true), width: "100%"}}>🔗 PAIR</button>
      ) : (
        <div style={{fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: `${P.sub}`}}>Not linked</div>
      )}
      {status && <div style={{fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: `${P.acc}`, marginTop: 10, lineHeight: 1.4}}>{status}</div>}
    </div>
  );
}

// Barcodes are drawn here (no internet needed), except QR which loads a small
// library once when you save a QR card; the drawn code is stored with the card.
const BARCODE = (() => {
  const C128 = "212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112".split(" ");
  const widths = w => { let s = "", bar = true; for (const ch of w) { s += (bar ? "1" : "0").repeat(+ch); bar = !bar; } return s; };
  function code128(text) {
    if (!/^[\x20-\x7e]+$/.test(text)) throw new Error("Code 128 here takes letters, numbers and symbols only.");
    const vals = []; const digits = /^\d+$/.test(text);
    if (digits && text.length >= 4) {
      vals.push(105);                                  // Start C
      const even = text.length - (text.length % 2);
      for (let i = 0; i < even; i += 2) vals.push(+text.slice(i, i + 2));
      if (text.length % 2) { vals.push(100); vals.push(text.charCodeAt(text.length - 1) - 32); }  // Code B for the last digit
    } else {
      vals.push(104);                                  // Start B
      for (const ch of text) vals.push(ch.charCodeAt(0) - 32);
    }
    let sum = vals[0]; for (let i = 1; i < vals.length; i++) sum += vals[i] * i;
    vals.push(sum % 103); vals.push(106);
    return vals.map(v => widths(C128[v])).join("");
  }
  const C39 = {"0":"101001101101","1":"110100101011","2":"101100101011","3":"110110010101","4":"101001101011","5":"110100110101","6":"101100110101","7":"101001011011","8":"110100101101","9":"101100101101","A":"110101001011","B":"101101001011","C":"110110100101","D":"101011001011","E":"110101100101","F":"101101100101","G":"101010011011","H":"110101001101","I":"101101001101","J":"101011001101","K":"110101010011","L":"101101010011","M":"110110101001","N":"101011010011","O":"110101101001","P":"101101101001","Q":"101010110011","R":"110101011001","S":"101101011001","T":"101011011001","U":"110010101011","V":"100110101011","W":"110011010101","X":"100101101011","Y":"110010110101","Z":"100110110101","-":"100101011011",".":"110010101101"," ":"100110101101","$":"100100100101","/":"100100101001","+":"100101001001","%":"101001001001","*":"100101101101"};
  function code39(text) {
    const t = text.toUpperCase();
    for (const ch of t) if (!C39[ch] || ch === "*") throw new Error("Code 39 takes A–Z, 0–9 and - . $ / + % only.");
    return ["*", ...t, "*"].map(ch => C39[ch]).join("0");
  }
  const CODA = {"0":"101010011","1":"101011001","2":"101001011","3":"110010101","4":"101101001","5":"110101001","6":"100101011","7":"100101101","8":"100110101","9":"110100101","-":"101001101","$":"101100101",":":"1101011011","/":"1101101011",".":"1101101101","+":"1011011011","A":"1011001001","B":"1001001011","C":"1010010011","D":"1010011001"};
  function codabar(text) {
    let t = text.toUpperCase();
    if (!/^[A-D]/.test(t)) t = "A" + t;
    if (!/[A-D]$/.test(t)) t = t + "A";
    if (!/^[A-D][0-9\-$:/.+]*[A-D]$/.test(t)) throw new Error("Codabar takes 0–9 and - $ : / . + only.");
    return [...t].map(ch => CODA[ch]).join("0");
  }
  const L = ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
  const R = L.map(p => [...p].map(b => b === "1" ? "0" : "1").join(""));
  const G = R.map(p => [...p].reverse().join(""));
  const PAR = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
  const eanCheck = d12 => { let s = 0; for (let i = 0; i < 12; i++) s += +d12[i] * (i % 2 ? 3 : 1); return String((10 - s % 10) % 10); };
  function ean13(text) {
    let d = text.replace(/\s/g, "");
    if (!/^\d{12,13}$/.test(d)) throw new Error("EAN-13 needs 12 or 13 digits.");
    if (d.length === 12) d += eanCheck(d);
    else if (eanCheck(d.slice(0, 12)) !== d[12]) throw new Error("The last digit doesn't match (check digit). Re-check the number.");
    const par = PAR[+d[0]];
    let s = "101";
    for (let i = 1; i <= 6; i++) s += (par[i - 1] === "L" ? L : G)[+d[i]];
    s += "01010";
    for (let i = 7; i <= 12; i++) s += R[+d[i]];
    return s + "101";
  }
  function upca(text) {
    const d = text.replace(/\s/g, "");
    if (!/^\d{11,12}$/.test(d)) throw new Error("UPC-A needs 11 or 12 digits.");
    return ean13("0" + d);
  }
  const QR_URL = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";
  function loadQR() {
    if (window.qrcode) return Promise.resolve();
    return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = QR_URL; s.onload = ok; s.onerror = () => fail(new Error("Couldn't load the QR maker. Connect to the internet once and try again.")); document.head.appendChild(s); });
  }
  function linearSVG(bits) {
    const q = 10, w = bits.length + q * 2; let rects = "", i = 0;
    while (i < bits.length) { if (bits[i] === "1") { let j = i; while (bits[j] === "1") j++; rects += `<rect x="${i + q}" y="0" width="${j - i}" height="60"/>`; i = j; } else i++; }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} 60" preserveAspectRatio="none" shape-rendering="crispEdges"><rect width="${w}" height="60" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
  }
  function qrSVG(text) {
    const qr = window.qrcode(0, "M"); qr.addData(text); qr.make();
    const n = qr.getModuleCount(), q = 4, w = n + q * 2; let p = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) p += `M${c + q} ${r + q}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${w}" shape-rendering="crispEdges"><rect width="${w}" height="${w}" fill="#fff"/><path d="${p}" fill="#000"/></svg>`;
  }
  const FORMATS = [
    {id:"code128", name:"Code 128"}, {id:"code39", name:"Code 39"}, {id:"codabar", name:"Codabar"},
    {id:"ean13", name:"EAN-13"}, {id:"upca", name:"UPC-A"}, {id:"qr", name:"QR code"},
  ];
  const ENC = {code128, code39, codabar, ean13, upca};
  // Returns a Promise of an SVG string (throws a readable Error if the number doesn't fit the format)
  function render(format, value) {
    const v = (value || "").trim();
    if (!v) return Promise.reject(new Error("Enter your member number first."));
    if (format === "qr") return loadQR().then(() => qrSVG(v));
    try { return Promise.resolve(linearSVG(ENC[format](v))); } catch (e) { return Promise.reject(e); }
  }
  // camera formats (BarcodeDetector names) → ours
  const FROM_DETECTOR = {code_128:"code128", code_39:"code39", codabar:"codabar", ean_13:"ean13", upc_a:"upca", qr_code:"qr"};
  return { render, FORMATS, FROM_DETECTOR };
})();

// Reads barcodes from the camera or a picture. Uses the phone's built-in reader when it has
// one (Chrome on Android); otherwise loads ZXing, a free open-source reader (iPhone, others).
const GYM_READER = (() => {
  const ZX_URL = "https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.4/dist/iife/reader/index.js";
  const WANT = ["code_128", "code_39", "codabar", "ean_13", "upc_a", "qr_code", "ean_8", "itf"];
  let enginePromise = null;

  function loadZX() {
    const ready = () => window.ZXingWASM.prepareZXingModule({fireImmediately: true});
    if (window.ZXingWASM) return ready();
    return new Promise((ok, fail) => {
      const s = document.createElement("script"); s.src = ZX_URL; s.onload = ok;
      s.onerror = () => fail(new Error("Couldn't load the barcode reader. Check your internet connection."));
      document.head.appendChild(s);
    }).then(ready).catch(() => { throw new Error("Couldn't load the barcode reader. Check your internet connection."); });
  }
  // ZXing names → ours (Code128, Code39Std, EAN13, UPCA, QRCode…)
  function zxFormat(name) {
    const n = String(name || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    if (n === "code128") return "code128";
    if (n.startsWith("code39")) return "code39";
    if (n === "codabar") return "codabar";
    if (n === "ean13") return "ean13";
    if (n === "upca") return "upca";
    if (n.startsWith("qrcode")) return "qr";
    return null;
  }
  function zxEngine() {
    return {
      kind: "zxing",
      read(canvas) {
        const img = canvas.getContext("2d", {willReadFrequently: true}).getImageData(0, 0, canvas.width, canvas.height);
        return window.ZXingWASM.readBarcodes(img, {tryHarder: true, maxNumberOfSymbols: 1})
          .then(rs => { const r = rs.find(x => x.isValid && x.text); return r ? {text: r.text, format: zxFormat(r.format)} : null; })
          .catch(() => null);
      },
    };
  }
  // Promise of {kind, read(canvas) → Promise<{text, format}|null>}
  function engine() {
    if (enginePromise) return enginePromise;
    enginePromise = Promise.resolve().then(() => {
      const BD = window.BarcodeDetector;
      if (!BD || typeof BD.getSupportedFormats !== "function") return null;
      return BD.getSupportedFormats().then(sup => {
        if (!sup.includes("code_128")) return null;
        const det = new BD({formats: WANT.filter(f => sup.includes(f))});
        return {kind: "builtin", read: canvas => det.detect(canvas).then(c => c.length ? {text: c[0].rawValue, format: BARCODE.FROM_DETECTOR[c[0].format] || null} : null, () => null)};
      });
    }).catch(() => null).then(e => e || loadZX().then(zxEngine));
    enginePromise.catch(() => { enginePromise = null; });   // allow a retry after a failed download
    return enginePromise;
  }
  // Draw a source (video or image) to a canvas, optionally rotated 90° (for barcodes held sideways).
  // rotate: false/true (90°) or a number of degrees for small tilts
  function toCanvas(src, w, h, rotate, max = 1280) {
    const sc = Math.min(1, max / Math.max(w, h)), cw = Math.round(w * sc), ch = Math.round(h * sc);
    const deg = rotate === true ? 90 : (rotate || 0), rad = deg * Math.PI / 180;
    const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
    const c = document.createElement("canvas");
    c.width = Math.round(cw * cos + ch * sin); c.height = Math.round(cw * sin + ch * cos);
    const ctx = c.getContext("2d", {willReadFrequently: true});
    if (deg) { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); }
    ctx.translate(c.width / 2, c.height / 2); ctx.rotate(rad);
    ctx.drawImage(src, -cw / 2, -ch / 2, cw, ch);
    return c;
  }
  // A photo or screenshot: try upright, then sideways.
  function readFile(file) {
    return engine().then(eng => new Promise((ok, fail) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = async () => {
        URL.revokeObjectURL(url);
        // upright and sideways first; then smaller sizes (sharper for blurry photos) and small tilts
        const tries = [[0, 1600], [90, 1600], [0, 900], [90, 900], [0, 560], [90, 560],
                       [-4, 900], [4, 900], [-8, 900], [8, 900], [86, 900], [94, 900], [82, 900], [98, 900]];
        for (const [rot, size] of tries) {
          const r = await eng.read(toCanvas(img, img.naturalWidth, img.naturalHeight, rot, size));
          if (r) return ok(r);
        }
        ok(null);
      };
      img.onerror = () => { URL.revokeObjectURL(url); fail(new Error("Couldn't open that picture.")); };
      img.src = url;
    }));
  }
  return {engine, toCanvas, readFile};
})();

// Live camera scan. Falls back to picking a photo if the camera can't start.
function GymScanner({onResult, onClose, onPhoto}) {
  const videoRef = useRef(null);
  const [msg, setMsg] = useState("Starting camera…");
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    let stream = null, alive = true;
    const fail = text => { if (alive) { setMsg(text); setFailed(true); } };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { fail("The camera isn't available here. Choose a photo or screenshot of your barcode instead."); return; }
    GYM_READER.engine().then(eng =>
      navigator.mediaDevices.getUserMedia({video: {facingMode: "environment", width: {ideal: 1280}, height: {ideal: 720}}, audio: false}).then(s => {
        stream = s; if (!alive) return s.getTracks().forEach(t => t.stop());
        const v = videoRef.current; v.srcObject = s;
        return v.play().then(() => {
          setMsg("Point at the barcode on your card or key tag");
          const tick = () => {
            if (!alive) return;
            if (v.readyState < 2 || !v.videoWidth) return setTimeout(tick, 150);
            eng.read(GYM_READER.toCanvas(v, v.videoWidth, v.videoHeight, 0, 960)).then(r => {
              if (!alive) return;
              if (r && r.text) { if (navigator.vibrate) navigator.vibrate(60); onResult(r.text, r.format); }
              else setTimeout(tick, eng.kind === "zxing" ? 60 : 150);
            });
          };
          tick();
        });
      })
    ).catch(e => fail(e && e.name === "NotAllowedError"
      ? "Camera permission is off for this site. Allow Camera in your browser settings, or choose a photo of your barcode."
      : (e && e.message && /reader/.test(e.message) ? e.message : "The camera couldn't start. Choose a photo or screenshot of your barcode instead.")));
    return () => { alive = false; if (stream) stream.getTracks().forEach(t => t.stop()); };
  }, []);
  return (
    <div role="dialog" aria-modal="true" aria-label="Scan barcode" style={{position:"fixed", inset:0, zIndex:1000, background:"#000", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center"}}>
      <div style={{position:"relative", width:"100%", maxWidth:480, display: failed ? "none" : "block"}}>
        <video ref={videoRef} playsInline muted style={{width:"100%", maxHeight:"60vh", objectFit:"cover", display:"block"}}/>

function shrinkImage(file) {
  return new Promise((ok, fail) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 256, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL("image/png"));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error("Couldn't open that image.")); };
    img.src = url;
  });
}

function GymEditor({card, isNew, onSave, onDelete, onClose}) {
  const [name, setName] = useState(card.name || "");
  const [code, setCode] = useState(card.code || "");
  const [format, setFormat] = useState(card.format || "code128");
  const [logo, setLogo] = useState(card.logo || null);
  const [svg, setSvg] = useState(null);
  const [err, setErr] = useState("");
  const [note, setNote] = useState("");
  const [scanning, setScanning] = useState(false);
  const fileRef = useRef(null);

  useEffect(() => {
    let live = true;
    if (!code.trim()) { setSvg(null); setErr(""); return; }
    BARCODE.render(format, code).then(s => { if (live) { setSvg(s); setErr(""); } }, e => { if (live) { setSvg(null); setErr(e.message); } });
    return () => { live = false; };
  }, [code, format]);

  const onScan = (value, f) => {
    setScanning(false); setCode(value);
    if (f) { setFormat(f); setNote(""); }
    else { setFormat("code128"); setNote("Your card uses a barcode type the app can't redraw, so it'll show as Code 128. Test it at the front desk; if it doesn't scan, try another type."); }
  };
  const photoRef = useRef(null);
  const [reading, setReading] = useState(false);
  const pickPhoto = async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    setScanning(false); setReading(true); setErr(""); setNote("");
    try {
      const r = await GYM_READER.readFile(f);
      if (r) onScan(r.text, r.format, true);
      else setErr("Couldn't find a barcode in that picture. Crop or zoom so the barcode fills most of it, and try again.");
    } catch (x) { setErr(x.message); }
    setReading(false);
  };
  const pickLogo = async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    try { setLogo(await shrinkImage(f)); } catch (x) { setErr(x.message); }
  };
  const save = () => {
    if (!name.trim()) { setErr("Give this gym a name."); return; }
    if (code.trim() && !svg) return;   // error already shown
    onSave({...card, name: name.trim(), mono: card.mono && name.trim() === card.name ? card.mono : monogram(name), code: code.trim(), format, logo, svg: code.trim() ? svg : null});
  };
  const field = {width:"100%", padding:"12px 14px", background:P.inset, border:`1px solid rgba(${P.ink},0.22)`, color:P.text,
    fontFamily:"'DM Sans',sans-serif", fontSize:16, outline:"none"};
  const label = {fontFamily:"'DM Sans',sans-serif", fontSize:12, fontWeight:600, color:P.muted, margin:"14px 0 6px"};
  const preview = {...card, name: name || "Gym", mono: monogram(name), logo};

  return ReactDOM.createPortal(
    <div role="dialog" aria-modal="true" aria-label={isNew ? "Add gym" : `Edit ${card.name}`}
      style={{position:"fixed", inset:0, zIndex:900, background:"rgba(0,0,0,0.6)", display:"flex", alignItems:"flex-end", justifyContent:"center"}} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{width:"100%", maxWidth:480, maxHeight:"92vh", overflowY:"auto", background:P.bg, backgroundImage:P.layers,
        borderRadius:"32px 32px 0 0", padding:"20px 18px calc(24px + env(safe-area-inset-bottom))", border:`1px solid rgba(${P.ink},0.16)`, color:P.text}}>
        <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:6}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif", fontSize:24, fontWeight:800}}>{isNew ? "Add gym" : "Edit gym"}</div>
          <button onClick={onClose} aria-label="Close" style={{background:`rgba(${P.ink},0.1)`, border:"none", color:P.text, width:36, height:36, cursor:"pointer", fontSize:16}}>✕</button>
        </div>

        <div style={label}>Gym name</div>
        <input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. UFC Gym" style={field}/>

        <div style={label}>Logo</div>
        <div style={{display:"flex", alignItems:"center", gap:12}}>
          <GymLogo card={preview} size={52}/>
          <button onClick={() => fileRef.current.click()} style={{padding:"10px 16px", background:`rgba(${P.ink},0.1)`, border:`1px solid rgba(${P.ink},0.2)`, color:P.text, fontFamily:"'DM Sans',sans-serif", fontSize:13, fontWeight:600, cursor:"pointer"}}>{logo ? "Change logo" : "Add logo"}</button>
          {logo && <button onClick={() => setLogo(null)} style={{padding:"10px 14px", background:"transparent", border:"none", color:P.muted, fontFamily:"'DM Sans',sans-serif", fontSize:13, cursor:"pointer"}}>Remove</button>}
          <input ref={fileRef} type="file" accept="image/*" hidden onChange={pickLogo}/>
        </div>
        <div style={{fontFamily:"'DM Sans',sans-serif", fontSize:11, color:P.faint, marginTop:6}}>Use a photo or screenshot of your card or the gym's logo.</div>

        <div style={label}>Member number</div>
        <div style={{display:"flex", gap:8}}>
          <input value={code} onChange={e => { setCode(e.target.value); setNote(""); }} placeholder="Number under the barcode" inputMode="text" autoComplete="off" style={{...field, flex:1, letterSpacing:1}}/>
          <button onClick={() => setScanning(true)} style={{padding:"0 16px", background:P.acc, border:"none", color:P.onAcc, fontFamily:"'DM Sans',sans-serif", fontSize:13, fontWeight:700, cursor:"pointer", whiteSpace:"nowrap"}}>Scan</button>
        </div>

        <div style={label}>Barcode type</div>

          {BARCODE.FORMATS.map(f => (
            <button key={f.id} role="radio" aria-checked={format === f.id} onClick={() => { setFormat(f.id); setNote(""); }}
              style={{padding:"7px 12px", cursor:"pointer", fontFamily:"'DM Sans',sans-serif", fontSize:12, fontWeight:600,
                background: format === f.id ? P.acc : `rgba(${P.ink},0.08)`, color: format === f.id ? P.onAcc : P.sub,
                border: format === f.id ? "none" : `1px solid rgba(${P.ink},0.16)`}}>{f.name}</button>
          ))}
        </div>
        <div style={{fontFamily:"'DM Sans',sans-serif", fontSize:11, color:P.faint, marginTop:6}}>Scanning picks this for you. Typed it in? Most gym tags are Code 128 or Code 39.</div>

        {svg && (
          <div style={{background:"#fff", borderRadius:20, padding:12, marginTop:14, height: format === "qr" ? 180 : 110, display:"flex", justifyContent:"center"}}
            dangerouslySetInnerHTML={{__html: svg.replace("<svg ", '<svg width="100%" height="100%" ')}}/>
        )}
        {note && <div style={{fontFamily:"'DM Sans',sans-serif", fontSize:12, color:P.accSoft, marginTop:10, lineHeight:1.4}}>{note}</div>}
        {err && <div role="alert" style={{fontFamily:"'DM Sans',sans-serif", fontSize:13, color:P.bad, marginTop:10}}>{err}</div>}

        <div style={{display:"flex", gap:8, marginTop:18}}>
          {!isNew && <button onClick={() => { if (confirm(`Remove ${card.name}?`)) onDelete(card.id); }} style={{padding:"13px 16px", background:"transparent", border:`1px solid rgba(${P.badRgb},0.45)`, color:P.bad, fontFamily:"'DM Sans',sans-serif", fontSize:14, fontWeight:600, cursor:"pointer"}}>Remove</button>}
          <button onClick={save} style={{flex:1, padding:"13px", background:P.acc, border:"none", color:P.onAcc, fontFamily:"'DM Sans',sans-serif", fontSize:15, fontWeight:700, cursor:"pointer"}}>Save gym</button>
        </div>
      </div>
      {scanning && <GymScanner onResult={onScan} onClose={() => setScanning(false)} onPhoto={() => photoRef.current.click()}/>}
    </div>

  , document.body);
}

  const results = useRef([]);

  const onSession = (s) => {
    const r = mergeWatchSession(logsRef.current, s);
    logsRef.current = r.logs;
    setLogs(r.logs);
    storageSet("logs", r.logs);
    results.current.push({...r, name: s.name, handoff: s.handoff});
  };

  const finish = () => {
    const rs = results.current; results.current = [];
    if (!rs.length) return;
    const d = (k) => { const x = new Date(k + "T12:00:00"); return `${DAY_NAMES[x.getDay()]} ${MONTH_NAMES[x.getMonth()]} ${x.getDate()}`; };
    const sets = rs.reduce((a, r) => a + r.added, 0);
    if (rs.some(r => r.handoff)) {
      const h = rs.find(r => r.handoff);
      setStatus(`${h.name}: ${sets ? `${sets} new set${sets === 1 ? "" : "s"} from your watch` : "already up to date"}. Finish the rest in the Log tab.`);
      onCelebrate && onCelebrate({ emoji: "🔋", title: "HANDED OFF!", msg: h.allDone ? "Workout complete. Every set made it off your watch." : "Your watch sets are safe. Pick up where you left off." });
      return;
    }
    setStatus(rs.length === 1
      ? `${rs[0].name} → ${d(rs[0].key)} · ${sets} sets` + (rs[0].onPlan ? "" : " (not that day's plan, still counts for your pyramid)")
      : `${rs.length} workouts · ${sets} sets imported`);
    onCelebrate && onCelebrate({ emoji: "⌚", title: "WATCH SYNCED!",
      msg: rs.some(r => r.allDone) ? "Workout complete. Every set logged from your wrist." : `${sets} sets added to your log.` });
  };

  const scan = async () => {
    setBusy(true); setStatus("");
    try {
      const r = await WatchSync.scanQR(onSession);
      if (r.duplicate) setStatus("Already imported that workout");
      else if (!r.cancelled) finish();
    } catch (e) { setStatus(e.message || "Camera error"); }
    setBusy(false);
  };

  const bluetooth = async () => {
    setBusy(true); setStatus("");
    try {
      const r = await WatchSync.syncBluetooth(onSession, setStatus);
      if (r.imported) finish(); else { setStatus("Up to date: nothing new on the watch"); finish(); }
    } catch (e) { setStatus(e.message || "Bluetooth error"); }
    setBusy(false);
  };

  const btn = (primary) => ({
    flex: 1, padding: "12px 8px", borderRadius: 16, cursor: busy ? "default" : "pointer",
    border: primary ? "none" : `1px solid rgba(${P.ink},0.22)`, background: primary ? `${P.acc}` : `rgba(${P.ink},0.13)`,
    color: primary ? `${P.onAcc}` : `${P.text}`, opacity: busy ? 0.5 : 1,
    fontFamily: "'Barlow Condensed',sans-serif", fontSize: 16, fontWeight: 800, letterSpacing: 1,
  });

  if (kind !== "galaxy") return null;    // QR / Bluetooth import only exists on the Galaxy watch app
  return (
    <div style={{background: `${P.card}`, borderRadius: 28, padding: "16px 18px", border: `1px solid rgba(${P.ink},0.16)`}}>
      <div style={{fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: `${P.sub}`, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5}}>⌚ Galaxy Watch</div>
      <div style={{fontFamily: "'Barlow Condensed',sans-serif", fontSize: 22, fontWeight: 800, color: `${P.text}`, marginBottom: 12}}>IMPORT A FINISHED WORKOUT</div>
      <div style={{display: "flex", gap: 8}}>
        <button disabled={busy} onClick={scan} style={btn(false)}>📷 SCAN CODE</button>
        <button disabled={busy || !hasBt} onClick={bluetooth} style={btn(false)}>{hasBt ? "🔵 BLUETOOTH" : "BLUETOOTH: CHROME ONLY"}</button>
      </div>
      {status && <div style={{fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: `${P.acc}`, marginTop: 10, lineHeight: 1.4}}>{status}</div>}
    </div>
  );
}

/* ─── MOTION (React Bits-style components on GSAP) ───────────────────────── */
const REDUCED_MOTION = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const MOTION = !!window.gsap && !REDUCED_MOTION;

// Count Up: tweens from the number on screen to the new one. React never owns the text, so re-renders can't make it jump.
function CountUp({ to = 0, decimals = 0, duration = 1, prefix = "", suffix = "" }) {
  const el = useRef(null), shown = useRef(0);
  const text = (v) => prefix + (decimals ? v.toFixed(decimals) : Math.round(v).toLocaleString()) + suffix;
  React.useLayoutEffect(() => {
    if (!MOTION) { shown.current = to; el.current.textContent = text(to); return; }
    const o = { v: shown.current };
    el.current.textContent = text(o.v);
    const t = gsap.to(o, { v: to, duration, ease: "power2.out",
      onUpdate: () => { shown.current = o.v; if (el.current) el.current.textContent = text(o.v); } });
    return () => t.kill();
  }, [to, decimals, prefix, suffix]);
  return <span ref={el}/>;
}

// Shiny Text: a light sweep across gradient-clipped text
function ShinyText({ children, color = `${P.acc}`, shine = `${P.shine}`, speed = 3.5 }) {
  return (
    <span style={{
      backgroundImage: `linear-gradient(110deg, ${color} 40%, ${shine} 50%, ${color} 60%)`,
      backgroundSize: "200% 100%", WebkitBackgroundClip: "text", backgroundClip: "text",
      color: "transparent", WebkitTextFillColor: "transparent",
      animation: `shine ${speed}s linear infinite`,
    }}>{children}</span>
  );
}

// Spotlight Card: a soft glow that follows your finger or pointer
function SpotlightCard({ children, glow = `rgba(${P.accRgb},0.18)`, style, onClick }) {
  const ref = useRef(null);
  const move = (e) => {
    const r = ref.current.getBoundingClientRect();
    ref.current.style.setProperty("--mx", `${e.clientX - r.left}px`);
    ref.current.style.setProperty("--my", `${e.clientY - r.top}px`);
    ref.current.style.setProperty("--spot", "1");
  };
  const leave = () => ref.current.style.setProperty("--spot", "0");
  return (
    <div ref={ref} onClick={onClick} onPointerMove={move} onPointerDown={move} onPointerLeave={leave} onPointerCancel={leave}
      style={{position:"relative", overflow:"hidden", ...style}}>
      <div style={{position:"absolute", inset:0, pointerEvents:"none", opacity:"var(--spot, 0)", transition:"opacity 0.35s ease",
        background:`radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%), ${glow}, transparent 70%)`}}/>
      {children}
    </div>
  );
}

// Animated List: stagger a screen's sections in whenever `key` changes
function useStaggerIn(ref, key) {
  React.useLayoutEffect(() => {
    const root = ref.current && ref.current.firstElementChild;
    if (!MOTION || !root) return;
    const t = gsap.from(root.children, { y: 18, opacity: 0, duration: 0.45, ease: "power3.out", stagger: 0.06, clearProps: "transform" });
    return () => t.revert();
  }, [key]);
}

// Flip Panel: collapses to nothing, and flips between two faces. Its height follows the face
// that's showing, so neither side is ever clipped and there's no dead space.
function FlipPanel({ open, flipped, front, back }) {
  const frontRef = useRef(null), backRef = useRef(null);
  const [h, setH] = useState({ f: 0, b: 0 });
  React.useLayoutEffect(() => {
    const measure = () => setH({ f: frontRef.current.offsetHeight, b: backRef.current.offsetHeight });
    measure();
    if (!window.ResizeObserver) return;
    const ro = new ResizeObserver(measure);
    ro.observe(frontRef.current); ro.observe(backRef.current);
    return () => ro.disconnect();
  }, []);
  const d = REDUCED_MOTION ? 0 : 0.45, flipD = REDUCED_MOTION ? 0 : 0.6, ease = "cubic-bezier(.4,0,.2,1)";
  // the face turning away stays visible until it's edge-on, then drops out of tab order and taps
  const face = (on) => ({ position:"absolute", top:0, left:0, right:0, backfaceVisibility:"hidden", WebkitBackfaceVisibility:"hidden",
    visibility: on ? "visible" : "hidden", transition:`visibility 0s linear ${on ? 0 : flipD / 2}s` });
  return (
    <div aria-hidden={!open} style={{ height: open ? (flipped ? h.b : h.f) : 0, overflow:"hidden", perspective:1200,
      visibility: open ? "visible" : "hidden", transition:`height ${d}s ${ease}, visibility 0s linear ${open ? 0 : d}s` }}>
      <div style={{ position:"relative", transformStyle:"preserve-3d", transform: flipped ? "rotateY(180deg)" : "none",
        transition:`transform ${flipD}s ${ease}` }}>
        <div ref={frontRef} style={face(!flipped)}>{front}</div>
        <div ref={backRef} style={{ ...face(flipped), transform:"rotateY(180deg)" }}>{back}</div>
      </div>
    </div>
  );
}

/* ─── DATA: EXPORT / IMPORT / CLEAR ──────────────────────────────────────── */
const _normCell = (s) => !s ? {done:false,lbs:"",reps:""} : typeof s === "boolean" ? {done:s,lbs:"",reps:""} : {done:!!s.done, lbs:s.lbs ?? "", reps:s.reps ?? ""};
const _hasData = (c) => c.done || c.lbs !== "" || c.reps !== "";
function _pickCell(a, b) {
  const A = _normCell(a), B = _normCell(b);
  if (A.done && (A.lbs || A.reps)) return A;
  if (B.done && (B.lbs || B.reps)) return B;
  if (_hasData(A)) return A;
  if (_hasData(B)) return B;
  return A.done ? A : B;
}
// Merge an incoming logs object into local logs: union of days, keeping the richest set.
function mergeLogs(local, inc) {
  const out = {...local};
  for (const [date, day] of Object.entries(inc || {})) {
    const cur = {...(out[date] || {})}; cur.workouts = {...(cur.workouts || {})};
    const iw = (day && day.workouts) || {};
    for (const [k, v] of Object.entries(iw)) {
      if (!k.endsWith("_sets") || !Array.isArray(v)) continue;
      const ex = cur.workouts[k] || [];
      const n = Math.max(ex.length, v.length); const merged = [];
      for (let i = 0; i < n; i++) merged[i] = _pickCell(ex[i], v[i]);
      cur.workouts[k] = merged;
    }
    for (const k of Object.keys(cur.workouts)) {
      if (k.endsWith("_sets")) {
        const arr = cur.workouts[k] || [];
        cur.workouts[k.slice(0, -5)] = arr.length > 0 && arr.every(s => _normCell(s).done);
      }
    }
    if (day && day.meals) cur.meals = {...(day.meals || {}), ...(cur.meals || {})};
    if (day && day.supplements) cur.supplements = {...(day.supplements || {}), ...(cur.supplements || {})};
    if (day && day.weight != null && cur.weight == null) cur.weight = day.weight;
    out[date] = cur;
  }
  return out;
}

// ── CSV import: Date,Exercise,Set,Weight,Reps,Bodyweight → the same shape mergeLogs expects.
// Exercise matches by id (bench) or display name (Barbell Bench Press), case-insensitive.
const EXERCISE_LOOKUP = (() => {
  const m = {};
  Object.values(WEEKLY_PLAN).forEach(p => p.exercises.forEach(e => {
    m[e.id.toLowerCase()] = e.id;
    m[e.name.toLowerCase()] = e.id;
  }));
  return m;
})();

function parseCsvRows(text) {
  // minimal CSV parser: handles quoted fields with embedded commas/newlines
  const rows = []; let row = []; let field = ""; let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ""; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(field); field = ""; rows.push(row); row = [];
    } else field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

function parseCsvLogs(text) {
  const rows = parseCsvRows(text);
  if (!rows.length) throw new Error("empty file");
  const header = rows[0].map(h => h.trim().toLowerCase());
  const col = (name) => header.indexOf(name);
  const cDate = col("date"), cEx = col("exercise"), cSet = col("set"), cW = col("weight"), cR = col("reps"), cBw = col("bodyweight");
  if (cDate < 0 || cEx < 0) throw new Error('CSV needs at least "Date" and "Exercise" columns');

  const inc = {};
  let skipped = 0;
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const date = (r[cDate] || "").trim();
    const exRaw = (r[cEx] || "").trim();
    if (!date || !exRaw) continue;
    const exId = EXERCISE_LOOKUP[exRaw.toLowerCase()];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !exId) { skipped++; continue; }

    const day = inc[date] || (inc[date] = { workouts: {} });
    const key = exId + "_sets";
    const arr = day.workouts[key] || (day.workouts[key] = []);
    const setNum = cSet >= 0 ? parseInt(r[cSet], 10) : NaN;
    const idx = Number.isFinite(setNum) && setNum > 0 ? setNum - 1 : arr.length;
    const lbsVal = cW >= 0 ? (r[cW] || "").trim() : "";
    const repsVal = cR >= 0 ? (r[cR] || "").trim() : "";
    arr[idx] = { done: true, lbs: lbsVal, reps: repsVal };

    const bw = cBw >= 0 ? (r[cBw] || "").trim() : "";
    if (bw && !isNaN(parseFloat(bw))) day.weight = parseFloat(bw);
  }
  // fill any sparse gaps (e.g. Set numbers skipped) so arrays aren't holey
  Object.values(inc).forEach(day => Object.keys(day.workouts).forEach(k => {
    day.workouts[k] = Array.from(day.workouts[k], (c) => c || { done: false, lbs: "", reps: "" });
  }));
  return { inc, days: Object.keys(inc).length, skipped };
}

function DataCard({ logs, setLogs, onCelebrate }) {

    const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `fittracker-backup-${todayKey()}.json`;

    flex: 1, padding: "11px 8px", borderRadius: 16, border: `1px solid rgba(${P.ink},0.22)`, cursor: "pointer",
    background: bg, color: fg, fontFamily: "'Barlow Condensed',sans-serif", fontSize: 15, fontWeight: 800, letterSpacing: 1,
  });
