/* ─── REST TIMER HELPERS ─────────────────────────────────────────────────── */
function parseRest(str) {
  if(!str) return 60;
  const minMatch = str.match(/(\d+)\s*min/);
  if(minMatch) return parseInt(minMatch[1]) * 60;
  const secMatch = str.match(/(\d+)\s*s/);
  if(secMatch) return parseInt(secMatch[1]);
  return 60;
}

function TimerIsland({ timer, onStop, onCancel, onAdjust }) {
  // timer = { exercise, setNum, totalSets, color, s, endsAt, total }  (s/endsAt: shared with the watch)
  // Time left always comes from the shared end time, rounded up like the watch, so both read the same
  // second, and it can't drift when the phone throttles timers (locked screen, background tab).
  const total      = timer.total || parseRest(timer.exercise.rest);
  const endsAt     = timer.endsAt || (timer.s || Date.now()) + total * 1000;
  const left       = () => Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
  const [remaining, setRemaining] = useState(left);
  const [done,      setDone]      = useState(false);
  const [expanded,  setExpanded]  = useState(false);
  const live = LiveStatus();
  const linked = live === "live";

  useEffect(() => {
    setDone(false);
    let id = null, endT = null;
    const tick = () => {
      const r = left();
      setRemaining(r);
      if (r > 0 || endT) return;
      clearInterval(id);
      setDone(true);
      try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch {}
      endT = setTimeout(onStop, 1000);
    };
    tick();
    if (!endT) id = setInterval(tick, 250);
    document.addEventListener("visibilitychange", tick);
    return () => { clearInterval(id); clearTimeout(endT); document.removeEventListener("visibilitychange", tick); };
  }, [endsAt, timer.s, onStop]);

  const pct      = Math.max(0, remaining / total);
  const mins     = Math.floor(remaining / 60);
  const secs     = remaining % 60;
  const timeStr  = mins > 0 ? `${mins}:${String(secs).padStart(2,"0")}` : `${remaining}`;
  const col      = done ? `${P.good}` : remaining <= 5 ? `${P.bad}` : remaining <= 15 ? `${P.acc}` : timer.color;
  const urgent   = remaining <= 5 && !done;

  // Arc for the pill outline
  const W = expanded ? 320 : (linked ? 240 : 220), H = expanded ? 52 : 36, R = H / 2;
  const arc = `M ${R},0 H ${W - R} A ${R},${R} 0 0 1 ${W},${R} A ${R},${R} 0 0 1 ${W - R},${H} H ${R} A ${R},${R} 0 0 1 0,${R} A ${R},${R} 0 0 1 ${R},0 Z`;
  const perim = 2 * Math.PI * R + 2 * (W - 2 * R);

  return (
    <div style={{
      position:"fixed", top:10, left:"50%",
      transform:"translateX(-50%)",
      zIndex:500,
      animation:"islandIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both",
      cursor:"pointer",
    }} onClick={() => setExpanded(e => !e)}>

      {/* Pill shell */}
      <div style={{
        position:"relative",
        width:W, height:H,
        background:`${P.island}`,
        borderRadius:R,
        display:"flex", alignItems:"center",
        padding: expanded ? "0 14px" : "0 10px",
        gap: expanded ? 10 : 7,
        boxShadow:`0 4px 24px rgba(0,0,0,0.7), 0 0 0 1px ${col}33`,
        transition:"width 0.3s cubic-bezier(0.34,1.56,0.64,1), height 0.3s cubic-bezier(0.34,1.56,0.64,1), padding 0.3s ease",
        overflow:"hidden",
      }}>

        {/* SVG draining outline */}
        <svg style={{position:"absolute",inset:0,pointerEvents:"none"}} width={W} height={H}>
          <path d={arc} fill="none" stroke={`${col}22`} strokeWidth="1.5"/>
          <path d={arc} fill="none" stroke={col} strokeWidth="1.5"
            strokeDasharray={perim}
            strokeDashoffset={perim * pct}
            strokeLinecap="round"
            style={{transition:"stroke-dashoffset 1s linear, stroke 0.4s ease"}}
          />
        </svg>

        {/* Tiny color dot */}
        <div style={{
          width: done ? 10 : urgent ? 10 : 8,
          height: done ? 10 : urgent ? 10 : 8,
          borderRadius:"50%",
          background: col,
          flexShrink:0,
          transition:"all 0.3s",
          animation: urgent ? "streakBounce 0.4s ease-in-out infinite" : done ? "pop 0.4s ease" : "none",
          boxShadow: `0 0 ${urgent ? 8 : 4}px ${col}`,
        }}/>

        {/* Set badge */}
        <div style={{
          fontFamily:"'Barlow Condensed',sans-serif",
          fontSize: expanded ? 13 : 11,
          fontWeight:800, color:col, letterSpacing:0.3,
          flexShrink:0, transition:"font-size 0.2s",
        }}>
          {done ? "DONE" : `S${timer.setNum}/${timer.totalSets}`}
        </div>

        {/* Separator */}
        <div style={{width:1,height:14,background:`rgba(${P.ink},0.1)`,flexShrink:0}}/>

        {/* Countdown */}
        <div style={{
          fontFamily:"'Barlow Condensed',sans-serif",
          fontSize: expanded ? 22 : 17,
          fontWeight:900, color:`${P.text}`, letterSpacing:-0.5,
          lineHeight:1, flexShrink:0,
          transition:"font-size 0.2s",
          animation: urgent ? "streakBounce 0.4s ease-in-out infinite" : "none",
        }}>{done ? "✅" : timeStr}</div>

        {/* same countdown is on the watch right now */}
        {linked && !done && (
          <div title="Synced with your watch" style={{fontSize:11,color:`${P.good}`,flexShrink:0,display:"flex",alignItems:"center",gap:2,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,letterSpacing:0.5}}>
            ⌚{!expanded && <span>SYNCED</span>}
          </div>
        )}

        {/* Exercise name — only when expanded */}
        {expanded && (
          <div style={{
            fontFamily:"'DM Sans',sans-serif", fontSize:11, color:`rgba(${P.ink},0.45)`,
            overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", flex:1,
            animation:"fadeUp 0.2s ease",
          }}>{timer.exercise.name}</div>
        )}

        {/* Expanded controls */}
        {expanded && (
          <div style={{display:"flex",gap:5,flexShrink:0,animation:"fadeUp 0.2s ease"}}>
            {/* ±15s instead of pause: a pause can't be shared, a new end time can */}
            {[-15, 15].map(d => (
              <button key={d} aria-label={`${d > 0 ? "Add" : "Remove"} 15 seconds`} onClick={e=>{e.stopPropagation();onAdjust && onAdjust(d);}} style={{
                padding:"3px 7px",borderRadius:6,border:"none",cursor:"pointer",
                background:`rgba(${P.ink},0.08)`, color:`${P.sub}`,
                fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,fontWeight:800,
              }}>{d > 0 ? "+15" : "−15"}</button>
            ))}
            <button onClick={e=>{e.stopPropagation();(onCancel||onStop)();}} style={{
              padding:"3px 8px",borderRadius:6,border:"none",cursor:"pointer",
              background:`rgba(${P.ink},0.05)`,color:`${P.muted}`,
              fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,fontWeight:800,
            }}>✕</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── LOCAL PYRAMID CALCULATOR ───────────────────────────────────────────── */
// Determines warm-up → working weight pyramid from last session data, no backend needed
function calcPyramid(numSets, lastSessionSets) {
  // Find the heaviest logged weight from the last session
  const logged = (lastSessionSets || []).map(s => parseFloat(s.lbs)).filter(n => !isNaN(n) && n > 0);
  const topWeight = logged.length ? Math.max(...logged) : null;

  if(!topWeight) return null; // no prior data → no suggestion yet

  // Build pyramid: sets go from ~60% up to ~100% of last top weight, in 5 lb increments
  const pcts = numSets === 2 ? [0.75, 1.0]
             : numSets === 3 ? [0.65, 0.82, 1.0]
             : numSets === 4 ? [0.60, 0.75, 0.88, 1.0]
             : numSets === 5 ? [0.55, 0.68, 0.80, 0.92, 1.0]
             : Array.from({length:numSets},(_,i)=> 0.55 + (0.45/(numSets-1))*i);

  const notes = ["warm-up","build","working weight","push hard","max effort"];
  return pcts.map((p, i) => {
    const raw   = topWeight * p;
    const lbs   = Math.round(raw / 5) * 5; // round to nearest 5 lbs
    const note  = notes[Math.min(i, notes.length-1)];
    return { set: i+1, lbs, note };
  });
}

function PyramidSuggestion({ exercise, numSets, lastSessionSets, planColor, alwaysOpen }) {
  const [open, setOpen] = useState(!!alwaysOpen);
  const weights = calcPyramid(numSets, lastSessionSets);

  // No prior data at all
  if(!weights) return (
    <div style={{
      display:"flex",alignItems:"center",gap:6,
      margin:"0 14px 8px",padding:"6px 12px",
      background:`rgba(${P.ink},0.03)`,borderRadius:14,

        Log weights below — pyramid suggestions appear next session
      </span>
    </div>
  );

  if(!open) return (
    <button onClick={()=>setOpen(true)} style={{
      display:"flex",alignItems:"center",gap:6,
      margin:"0 14px 8px",
      padding:"6px 12px",
      background:`${planColor}14`,
      border:`1px solid ${planColor}33`,
      borderRadius:14, cursor:"pointer", width:"calc(100% - 28px)",
      justifyContent:"center",
    }}>
      <span style={{fontSize:13}}>📊</span>
      <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600,color:planColor}}>
        Show Pyramid Suggestion
      </span>
    </button>
  );

  return (
    <div style={{margin:"0 14px 8px",background:`${planColor}0d`,border:`1px solid ${planColor}33`,borderRadius:16,overflow:"hidden"}}>
      <div style={{display:"flex",alignItems:"center",gap:6,padding:"7px 12px",borderBottom:`1px solid ${planColor}18`}}>
        <span style={{fontSize:12}}>📊</span>
        <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,fontWeight:600,color:planColor}}>Pyramid · Based on last session</span>
        {!alwaysOpen && <button onClick={()=>setOpen(false)} style={{marginLeft:"auto",background:"none",border:"none",color:`rgba(${P.ink},0.3)`,cursor:"pointer",fontSize:13,padding:"2px 4px"}}>✕</button>}
      </div>
      <div style={{display:"flex",padding:"8px 12px 10px",gap:6,flexWrap:"wrap"}}>
        {weights.map(w => (
          <div key={w.set} style={{
            display:"flex",flexDirection:"column",alignItems:"center",
            background:`rgba(${P.ink},0.05)`,borderRadius:14,
            padding:"8px 10px",minWidth:54,
          }}>
            <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:9,color:`${P.muted}`,fontWeight:600,textTransform:"uppercase"}}>Set {w.set}</span>
            <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:900,color:`${P.text}`,lineHeight:1.1}}>{w.lbs}</span>
            <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:9,color:`${P.muted}`}}>lbs</span>
            <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:9,color:planColor,marginTop:3,textAlign:"center",lineHeight:1.3}}>{w.note}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── DAILY LOG ──────────────────────────────────────────────────────────── */
function DailyLog({ selectedDate, logs, setLogs, onCelebrate, profile, activeTimer, onStartTimer, onStopTimer }) {
  const log = logs[selectedDate] || {};
  const dow = DOW(selectedDate);
  const plan = WEEKLY_PLAN[dow];
  const date = new Date(selectedDate + "T12:00:00");
  const dateLabel = `${DAY_NAMES[date.getDay()]}, ${MONTH_NAMES[date.getMonth()]} ${date.getDate()} ${date.getFullYear()}`;
  const [weightInput, setWeightInput] = useState(log.weight||"");
  const [tab, setTab] = useState("workout");
  const prevRef = useRef({});

  // Parse numeric set count from string like "4", "3"
  const numSets = useCallback((ex) => parseInt(ex.sets) || 1, []);

  // Returns array of {done, lbs, reps} for each set
  const getSetsData = useCallback((exId, total) => {
    const raw = (log.workouts||{})[exId + "_sets"] || [];
    return Array.from({length: total}, (_, i) => {
      const s = raw[i];
      if(!s) return {done:false, lbs:"", reps:""};
      if(typeof s === "boolean") return {done:s, lbs:"", reps:""};
      return {done:!!s.done, lbs:s.lbs||"", reps:s.reps||""};
    });
  }, [log]);

  // Backward-compat shim used by completion checks
  const setsDoneFor = useCallback((exId, total) => {
    return getSetsData(exId, total).map(s => s.done);
  }, [getSetsData]);

  // Find last logged session for an exercise across all dates before today
  const getLastSession = useCallback((exId, total) => {
    const sorted = Object.keys(logs)
      .filter(k => k < selectedDate && logs[k]?.workouts?.[exId+"_sets"])
      .sort((a,b) => b.localeCompare(a));
    if(!sorted.length) return null;
    const raw = logs[sorted[0]].workouts[exId+"_sets"] || [];
    return Array.from({length:total},(_,i)=>{
      const s = raw[i];
      if(!s) return {done:false,lbs:"",reps:""};
      if(typeof s==="boolean") return {done:s,lbs:"",reps:""};
      return {done:!!s.done,lbs:s.lbs||"",reps:s.reps||""};
    });
  }, [logs, selectedDate]);

  const updateSet = useCallback(async (ex, setIdx, field, value) => {
    const total = numSets(ex);
    const newLogs = {...logs};
    const day = {...(newLogs[selectedDate]||{})};
    day.workouts = {...(day.workouts||{})};

    const prev = getSetsData(ex.id, total);
    const updated = prev.map((s,i) => i===setIdx ? {...s, [field]: value} : {...s});
    // auto-mark done when weight+reps filled in
    if(field==="done") updated[setIdx].done = value;
    day.workouts[ex.id+"_sets"] = updated;
    day.workouts[ex.id] = updated.every(s=>s.done);

    newLogs[selectedDate] = day;
    setLogs(newLogs);
    await storageSet("logs", newLogs);

    if(field==="done" && value) {
      onStartTimer({ exercise:ex, setNum:setIdx+1, totalSets:total, color:plan.color });
    } else if(field==="done" && !value) {
      onStopTimer();
    }

    // Celebration check
    const prevDay = prevRef.current[selectedDate]||{};
    const allDoneNow = plan.exercises.every(e => {
      const n=numSets(e); const s=Array.from({length:n},(_,i)=>!!((day.workouts[e.id+"_sets"]||[])[i]?.done));
      return s.every(Boolean);
    });
    const allDonePrev = plan.exercises.every(e => {
      const n=numSets(e); const s=Array.from({length:n},(_,i)=>!!((prevDay.workouts||{})[e.id+"_sets"]?.[i]?.done));
      return s.every(Boolean);
    });
    if(allDoneNow && !allDonePrev && plan.exercises.length>0)
      onCelebrate({emoji:"💪",title:"WORKOUT COMPLETE!",msg:`${plan.name} destroyed. Every set done.`});

    prevRef.current[selectedDate] = day;
  }, [logs, selectedDate, plan, numSets, getSetsData, setLogs, onCelebrate, onStartTimer, onStopTimer]);

  const update = useCallback(async (path, val) => {
    const newLogs = {...logs};
    const day = {...(newLogs[selectedDate]||{})};
    if(path[0]==="meals") { day.meals={...(day.meals||{})}; day.meals[path[1]]=val; }
    else if(path[0]==="supplements") { day.supplements={...(day.supplements||{})}; day.supplements[path[1]]=val; }
    else if(path[0]==="weight") { day.weight=val; }
    newLogs[selectedDate]=day;
    setLogs(newLogs);
    await storageSet("logs",newLogs);

    const prev = prevRef.current[selectedDate]||{};
    if(path[0]==="meals" && val===true) {
      const dn = MEALS.filter(m=>(day.meals||{})[m.id]).length;
      const db = MEALS.filter(m=>(prev.meals||{})[m.id]).length;
      if(dn===MEALS.length && db<MEALS.length)
        onCelebrate({emoji:"🍽️",title:"ALL MEALS HIT!",msg:"Nutrition on point. Muscles are feasting."});
    }
    if(path[0]==="supplements" && val===true) {
      const dn = SUPPLEMENTS.filter(s=>(day.supplements||{})[s.id]).length;
      const db = SUPPLEMENTS.filter(s=>(prev.supplements||{})[s.id]).length;
      if(dn===SUPPLEMENTS.length && db<SUPPLEMENTS.length)
        onCelebrate({emoji:"💊",title:"SUPPLEMENTS DONE!",msg:"Stack complete. Optimization mode activated."});
    }
    prevRef.current[selectedDate] = day;
  }, [logs, selectedDate, setLogs, onCelebrate]);

  // Count completed exercises (all sets done) for tab badge
  const exDoneCount = plan.exercises.filter(ex => {
    const total = numSets(ex);
    const sets = setsDoneFor(ex.id, total);
    return sets.every(Boolean);
  }).length;

  // Workout cards stay collapsed except the one you're on (first unfinished, or the one resting).
  // Tapping a card overrides that for the day; finished cards fold away on their own.
  const [openOverride, setOpenOverride] = useState({});
  const [flippedEx, setFlippedEx] = useState({});
  useEffect(() => { setOpenOverride({}); setFlippedEx({}); }, [selectedDate]);
  const currentExId = (plan.exercises.find(ex => !setsDoneFor(ex.id, numSets(ex)).every(Boolean)) || {}).id;
  const isOpen = (ex) => ex.id in openOverride ? openOverride[ex.id]
    : ex.id === currentExId || activeTimer?.exercise?.id === ex.id;
  const toggleOpen = (ex) => setOpenOverride(o => ({...o, [ex.id]: !isOpen(ex)}));
  const allOpen = plan.exercises.length > 0 && plan.exercises.every(isOpen);
  const setAllOpen = (v) => setOpenOverride(Object.fromEntries(plan.exercises.map(ex => [ex.id, v])));

  const saveWeight = useCallback(async () => {
    const w = parseFloat(weightInput);
    if(isNaN(w)||w<100||w>400) return;
    await update(["weight"], w);
    // Check milestones
    const gained = w - profile.startWeight;
    for(const m of MILESTONES) {
      const prev = logs[selectedDate]?.weight;
      if(gained>=m.lbs && (!prev||prev-profile.startWeight<m.lbs))
        onCelebrate(m);
    }
  }, [weightInput, update, profile, logs, selectedDate]);

  const tabs = [
    {id:"workout",    label:"Workout",    icon:"dumbbell", count: plan.exercises.length > 0 ? `${exDoneCount}/${plan.exercises.length}` : "Rest"},
    {id:"meals",      label:"Meals",      icon:"meals", count: `${MEALS.filter(m=>(log.meals||{})[m.id]).length}/${MEALS.length}`},
    {id:"supps",      label:"Supps",      icon:"pill", count: `${SUPPLEMENTS.filter(s=>(log.supplements||{})[s.id]).length}/${SUPPLEMENTS.length}`},
    {id:"weight",     label:"Weight",     icon:"scale", count: log.weight ? `${log.weight}` : "—"},
  ];

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%", animation:MOTION?"none":"fadeUp 0.4s ease both"}}>
      {/* Date header */}
      <div style={{padding:"16px 16px 0"}}>
        <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:`${P.sub}`}}>{dateLabel}</div>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,fontWeight:900,color:`${P.text}`,letterSpacing:0.5}}>
          <span style={{color:plan.color}}>{plan.emoji} {plan.name}</span>
        </div>
        <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:`${P.muted}`,marginTop:2}}>{plan.sub}</div>
      </div>

      {/* Tab bar */}
      <div style={{display:"flex",padding:"12px 16px 0",gap:8,overflowX:"auto"}}>
        {tabs.map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            display:"flex",alignItems:"center",gap:6,padding:"9px 15px",borderRadius:16,border:"none",cursor:"pointer",
            background: tab===t.id ? `${P.acc}` : `${P.card}`,
            color: tab===t.id ? `${P.onAcc}` : `${P.sub}`,
            fontFamily:"'DM Sans',sans-serif", fontWeight:600, fontSize:12, whiteSpace:"nowrap",
            transition:"all 0.2s",
          }}>
            <Icon name={t.icon} size={16} sw={2}/>{t.label}
            <span style={{
              background: tab===t.id ? "rgba(0,0,0,0.2)" : `rgba(${P.ink},0.08)`,
              borderRadius:6, padding:"1px 6px", fontSize:10, fontWeight:700
            }}>{t.count}</span>
          </button>
        ))}
      </div>

      {/* Content */}
      <div style={{flex:1, overflowY:"auto", padding:"14px 16px 16px"}}>
        {/* WORKOUT TAB */}
        {tab==="workout" && (
          plan.type==="rest" ? (
            <div style={{textAlign:"center",padding:"40px 20px"}}>
              <div style={{fontSize:60,marginBottom:16}}>{plan.emoji}</div>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,fontWeight:800,color:`${P.text}`}}>{plan.name}</div>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:14,color:`${P.sub}`,marginTop:8}}>{plan.sub}</div>
              <div style={{marginTop:20,padding:"16px",background:`${P.card}`,borderRadius:24,fontSize:14,color:`${P.muted}`,lineHeight:1.6,fontFamily:"'DM Sans',sans-serif"}}>
                Focus on nutrition, sleep 8–9 hrs, foam roll, and light walking. This is when muscles GROW.
              </div>
            </div>
          ) : (
            <>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"-4px 2px 10px"}}>
                <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:`${P.muted}`}}>Tap a card to open · ↻ flips to the plan</span>
                <button onClick={() => setAllOpen(!allOpen)} style={{background:"none",border:"none",cursor:"pointer",color:plan.color,fontFamily:"'DM Sans',sans-serif",fontSize:11,fontWeight:600,padding:"4px 0"}}>
                  {allOpen ? "Collapse all" : "Expand all"}
                </button>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {plan.exercises.map((ex, i) => {
                  const total     = numSets(ex);
                  const setsData  = getSetsData(ex.id, total);
                  const allDone   = setsData.every(s=>s.done);
                  const anyDone   = setsData.some(s=>s.done);
                  const doneCount = setsData.filter(s=>s.done).length;
                  const isActive  = activeTimer?.exercise?.id === ex.id;
                  const lastSess  = getLastSession(ex.id, total);
                  const open      = isOpen(ex);
                  const flipped   = !!flippedEx[ex.id];
                  const lastLogged = (lastSess || []).filter(s => s.lbs || s.reps);

                  return (
                    <div key={ex.id} style={{
                      background: allDone ? `${plan.color}18` : anyDone ? `${plan.color}09` : `${P.card}`,
                      borderRadius:26,
                      border: isActive ? `2px solid ${plan.color}` : allDone ? `1px solid ${plan.color}44` : `1px solid rgba(${P.ink},0.16)`,
                      overflow:"hidden", transition:"all 0.25s",
                      animation:`fadeUp 0.3s ${i*0.06}s both`,
                    }}>

                      {/* Exercise header: tap to open / collapse */}
                      <div role="button" tabIndex={0} aria-expanded={open}
                        onClick={() => toggleOpen(ex)}
                        onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleOpen(ex); } }}
                        style={{display:"flex",alignItems:"center",gap:12,padding: open ? "12px 14px 8px" : "12px 14px",cursor:"pointer",transition:"padding 0.3s ease"}}>
                        <div style={{
                          width:34,height:34,borderRadius:14,flexShrink:0,
                          background: allDone ? plan.color : anyDone ? `${plan.color}33` : `rgba(${P.ink},0.06)`,
                          display:"flex",alignItems:"center",justifyContent:"center",
                          fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:900,
                          color: allDone ? `${P.onAcc}` : plan.color, transition:"all 0.25s",
                        }}>
                          {allDone ? "✓" : anyDone ? `${doneCount}/${total}` : ""}
                        </div>
                        <div style={{flex:1}}>
                          <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:14,fontWeight:600,
                            color: allDone ? `rgba(${P.ink},0.4)`:`${P.text}`,
                            textDecoration: allDone?"line-through":"none",
                          }}>{ex.name}</div>
                          <div style={{display:"flex",gap:8,marginTop:2,flexWrap:"wrap"}}>
                            <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,color:plan.color,fontWeight:700}}>{ex.sets} sets · {ex.reps} reps</span>
                            <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,color:`${P.faint}`}}>↺ {ex.rest}</span>
                          </div>
                        </div>
                        {isActive && <div style={{fontSize:15,animation:"streakBounce 0.8s ease-in-out infinite"}}>⏱️</div>}
                        {allDone && !isActive && <div style={{fontSize:17,animation:"pop 0.3s ease"}}>⚡</div>}
                        {/* collapsed: one dot per set, so progress reads at a glance */}
                        {!open && (
                          <div style={{display:"flex",gap:3}}>
                            {setsData.map((s, si) => <div key={si} style={{width:6,height:6,borderRadius:"50%",background: s.done ? plan.color : `rgba(${P.ink},0.12)`}}/>)}
                          </div>
                        )}
                        {open && (
                          <button aria-label={flipped ? "Show set log" : "Show plan and last session"}
                            onClick={e => { e.stopPropagation(); setFlippedEx(f => ({...f, [ex.id]: !flipped})); }}
                            style={{display:"flex",alignItems:"center",gap:4,padding:"5px 9px",borderRadius:9,cursor:"pointer",
                              border:`1px solid ${plan.color}44`, background: flipped ? `${plan.color}22` : `rgba(${P.ink},0.04)`,
                              color: plan.color, fontFamily:"'Barlow Condensed',sans-serif", fontSize:12, fontWeight:800, letterSpacing:0.5}}>
                            <span style={{display:"inline-block",transition:"transform 0.6s ease",transform:`rotate(${flipped ? 180 : 0}deg)`}}>↻</span>
                            {flipped ? "LOG" : "PLAN"}
                          </button>
                        )}
                        <div style={{color:`${P.muted}`,fontSize:12,transition:"transform 0.35s ease",transform:`rotate(${open ? 180 : 0}deg)`}}>▾</div>
                      </div>

                      <FlipPanel open={open} flipped={flipped}
                        back={
                          <div style={{paddingBottom:12}}>
                            <PyramidSuggestion exercise={ex} numSets={total} lastSessionSets={lastSess} planColor={plan.color} alwaysOpen/>
                            <div style={{margin:"0 14px",padding:"8px 12px",background:`rgba(${P.ink},0.03)`,borderRadius:14}}>
                              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:9,fontWeight:600,color:`${P.faint}`,textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}}>Last session</div>
                              {lastLogged.length ? (
                                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                                  {lastSess.map((s, si) => (s.lbs || s.reps) ? (
                                    <div key={si} style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:700,color:`${P.text}`,background:`rgba(${P.ink},0.05)`,borderRadius:8,padding:"4px 8px"}}>
                                      <span style={{color:`${P.muted}`}}>S{si+1} </span>{s.lbs || "BW"}{s.reps ? ` × ${s.reps}` : ""}
                                    </div>
                                  ) : null)}
                                </div>
                              ) : (
                                <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:`${P.faint}`}}>Nothing logged yet for this exercise</div>
                              )}
                              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,color:plan.color,fontWeight:700,marginTop:8}}>
                                Target: {ex.sets} sets · {ex.reps} reps · rest {ex.rest}
                              </div>
                            </div>
                          </div>
                        }
                        front={<>

                      {/* Column headers */}
                      <div style={{display:"grid",gridTemplateColumns:"32px 1fr 1fr 40px",gap:6,padding:"0 14px 6px",alignItems:"center"}}>
                        {["SET","WEIGHT (lbs)","REPS DONE",""].map((h,hi)=>(
                          <div key={hi} style={{fontFamily:"'DM Sans',sans-serif",fontSize:9,fontWeight:600,color:`${P.faint}`,textTransform:"uppercase",letterSpacing:0.5,textAlign: hi===3?"center":"left"}}>{h}</div>
                        ))}
                      </div>

                      {/* Per-set rows */}
                      <div style={{display:"flex",flexDirection:"column",gap:5,padding:"0 14px 12px"}}>
                        {setsData.map((s, si) => {
                          const isTiming = isActive && activeTimer?.setNum === si+1;
                          return (
                            <div key={si} style={{
                              display:"grid", gridTemplateColumns:"32px 1fr 1fr 40px", gap:6, alignItems:"center",
                              padding:"6px 8px", borderRadius:14,
                              background: isTiming ? `${plan.color}22` : s.done ? `${plan.color}14` : `rgba(${P.ink},0.03)`,
                              border: isTiming ? `1px solid ${plan.color}66` : s.done ? `1px solid ${plan.color}22` : "1px solid transparent",
                              transition:"all 0.2s",
                            }}>
                              {/* Set badge */}
                              <div style={{
                                fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:900,
                                color: s.done ? plan.color : `${P.muted}`, textAlign:"center",
                              }}>S{si+1}</div>

                              {/* Weight input */}
                              <input
                                type="number" step="2.5" min="0" max="999"
                                value={s.lbs}
                                placeholder="lbs"
                                onChange={e => updateSet(ex, si, "lbs", e.target.value)}
                                style={{
                                  padding:"5px 8px", borderRadius:8,
                                  background: s.done ? `rgba(${P.ink},0.04)` : `rgba(${P.ink},0.07)`,
                                  border:`1px solid ${s.lbs ? plan.color+"55" : `rgba(${P.ink},0.08)`}`,
                                  color: s.lbs ? `${P.text}` : `${P.faint}`,
                                  fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:700,
                                  width:"100%", outline:"none", textAlign:"center",
                                }}
                              />

                              {/* Reps input */}
                              <input
                                type="number" step="1" min="0" max="99"
                                value={s.reps}
                                placeholder={ex.reps.split("–")[0]}
                                onChange={e => updateSet(ex, si, "reps", e.target.value)}
                                style={{
                                  padding:"5px 8px", borderRadius:8,
                                  background: s.done ? `rgba(${P.ink},0.04)` : `rgba(${P.ink},0.07)`,
                                  border:`1px solid ${s.reps ? `${P.good}55` : `rgba(${P.ink},0.08)`}`,
                                  color: s.reps ? `${P.text}` : `${P.faint}`,
                                  fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:700,
                                  width:"100%", outline:"none", textAlign:"center",
                                }}
                              />

                              {/* Done toggle */}
                              <button
                                onClick={() => updateSet(ex, si, "done", !s.done)}
                                style={{
                                  width:34, height:34, borderRadius:9, border:"none", cursor:"pointer",
                                  background: isTiming ? `${plan.color}44` : s.done ? plan.color : `rgba(${P.ink},0.07)`,
                                  color: s.done ? `${P.onAcc}` : isTiming ? plan.color : `rgba(${P.ink},0.3)`,
                                  fontSize: isTiming ? 14 : 13,
                                  transition:"all 0.2s",
                                  transform: isTiming ? "scale(1.1)" : "scale(1)",
                                  boxShadow: isTiming ? `0 0 10px ${plan.color}55` : "none",
                                  display:"flex",alignItems:"center",justifyContent:"center",
                                  margin:"0 auto",
                                }}
                              >{isTiming ? "⏱" : s.done ? "✓" : "○"}</button>
                            </div>
                          );
                        })}
                      </div>
                      </>}/>

                      {/* Progress bar */}
                      <div style={{height:2,background:`rgba(${P.ink},0.04)`}}>
                        <div style={{height:"100%",width:`${(doneCount/total)*100}%`,background:`linear-gradient(90deg,${plan.color}66,${plan.color})`,transition:"width 0.4s ease"}}/>
                      </div>
                    </div>
                  );
                })}
              </div>
            </>
          )
        )}

        {/* MEALS TAB */}
        {tab==="meals" && (
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {MEALS.map((meal, i) => {
              const done = !!(log.meals||{})[meal.id];
              return (
                <div key={meal.id} onClick={() => update(["meals",meal.id], !done)}
                  style={{
                    display:"flex",alignItems:"flex-start",gap:14,padding:"14px 16px",
                    background: done ? `${P.good}18` : `${P.card}`,
                    borderRadius:20, cursor:"pointer",
                    border: done ? `1px solid ${P.good}44` : `1px solid rgba(${P.ink},0.16)`,
                    transition:"all 0.25s", animation:`fadeUp 0.3s ${i*0.05}s both`,
                  }}>
                  <div style={{
                    width:42,height:42,borderRadius:16,flexShrink:0,
                    background: done ? `${P.good}` : `rgba(${P.ink},0.06)`,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:22, transition:"all 0.2s",
                  }}>{done?"✓":meal.emoji}</div>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",justifyContent:"space-between"}}>
                      <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:14,fontWeight:600,color:done?`rgba(${P.ink},0.5)`:`${P.text}`,textDecoration:done?"line-through":"none"}}>{meal.name}</div>
                      <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,color:`${P.sub}`}}>{meal.time}</div>
                    </div>
                    <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:`${P.sub}`,marginTop:3,lineHeight:1.4}}>{meal.foods}</div>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,color:`${P.good}`,marginTop:4,fontWeight:700}}>{meal.macros}</div>
                  </div>
                </div>
              );
            })}
            <div style={{background:`${P.card}`,borderRadius:20,padding:"12px 16px",border:`1px solid rgba(${P.ink},0.16)`}}>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:`${P.sub}`,marginBottom:6}}>Daily target</div>
              <div style={{display:"flex",gap:16}}>
                {[["Protein","190g",`${P.bad}`],["Carbs","375g",`${P.acc}`],["Fats","100g",`${P.info}`],["Kcal","3,160",`${P.good}`]].map(([l,v,c])=>(
                  <div key={l} style={{textAlign:"center"}}>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:18,fontWeight:800,color:c}}>{v}</div>

                <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,color:`${P.sub}`,fontWeight:600}}>lbs</span>
              </div>
              <button onClick={saveWeight} style={{

  );
}

/* ─── CALENDAR ───────────────────────────────────────────────────────────── */
function Calendar({ logs, selectedDate, setSelectedDate, setView }) {
  const today = todayKey();
  const [viewDate, setViewDate] = useState(new Date(today + "T12:00:00"));

  const year = viewDate.getFullYear(), month = viewDate.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  const getCompletion = (key) => {
    const log = logs[key];
    if(!log) return null;
    const dow = DOW(key);
    const plan = WEEKLY_PLAN[dow];
    const wDone = plan.exercises.filter(e=>(log.workouts||{})[e.id]).length;
    const mDone = MEALS.filter(m=>(log.meals||{})[m.id]).length;
    const sDone = SUPPLEMENTS.filter(s=>(log.supplements||{})[s.id]).length;
    const total = plan.exercises.length + MEALS.length + SUPPLEMENTS.length;
    const done = wDone + mDone + sDone;
    if(total===0) return null;
    return done/total;
  };

  const cells = [];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);

  return (
    <div style={{padding:"16px", animation:MOTION?"none":"fadeUp 0.4s ease both"}}>
      {/* Month nav */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <button onClick={()=>setViewDate(new Date(year,month-1,1))} style={{background:`rgba(${P.ink},0.13)`,border:"none",color:`${P.text}`,padding:"8px 14px",borderRadius:14,cursor:"pointer",fontSize:18}}>‹</button>
        <div style={{textAlign:"center"}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:30,fontWeight:900,color:`${P.text}`,letterSpacing:1}}>{["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"][month]}</div>
          <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,color:`${P.sub}`}}>{year}</div>
        </div>
        <button onClick={()=>setViewDate(new Date(year,month+1,1))} style={{background:`rgba(${P.ink},0.13)`,border:"none",color:`${P.text}`,padding:"8px 14px",borderRadius:14,cursor:"pointer",fontSize:18}}>›</button>
      </div>

      {/* Day headers */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:6}}>
        {["S","M","T","W","T","F","S"].map((d,i)=>(
          <div key={i} style={{textAlign:"center",fontFamily:"'DM Sans',sans-serif",fontSize:11,fontWeight:600,color:`${P.muted}`,padding:"4px 0"}}>{d}</div>
        ))}
      </div>

      {/* Calendar grid */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:5}}>
        {cells.map((day, i) => {
          if(!day) return <div key={`e${i}`}/>;
          const key = getDateKey(year,month,day);
          const comp = getCompletion(key);
          const isToday = key===today;
          const isSel = key===selectedDate;
          const future = key > today;
          let bg = `${P.card}`, border=`1px solid rgba(${P.ink},0.16)`, dotColor=null;
          if(comp!==null && !future) {
            if(comp>=0.9) { bg=`${P.good}22`; border=`1px solid ${P.good}55`; dotColor=`${P.good}`; }
            else if(comp>=0.5) { bg=`${P.acc}22`; border=`1px solid ${P.acc}55`; dotColor=`${P.acc}`; }
            else if(comp>0) { bg=`${P.bad}18`; border=`1px solid ${P.bad}33`; dotColor=`${P.bad}`; }
          }
          if(isSel) { bg=`${P.acc}33`; border=`2px solid ${P.acc}`; }
          if(isToday && !isSel) { border=`2px solid ${P.info}`; }
          return (
            <div key={key} onClick={()=>{ setSelectedDate(key); setView("log"); }}
              style={{
                aspectRatio:"1",background:bg,border,borderRadius:16,
                display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
                cursor:future?"default":"pointer",position:"relative",
                opacity:future?0.3:1,transition:"all 0.15s",
              }}>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:isSel||isToday?800:600,color:isSel?`${P.acc}`:isToday?`${P.info}`:`${P.text}`}}>{day}</div>
              {dotColor && <div style={{width:5,height:5,borderRadius:"50%",background:dotColor,marginTop:2}}/>}
            </div>
          );
        })}
      </div>

      {/* Legend */}
      <div style={{display:"flex",gap:20,justifyContent:"center",marginTop:20,flexWrap:"wrap"}}>
        {[[`${P.good}`,"90%+ Complete"],[`${P.acc}`,"50–89%"],[`${P.bad}`,"< 50%"],[`${P.info}`,"Today"]].map(([c,l])=>(
          <div key={l} style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:10,height:10,borderRadius:"50%",background:c}}/>
            <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:`${P.sub}`}}>{l}</span>
          </div>
        ))}
      </div>

      {/* Week summary */}
      <div style={{marginTop:20,background:`${P.card}`,borderRadius:24,padding:16,border:`1px solid rgba(${P.ink},0.16)`}}>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:18,fontWeight:800,color:`${P.text}`,marginBottom:12}}>WEEKLY SCHEDULE</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {[1,2,3,4,5,6,0].map(dow=>{
            const p = WEEKLY_PLAN[dow];
            return (
              <div key={dow} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 12px",background:`${P.inset}`,borderRadius:14}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:p.color,flexShrink:0}}/>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:700,color:`${P.text}`,width:32,flexShrink:0}}>{["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dow]}</div>
                <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:`${P.sub}`,flex:1}}>{p.name}</div>
                <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:`${P.muted}`}}>{p.exercises.length>0?`${p.exercises.length} exercises`:"Rest"}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ─── PROGRESS ───────────────────────────────────────────────────────────── */
function Progress({ logs, setLogs, profile, setProfile, setProfileSetUp, onCelebrate }) {
  const [settingsTab, setSettingsTab] = useState("profile");
  const [editProfile, setEditProfile] = useState(false);
  const [name, setName] = useState(profile.name||"");
  const [sw, setSw] = useState(String(profile.startWeight));
  const [gw, setGw] = useState(String(profile.goalWeight||profile.startWeight+20));
  const [sd, setSd] = useState(profile.startDate||todayKey());
  const [chartRange, setChartRange] = useState("all");
  const [editingEntry, setEditingEntry] = useState(null); // date key being edited
  const [editVal, setEditVal] = useState("");
  const [addDate, setAddDate] = useState("");
  const [addVal, setAddVal] = useState("");
  const [showAddForm, setShowAddForm] = useState(false);
  const today = todayKey();

  // All weight entries sorted oldest → newest
  const allWeightData = Object.entries(logs)
    .filter(([,l]) => l.weight)
    .sort(([a],[b]) => a.localeCompare(b))
    .map(([date, l]) => ({ date, w: l.weight }));

  const filtered = chartRange === "all" ? allWeightData
    : chartRange === "30" ? allWeightData.slice(-30)
    : allWeightData.slice(-7);

  const currentWeight = allWeightData.length > 0 ? allWeightData[allWeightData.length-1].w : profile.startWeight;
  const goal = profile.goalWeight || profile.startWeight + 20;
  const gained = currentWeight - profile.startWeight;
  const gainPct = Math.min(100, Math.max(0, gained / Math.max(1,goal-profile.startWeight) * 100));
  const daysLogged = Object.keys(logs).length;
  const totalWorkouts = Object.values(logs).reduce((acc,l,_,arr) => {
    const key = Object.keys(logs)[Object.values(logs).indexOf(l)];
    const dow = key ? DOW(key) : 0;
    const p = WEEKLY_PLAN[dow];
    return acc + (p.exercises.filter(e => (l.workouts||{})[e.id]).length > 0 ? 1 : 0);
  }, 0);

  // 7-day trend (avg last 7 vs avg previous 7)
  const last7 = allWeightData.slice(-7).map(d=>d.w);
  const prev7 = allWeightData.slice(-14,-7).map(d=>d.w);
  const avgLast7 = last7.length ? last7.reduce((a,b)=>a+b,0)/last7.length : null;
  const avgPrev7 = prev7.length ? prev7.reduce((a,b)=>a+b,0)/prev7.length : null;
  const weekTrend = (avgLast7 && avgPrev7) ? avgLast7 - avgPrev7 : null;

  // Heaviest / lightest
  const allW = allWeightData.map(d=>d.w);
  const heaviest = allW.length ? Math.max(...allW) : null;
  const lightest = allW.length ? Math.min(...allW) : null;

  // Weekly averages
  const weeklyAvgs = (() => {
    if(allWeightData.length < 2) return [];
    const byWeek = {};
    allWeightData.forEach(({date, w}) => {
      const d = new Date(date+"T12:00:00");
      const yr = d.getFullYear();
      const wk = Math.ceil(((d - new Date(yr,0,1))/86400000 + new Date(yr,0,1).getDay()+1)/7);
      const key = `${yr}-W${String(wk).padStart(2,"0")}`;
      if(!byWeek[key]) byWeek[key] = [];
      byWeek[key].push(w);
    });
    return Object.entries(byWeek)
      .sort(([a],[b])=>a.localeCompare(b))
      .map(([wk, ws]) => ({ wk, avg: ws.reduce((a,b)=>a+b,0)/ws.length, count: ws.length }));
  })();

  const saveProfile = async () => {
    const newP = {...profile, name:name.trim(), startWeight:parseFloat(sw)||175, goalWeight:parseFloat(gw)||null, startDate:sd, currentWeight};
    setProfile(newP);
    await storageSet("profile", newP);
    setProfileSetUp && setProfileSetUp(true);
    setEditProfile(false);
  };

  const saveEditEntry = async (dateKey) => {
    const w = parseFloat(editVal);
    if(isNaN(w)||w<100||w>400) { setEditingEntry(null); return; }
    const newLogs = {...logs, [dateKey]: {...(logs[dateKey]||{}), weight: w}};
    setLogs(newLogs);
    await storageSet("logs", newLogs);
    setEditingEntry(null);
    // milestone check
    const gained2 = w - profile.startWeight;
    for(const m of MILESTONES) {
      if(gained2 >= m.lbs && gained < m.lbs) { onCelebrate(m); break; }
    }
  };

  const deleteEntry = async (dateKey) => {
    const newLogs = {...logs};
    if(newLogs[dateKey]) {
      const day = {...newLogs[dateKey]};
      delete day.weight;
      newLogs[dateKey] = day;
    }
    setLogs(newLogs);
    await storageSet("logs", newLogs);
  };

  const saveAddEntry = async () => {
    if(!addDate || !addVal) return;
    const w = parseFloat(addVal);
    if(isNaN(w)||w<100||w>400) return;
    const newLogs = {...logs, [addDate]: {...(logs[addDate]||{}), weight: w}};
    setLogs(newLogs);
    await storageSet("logs", newLogs);
    setAddDate(""); setAddVal(""); setShowAddForm(false);
    const gained2 = w - profile.startWeight;
    for(const m of MILESTONES) {
      if(gained2 >= m.lbs && gained < m.lbs) { onCelebrate(m); break; }
    }
  };

  // SVG chart
  const chartH = 130, chartW = 310;
  let chartPath = "", chartArea = "", chartPoints = [];
  if(filtered.length >= 2) {
    const ws = filtered.map(d=>d.w);
    const mn = Math.min(...ws) - 1.5, mx = Math.max(...ws) + 1.5;
    chartPoints = filtered.map((d,i) => ({
      x: (i/(filtered.length-1))*chartW,
      y: chartH - ((d.w-mn)/(mx-mn))*chartH,
      w: d.w, date: d.date,
    }));
    const ptStr = chartPoints.map(p=>`${p.x},${p.y}`).join(" L ");
    chartPath  = `M ${ptStr}`;
    chartArea  = `M ${chartPoints[0].x},${chartPoints[0].y} L ${ptStr} L ${chartW},${chartH} L 0,${chartH} Z`;
  }

  // Y-axis labels
  const yLabels = (() => {
    if(filtered.length < 2) return [];
    const ws = filtered.map(d=>d.w);
    const mn = Math.floor(Math.min(...ws)-1), mx = Math.ceil(Math.max(...ws)+1);
    const step = Math.ceil((mx-mn)/4);
    const out = [];
    for(let v=mn; v<=mx; v+=step) out.push(v);
    return out.map(v=>({
      v, y: chartH - ((v-mn+1.5)/((mx-mn)+3))*chartH,
    }));
  })();

  const badges = [
    {lbs:1,emoji:"🌱",label:"First Pound"},{lbs:2,emoji:"💧",label:"2 lbs"},
    {lbs:5,emoji:"🔥",label:"5 lbs"},{lbs:10,emoji:"⚡",label:"10 lbs"},
    {lbs:15,emoji:"💎",label:"15 lbs"},{lbs:20,emoji:"🏆",label:"Goal!"},
  ];

  const S = {
    label: {fontFamily:"'DM Sans',sans-serif",fontSize:10,color:`${P.muted}`,fontWeight:600,textTransform:"uppercase",letterSpacing:0.5},
    val:   {fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900},
    card:  {background:`${P.card}`,borderRadius:24,border:`1px solid rgba(${P.ink},0.16)`},
  };

  return (
    <div style={{padding:"16px",display:"flex",flexDirection:"column",gap:18,animation:MOTION?"none":"fadeUp 0.4s ease both"}}>

      {/* ── HEADER ── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
        <div>
          <div style={{...S.val,fontSize:34,color:`${P.text}`,letterSpacing:1}}>
            WEIGHT <span style={{color:`${P.acc}`}}>LOG</span>
          </div>
          <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:`${P.muted}`,marginTop:2}}>{allWeightData.length} entries recorded</div>
        </div>
        <button onClick={()=>setShowAddForm(!showAddForm)} style={{
          background:showAddForm?`rgba(${P.ink},0.13)`:`linear-gradient(135deg,${P.acc},${P.acc2})`,
          border:"none",borderRadius:16,padding:"8px 16px",cursor:"pointer",
          fontFamily:"'Barlow Condensed',sans-serif",fontSize:15,fontWeight:800,
          color:showAddForm?`${P.sub}`:`${P.onAcc}`,letterSpacing:0.5,
        }}>{showAddForm ? "✕ Cancel" : "+ ADD ENTRY"}</button>
      </div>

      {/* ── ADD ENTRY FORM ── */}
      {showAddForm && (
        <div style={{...S.card,padding:16,border:`1px solid ${P.acc}33`,animation:"fadeUp 0.3s ease"}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:800,color:`${P.acc}`,marginBottom:12}}>ADD / UPDATE WEIGHT ENTRY</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div>
              <div style={{...S.label,marginBottom:5}}>Date</div>
              <input type="date" value={addDate} onChange={e=>setAddDate(e.target.value)} max={today}
                style={{width:"100%",padding:"10px 12px",background:`${P.inset}`,border:`1px solid rgba(${P.ink},0.22)`,borderRadius:14,color:`${P.text}`,fontFamily:"'DM Sans',sans-serif",fontSize:13,outline:"none"}}/>
            </div>
            <div>
              <div style={{...S.label,marginBottom:5}}>Weight (lbs)</div>
              <input type="number" step="0.1" value={addVal} onChange={e=>setAddVal(e.target.value)} placeholder="175.0"
                style={{width:"100%",padding:"10px 12px",background:`${P.inset}`,border:`1px solid rgba(${P.ink},0.22)`,borderRadius:14,color:`${P.text}`,fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:700,outline:"none",textAlign:"center"}}/>
            </div>
          </div>
          <button onClick={saveAddEntry} style={{
            width:"100%",marginTop:12,padding:"12px",
            background:`linear-gradient(135deg,${P.acc},${P.acc2})`,border:"none",borderRadius:14,cursor:"pointer",
            fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:800,color:`${P.onAcc}`,letterSpacing:1,
          }}>SAVE ENTRY</button>
        </div>
      )}

      {/* ── HERO STAT ── */}
      <div style={{...S.card,padding:20,background:`linear-gradient(135deg,rgba(${P.accRgb},0.10),${P.card})`,border:`1px solid ${P.acc}33`,position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",right:16,top:10,fontSize:56,opacity:0.06}}>⚖️</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16,marginBottom:16}}>
          <div>
            <div style={{...S.label}}>Start</div>
            <div style={{...S.val,fontSize:26,color:`${P.text}`}}>{profile.startWeight}<span style={{fontSize:14,color:`${P.muted}`}}> lbs</span></div>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{...S.label}}>Current</div>
            <div style={{...S.val,fontSize:26,color:`${P.info}`}}>{currentWeight}<span style={{fontSize:14,color:`${P.muted}`}}> lbs</span></div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{...S.label}}>Goal</div>
            <div style={{...S.val,fontSize:26,color:`${P.good}`}}>{goal}<span style={{fontSize:14,color:`${P.muted}`}}> lbs</span></div>
          </div>
        </div>
        <div style={{textAlign:"center",marginBottom:14}}>
          <div style={{...S.val,fontSize:52,color:gained>=0?`${P.acc}`:`${P.bad}`,lineHeight:1}}>
            {gained>=0?"+":""}{gained.toFixed(1)} <span style={{fontSize:24,color:`rgba(${P.ink},0.4)`}}>lbs gained</span>
          </div>
        </div>
        <div style={{height:10,background:`rgba(${P.ink},0.06)`,borderRadius:5,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${gainPct}%`,background:`linear-gradient(90deg,${P.acc},${P.bad})`,borderRadius:5,transition:"width 1s ease",position:"relative"}}>
            {gainPct>8&&<div style={{position:"absolute",right:6,top:0,height:"100%",display:"flex",alignItems:"center",fontFamily:"'Barlow Condensed',sans-serif",fontSize:9,fontWeight:800,color:`${P.onAcc}`}}>{gainPct.toFixed(0)}%</div>}
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:5}}>
          <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:`${P.muted}`}}>{profile.startWeight} lbs</span>
          <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:`${P.muted}`}}>Goal: {goal} lbs</span>
        </div>
      </div>

      {/* ── STAT PILLS ── */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
        {[
          {label:"7-day avg", val: avgLast7 ? avgLast7.toFixed(1) : "—", color:`${P.info}`, icon:"📊"},
          {label:"Week trend", val: weekTrend!=null ? `${weekTrend>=0?"+":""}${weekTrend.toFixed(1)}` : "—", color: weekTrend!=null&&weekTrend>=0?`${P.good}`:`${P.bad}`, icon: weekTrend!=null&&weekTrend>=0?"📈":"📉"},
          {label:"Heaviest",  val: heaviest ? heaviest.toFixed(1) : "—", color:`${P.bad}`, icon:"🔺"},
          {label:"Lightest",  val: lightest ? lightest.toFixed(1) : "—", color:`${P.good}`, icon:"🔻"},
        ].map(s=>(
          <div key={s.label} style={{...S.card,padding:"12px 8px",textAlign:"center"}}>
            <div style={{fontSize:16}}>{s.icon}</div>
            <div style={{...S.val,fontSize:17,color:s.color,marginTop:3}}>{s.val}</div>
            <div style={{...S.label,marginTop:2,fontSize:9}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* ── CHART ── */}
      <div style={{...S.card,padding:18}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{...S.val,fontSize:18,color:`${P.text}`}}>WEIGHT CHART</div>
          <div style={{display:"flex",gap:4}}>
            {[["7","7D"],["30","30D"],["all","All"]].map(([v,l])=>(
              <button key={v} onClick={()=>setChartRange(v)} style={{
                padding:"4px 10px",borderRadius:8,border:"none",cursor:"pointer",
                background: chartRange===v ? `${P.acc}` : `rgba(${P.ink},0.13)`,
                color: chartRange===v ? `${P.onAcc}` : `${P.sub}`,
                fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:700,
              }}>{l}</button>
            ))}
          </div>
        </div>

        {filtered.length < 2 ? (
          <div style={{textAlign:"center",padding:"30px 0",color:`rgba(${P.ink},0.2)`,fontFamily:"'DM Sans',sans-serif",fontSize:13}}>
            Log at least 2 days of weight to see your chart
          </div>
        ) : (
          <div style={{overflowX:"auto"}}>
            <svg width={chartW+36} height={chartH+32} style={{display:"block",overflow:"visible"}}>
              <defs>
                <linearGradient id="cg2" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stopColor={`${P.acc}`} stopOpacity="0.35"/>
                  <stop offset="100%" stopColor={`${P.acc}`} stopOpacity="0"/>
                </linearGradient>
              </defs>
              <g transform="translate(32,4)">
                {/* Grid lines */}
                {[0,0.25,0.5,0.75,1].map(t=>(
                  <line key={t} x1={0} y1={t*chartH} x2={chartW} y2={t*chartH} stroke={`rgba(${P.ink},0.04)`} strokeWidth="1"/>
                ))}
                {/* Area fill */}
                {chartArea && <path d={chartArea} fill="url(#cg2)"/>}
                {/* Line */}
                {chartPath && <path d={chartPath} fill="none" stroke={`${P.acc}`} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>}
                {/* Points */}
                {chartPoints.map((p,i)=>(
                  <g key={i}>
                    <circle cx={p.x} cy={p.y} r="5" fill={`${P.acc}`} stroke={`${P.bg}`} strokeWidth="2"/>
                    {(i===0||i===chartPoints.length-1||chartPoints.length<=10) && (
                      <text x={p.x} y={p.y-10} textAnchor="middle" fill={`${P.acc}`}
                        style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:10,fontWeight:700}}>{p.w}</text>
                    )}
                  </g>
                ))}
                {/* Y-axis labels */}
                {yLabels.map(({v,y})=>(
                  <text key={v} x={-6} y={y+4} textAnchor="end" fill={`${P.muted}`}
                    style={{fontFamily:"'DM Sans',sans-serif",fontSize:9}}>{v}</text>
                ))}
                {/* X-axis labels */}
                {filtered.length > 1 && [0, filtered.length-1].map(i=>(
                  <text key={i} x={chartPoints[i]?.x} y={chartH+16} textAnchor={i===0?"start":"end"} fill={`${P.muted}`}
                    style={{fontFamily:"'DM Sans',sans-serif",fontSize:9}}>
                    {filtered[i]?.date?.slice(5)}
                  </text>
                ))}
              </g>
            </svg>
          </div>
        )}
      </div>

      {/* ── WEEKLY AVERAGES ── */}
      {weeklyAvgs.length > 1 && (
        <div style={{...S.card,padding:18}}>
          <div style={{...S.val,fontSize:18,color:`${P.text}`,marginBottom:14}}>WEEKLY AVERAGES</div>
          <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:220,overflowY:"auto"}}>
            {[...weeklyAvgs].reverse().map((w,i)=>{
              const prev = weeklyAvgs[weeklyAvgs.length-2-i];
              const delta = prev ? w.avg - prev.avg : null;
              return (
                <div key={w.wk} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",background:`${P.inset}`,borderRadius:14}}>
                  <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:`${P.muted}`,width:60,flexShrink:0}}>{w.wk}</div>
                  <div style={{flex:1,height:4,background:`rgba(${P.ink},0.06)`,borderRadius:2,overflow:"hidden"}}>
                    <div style={{height:"100%",width:`${Math.min(100,((w.avg-profile.startWeight)/20)*100)}%`,background:`linear-gradient(90deg,${P.acc},${P.bad})`,borderRadius:2}}/>
                  </div>
                  <div style={{...S.val,fontSize:17,color:`${P.text}`,textAlign:"right",minWidth:54}}>{w.avg.toFixed(1)}</div>
                  {delta!=null && (
                    <div style={{...S.val,fontSize:13,color:delta>=0?`${P.good}`:`${P.bad}`,minWidth:40,textAlign:"right"}}>
                      {delta>=0?"+":""}{delta.toFixed(1)}
                    </div>
                  )}
                  <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:`rgba(${P.ink},0.3)`,minWidth:28}}>{w.count}d</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── DAILY LOG TABLE ── */}
      <div style={{...S.card,padding:18}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{...S.val,fontSize:18,color:`${P.text}`}}>DAILY WEIGHT LOG</div>
          <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:`${P.muted}`}}>{allWeightData.length} entries · tap to edit</div>
        </div>

        {allWeightData.length === 0 ? (
          <div style={{textAlign:"center",padding:"24px 0",color:`rgba(${P.ink},0.2)`,fontFamily:"'DM Sans',sans-serif",fontSize:13}}>
            No weight entries yet. Start logging from the Log tab or use + Add Entry above.
          </div>
        ) : (
          <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:380,overflowY:"auto"}}>
            {[...allWeightData].reverse().map((entry, idx) => {
              const prev = allWeightData[allWeightData.length - 2 - idx];
              const delta = prev ? entry.w - prev.w : null;
              const isEdit = editingEntry === entry.date;
              const d = new Date(entry.date + "T12:00:00");
              const label = `${DAY_NAMES[d.getDay()]}, ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}`;
              const isToday2 = entry.date === today;
              return (
                <div key={entry.date} style={{
                  display:"flex",alignItems:"center",gap:10,padding:"10px 12px",
                  background: isToday2 ? `${P.info}18` : (idx%2===0?`${P.inset}`:`${P.inset2}`),
                  borderRadius:16,
                  border: isToday2 ? `1px solid ${P.info}44` : "1px solid transparent",
                  animation:`fadeUp 0.25s ${Math.min(idx,10)*0.03}s both`,
                }}>
                  {/* Date */}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:isToday2?`${P.info}`:`${P.sub}`,fontWeight:isToday2?600:400,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                      {isToday2 ? "Today — " : ""}{label}
                    </div>
                  </div>

                  {/* Delta */}
                  <div style={{width:44,textAlign:"right"}}>
                    {delta!=null && (
                      <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:700,color:delta>0?`${P.good}`:delta<0?`${P.bad}`:`${P.muted}`}}>
                        {delta>0?"+":""}{delta.toFixed(1)}
                      </span>
                    )}
                  </div>

                  {/* Weight — inline edit or display */}
                  {isEdit ? (
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      <input autoFocus type="number" step="0.1" value={editVal} onChange={e=>setEditVal(e.target.value)}
                        onKeyDown={e=>{ if(e.key==="Enter") saveEditEntry(entry.date); if(e.key==="Escape") setEditingEntry(null); }}
                        style={{width:72,padding:"5px 8px",background:`rgba(${P.ink},0.13)`,border:`1px solid ${P.acc}`,borderRadius:8,color:`${P.acc}`,fontFamily:"'Barlow Condensed',sans-serif",fontSize:18,fontWeight:700,outline:"none",textAlign:"center"}}/>
                      <button onClick={()=>saveEditEntry(entry.date)} style={{background:`${P.good}`,border:"none",borderRadius:7,padding:"5px 9px",cursor:"pointer",color:`${P.onAcc}`,fontSize:13,fontWeight:700}}>✓</button>
                      <button onClick={()=>setEditingEntry(null)} style={{background:`rgba(${P.ink},0.13)`,border:"none",borderRadius:7,padding:"5px 9px",cursor:"pointer",color:`${P.sub}`,fontSize:13}}>✕</button>
                    </div>
                  ) : (
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <div onClick={()=>{ setEditingEntry(entry.date); setEditVal(String(entry.w)); }}
                        style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:900,color:`${P.text}`,cursor:"pointer",padding:"2px 8px",borderRadius:8,transition:"background 0.15s"}}
                        onMouseEnter={e=>e.currentTarget.style.background=`rgba(${P.ink},0.13)`}
                        onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                        {entry.w}<span style={{fontSize:12,color:`${P.muted}`,fontWeight:400}}> lbs</span>
                      </div>
                      <button onClick={()=>deleteEntry(entry.date)} style={{background:"none",border:"none",cursor:"pointer",color:`${P.bad}`,fontSize:14,opacity:0.4,padding:"2px 4px",lineHeight:1}}
                        onMouseEnter={e=>e.currentTarget.style.opacity="1"}
                        onMouseLeave={e=>e.currentTarget.style.opacity="0.4"}>🗑</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* ── MILESTONE BADGES ── */}
      <div style={{...S.card,padding:18}}>
        <div style={{...S.val,fontSize:18,color:`${P.text}`,marginBottom:14}}>MILESTONE BADGES</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          {badges.map(b=>{
            const unlocked = gained >= b.lbs;
            return (
              <div key={b.lbs} style={{
                textAlign:"center",padding:"14px 8px",borderRadius:20,
                background: unlocked?`${P.acc}18`:`rgba(${P.ink},0.03)`,
                border: unlocked?`1px solid ${P.acc}44`:`1px solid rgba(${P.ink},0.16)`,
                transition:"all 0.3s",
              }}>
                <div style={{fontSize:30,filter:unlocked?"none":"grayscale(1) opacity(0.2)",transition:"all 0.3s"}}>{b.emoji}</div>
                <div style={{...S.val,fontSize:15,color:unlocked?`${P.acc}`:`rgba(${P.ink},0.2)`,marginTop:4}}>{b.lbs===20?"GOAL!":"+"+b.lbs+" lb"}</div>
                <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:unlocked?`${P.sub}`:`rgba(${P.ink},0.2)`}}>{b.label}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* ── SETTINGS: one tab menu, one panel ── */}
      {(() => {
        const TABS = [
          {id:"profile",  label:"Profile"},
          {id:"appear",   label:"Appearance"},
          {id:"watch",    label:"Watch"},
          {id:"import",   label:"Import"},
          {id:"backup",   label:"Backup"},
        ];
        return (<div style={{...S.card, padding:0, overflow:"hidden"}}>
          <div style={{display:"flex", overflowX:"auto", borderBottom:`1px solid rgba(${P.ink},0.14)`}}>
            {TABS.map(t => (
              <button key={t.id} onClick={() => setSettingsTab(t.id)} style={{
                flex:"1 0 auto", padding:"12px 14px", background:"none", border:"none", cursor:"pointer",
                borderBottom: settingsTab===t.id ? `2px solid ${P.acc}` : "2px solid transparent",
                color: settingsTab===t.id ? P.acc : P.muted,
                fontFamily:"'Barlow Condensed',sans-serif", fontSize:14, fontWeight:800, letterSpacing:0.5, whiteSpace:"nowrap",
              }}>{t.label}</button>
            ))}
          </div>
          <div style={{padding:18}}>
            {settingsTab === "profile" && (
              <div>
                <div style={{display:"flex",justifyContent:"flex-end",marginBottom:editProfile?14:0}}>
                  <button onClick={()=>setEditProfile(!editProfile)} style={{background:`rgba(${P.ink},0.13)`,border:"none",color:`${P.sub}`,padding:"6px 14px",borderRadius:8,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600}}>
                    {editProfile?"Cancel":"Edit"}
                  </button>
                </div>
                {editProfile && (
                  <div style={{display:"flex",flexDirection:"column",gap:12,animation:"fadeUp 0.3s ease"}}>
                    <div>
                      <label style={{...S.label,display:"block",marginBottom:5}}>Name</label>
                      <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" style={{width:"100%",padding:"10px 14px",background:`${P.inset}`,border:`1px solid rgba(${P.ink},0.22)`,borderRadius:14,color:`${P.text}`,fontFamily:"'DM Sans',sans-serif",fontSize:16,outline:"none"}}/>
                    </div>
                    <div>
                      <label style={{...S.label,display:"block",marginBottom:5}}>Starting Weight (lbs)</label>
                      <input type="number" value={sw} onChange={e=>setSw(e.target.value)} style={{width:"100%",padding:"10px 14px",background:`${P.inset}`,border:`1px solid rgba(${P.ink},0.22)`,borderRadius:14,color:`${P.text}`,fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:700,outline:"none"}}/>
                    </div>
                    <div>
                      <label style={{...S.label,display:"block",marginBottom:5}}>Goal Weight (lbs)</label>
                      <input type="number" value={gw} onChange={e=>setGw(e.target.value)} style={{width:"100%",padding:"10px 14px",background:`${P.inset}`,border:`1px solid rgba(${P.ink},0.22)`,borderRadius:14,color:`${P.text}`,fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:700,outline:"none"}}/>
                    </div>
                    <div>
                      <label style={{...S.label,display:"block",marginBottom:5}}>Program Start Date</label>
                      <input type="date" value={sd} onChange={e=>setSd(e.target.value)} style={{width:"100%",padding:"10px 14px",background:`${P.inset}`,border:`1px solid rgba(${P.ink},0.22)`,borderRadius:14,color:`${P.text}`,fontFamily:"'DM Sans',sans-serif",fontSize:14,outline:"none"}}/>
                    </div>
                    <button onClick={saveProfile} style={{padding:"12px",background:`linear-gradient(135deg,${P.acc},${P.acc2})`,border:"none",borderRadius:14,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:800,color:`${P.onAcc}`,letterSpacing:1}}>SAVE PROFILE</button>
                  </div>
                )}
                {!editProfile && (
                  <div>
                    {profile.name && <div style={{...S.val,fontSize:20,color:P.text,marginBottom:10}}>{profile.name}</div>}
                    <div style={{display:"flex",gap:24,flexWrap:"wrap"}}>
                      <div><div style={{...S.label}}>Start</div><div style={{...S.val,fontSize:22,color:`${P.text}`}}>{profile.startWeight} lbs</div></div>
                      <div><div style={{...S.label}}>Goal</div><div style={{...S.val,fontSize:22,color:`${P.acc}`}}>{goal} lbs</div></div>
                      <div><div style={{...S.label}}>Since</div><div style={{...S.val,fontSize:18,color:`${P.info}`}}>{profile.startDate||"—"}</div></div>
                      <div><div style={{...S.label}}>To go</div><div style={{...S.val,fontSize:22,color:`${P.good}`}}>{Math.max(0,goal-currentWeight)} lbs</div></div>
                    </div>
                  </div>
                )}
              </div>
            )}
            {settingsTab === "appear" && <AppearanceCard/>}
            {settingsTab === "watch" && <WatchSettingsCard/>}
            {settingsTab === "import" && <WatchImportCard logs={logs} setLogs={setLogs} onCelebrate={onCelebrate}/>}
            {settingsTab === "backup" && <DataCard logs={logs} setLogs={setLogs} onCelebrate={onCelebrate}/>}
          </div>
        </div>);
      })()}

    </div>
  );
}

/* ─── MAIN APP ───────────────────────────────────────────────────────────── */
function App() {
  const [view, setView] = useState("dashboard");
  const [selectedDate, setSelectedDate] = useState(todayKey());
  const [logs, setLogs] = useState({});
  const [profile, setProfile] = useState({ name:"", startWeight:175, goalWeight:null, startDate:todayKey(), currentWeight:175 });
  const [profileSetUp, setProfileSetUp] = useState(true); // false only once we know for sure no profile was ever saved
  const [celebration, setCelebration] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [activeTimer, setActiveTimer] = useState(null); // { exercise, setNum, totalSets, color }
  const celebQueue = useRef([]);

  useEffect(() => {
    (async () => {
      const l = await storageGet("logs");
      const p = await storageGet("profile");
      if(l) setLogs(l);
      if(p) setProfile(p); else setProfileSetUp(false);
      setLoaded(true);
    })();
  }, []);

  const handleCelebrate = useCallback((data) => {
    if(celebration) { celebQueue.current.push(data); return; }
    setCelebration(data);
  }, [celebration]);

  const handleCelebDone = useCallback(() => {
    if(celebQueue.current.length > 0) { setCelebration(celebQueue.current.shift()); }
    else { setCelebration(null); }
  }, []);

  const stopTimer = useCallback(() => setActiveTimer(null), []);   // timer ran out
  const { startTimer, cancelTimer, adjustTimer, activity, health } = useWatchLive({ logs, setLogs, activeTimer, setActiveTimer });

  // Lenis smooths wheel/trackpad scrolling; phones keep native touch scrolling and inner lists scroll on their own
  const lenis = useRef(null);
  useEffect(() => {
    if (!window.Lenis || REDUCED_MOTION) return;
    lenis.current = new Lenis({ autoRaf: true, allowNestedScroll: true });
    return () => { lenis.current.destroy(); lenis.current = null; };
  }, []);
  // each tab opens at the top, with its sections staggering in
  const viewRef = useRef(null);
  useEffect(() => { if (lenis.current) lenis.current.scrollTo(0, { immediate: true }); else window.scrollTo(0, 0); }, [view]);
  useStaggerIn(viewRef, loaded ? view : null);

  if(!loaded) return (
    <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"transparent",flexDirection:"column",gap:16}}>
      <div style={{width:48,height:48,borderRadius:"50%",border:`3px solid ${P.acc}33`,borderTopColor:`${P.acc}`,animation:"spin 0.8s linear infinite"}}/>
      <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,color:`${P.sub}`,letterSpacing:2}}>LOADING YOUR PLAN...</div>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:"transparent",display:"flex",flexDirection:"column",maxWidth:480,margin:"0 auto",fontFamily:"'DM Sans',sans-serif",color:`${P.text}`,position:"relative"}}>
      <GlobalStyle/>
      {celebration && <Celebration data={celebration} onDone={handleCelebDone}/>}
      {activeTimer && <TimerIsland timer={activeTimer} onStop={stopTimer} onCancel={cancelTimer} onAdjust={adjustTimer}/>}
      <div ref={viewRef} style={{flex:1, overflowY:"auto", paddingTop: activeTimer ? 58 : 0, paddingBottom:"calc(96px + env(safe-area-inset-bottom))", transition:"padding-top 0.3s ease"}}>
        {view==="dashboard" && <Dashboard logs={logs} profile={profile} profileSetUp={profileSetUp} setView={setView} setSelectedDate={setSelectedDate} setLogs={setLogs} onCelebrate={handleCelebrate} activity={activity} health={health}/>}
        {view==="log" && <DailyLog selectedDate={selectedDate} logs={logs} setLogs={setLogs} onCelebrate={handleCelebrate} profile={profile} activeTimer={activeTimer} onStartTimer={startTimer} onStopTimer={cancelTimer}/>}
        {view==="calendar" && <Calendar logs={logs} selectedDate={selectedDate} setSelectedDate={setSelectedDate} setView={setView}/>}
        {view==="progress" && <Progress logs={logs} setLogs={setLogs} profile={profile} setProfile={setProfile} setProfileSetUp={setProfileSetUp} onCelebrate={handleCelebrate}/>}
      </div>
      <Nav view={view} setView={setView}/>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
